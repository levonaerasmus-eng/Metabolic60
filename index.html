      try {

      } catch (e) {
        return fallback;
      }
    };

    // --- Audio Synthesizer & Speech Utilities ---
    const playTone = (freq, type, duration) => {
      try {
        const frequency = freq || 440;
        const waveType = type || 'sine';
        const dur = duration || 0.15;
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        const ctx = new AudioCtx();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = waveType;
        osc.frequency.value = frequency;
        gain.gain.setValueAtTime(0.08, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + dur);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + dur);
      } catch (e) {}
    };

      u.pitch = 1.1;
      window.speechSynthesis.speak(u);

    function Interactive3DHumanoid({ activeMuscle, exerciseName }) {
      const mountRef = useRef(null);
      const muscleMeshesRef = useRef({});

      useEffect(() => {
        const container = mountRef.current;
        if (!container) return;

        const w = container.clientWidth || 340;
        const h = container.clientHeight || 230;

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(45, w / h, 0.1, 1000);
        camera.position.set(0, 0, 7.2);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(w, h);
        renderer.setPixelRatio(window.devicePixelRatio || 1);
        container.innerHTML = '';
        container.appendChild(renderer.domElement);

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.85);
        scene.add(ambientLight);

        const frontLight = new THREE.PointLight(0xf43f5e, 2.2, 30);
        frontLight.position.set(2, 4, 4);
        scene.add(frontLight);

        const backLight = new THREE.PointLight(0x38bdf8, 1.8, 30);
        backLight.position.set(-2, -3, -4);
        scene.add(backLight);

        const bodyGroup = new THREE.Group();
        const baseMat = new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.5, metalness: 0.3 });
        const glowMat = new THREE.MeshStandardMaterial({ color: 0xf43f5e, roughness: 0.2, metalness: 0.6, emissive: 0x9f1239, emissiveIntensity: 0.9 });

        // Head
        const head = new THREE.Mesh(new THREE.SphereGeometry(0.38, 24, 24), baseMat);
        head.position.y = 2.1;
        bodyGroup.add(head);

        // Chest / Upper Torso
        const chest = new THREE.Mesh(new THREE.BoxGeometry(0.9, 0.55, 0.45), baseMat.clone());
        chest.position.y = 1.35;
        bodyGroup.add(chest);

        // Core / Abs
        const core = new THREE.Mesh(new THREE.BoxGeometry(0.72, 0.55, 0.38), baseMat.clone());
        core.position.y = 0.85;
        bodyGroup.add(core);

        // Lats / Upper Back
        const lats = new THREE.Mesh(new THREE.BoxGeometry(0.92, 0.55, 0.2), baseMat.clone());
        lats.position.set(0, 1.35, -0.15);
        bodyGroup.add(lats);

        // Shoulders
        const leftShoulder = new THREE.Mesh(new THREE.SphereGeometry(0.24, 16, 16), baseMat.clone());
        leftShoulder.position.set(-0.62, 1.45, 0);
        bodyGroup.add(leftShoulder);

        const rightShoulder = new THREE.Mesh(new THREE.SphereGeometry(0.24, 16, 16), baseMat.clone());
        rightShoulder.position.set(0.62, 1.45, 0);
        bodyGroup.add(rightShoulder);

        // Glutes
        const glutes = new THREE.Mesh(new THREE.BoxGeometry(0.85, 0.45, 0.48), baseMat.clone());
        glutes.position.set(0, 0.4, -0.05);
        bodyGroup.add(glutes);

        // Quads
        const leftQuad = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.16, 1.1, 16), baseMat.clone());
        leftQuad.position.set(-0.25, -0.35, 0.05);
        bodyGroup.add(leftQuad);

        const rightQuad = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.16, 1.1, 16), baseMat.clone());
        rightQuad.position.set(0.25, -0.35, 0.05);
        bodyGroup.add(rightQuad);

        // Hamstrings
        const leftHam = new THREE.Mesh(new THREE.CylinderGeometry(0.19, 0.15, 1.1, 16), baseMat.clone());
        leftHam.position.set(-0.25, -0.35, -0.06);
        bodyGroup.add(leftHam);

        const rightHam = new THREE.Mesh(new THREE.CylinderGeometry(0.19, 0.15, 1.1, 16), baseMat.clone());
        rightHam.position.set(0.25, -0.35, -0.06);
        bodyGroup.add(rightHam);

        // Calves
        const leftCalf = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.11, 1.0, 16), baseMat);
        leftCalf.position.set(-0.25, -1.35, 0);
        bodyGroup.add(leftCalf);

        const rightCalf = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.11, 1.0, 16), baseMat);
        rightCalf.position.set(0.25, -1.35, 0);
        bodyGroup.add(rightCalf);

        // Orbital Ring
        const ringGeo = new THREE.TorusGeometry(2.3, 0.03, 16, 80);
        const ringMat = new THREE.MeshBasicMaterial({ color: 0xf43f5e, transparent: true, opacity: 0.65 });
        const ringMesh = new THREE.Mesh(ringGeo, ringMat);
        ringMesh.rotation.x = Math.PI / 3;
        bodyGroup.add(ringMesh);

        scene.add(bodyGroup);

        muscleMeshesRef.current = {
          chest: [chest],
          core: [core],
          shoulders: [leftShoulder, rightShoulder],
          lats: [lats],
          glutes: [glutes],
          quads: [leftQuad, rightQuad],
          hamstrings: [leftHam, rightHam]
        };

        // Drag Handler
        let isDragging = false;
        let prevPos = { x: 0, y: 0 };
        const onStart = (e) => { isDragging = true; prevPos = { x: e.clientX || (e.touches && e.touches[0].clientX), y: e.clientY || (e.touches && e.touches[0].clientY) }; };
        const onMove = (e) => {
          if (!isDragging) return;
          const clientX = e.clientX || (e.touches && e.touches[0].clientX);
          const clientY = e.clientY || (e.touches && e.touches[0].clientY);
          bodyGroup.rotation.y += (clientX - prevPos.x) * 0.012;
          bodyGroup.rotation.x += (clientY - prevPos.y) * 0.008;
          prevPos = { x: clientX, y: clientY };
        };
        const onEnd = () => { isDragging = false; };
        container.addEventListener('mousedown', onStart);
        container.addEventListener('mousemove', onMove);
        window.addEventListener('mouseup', onEnd);
        container.addEventListener('touchstart', onStart);
        container.addEventListener('touchmove', onMove);
        window.addEventListener('touchend', onEnd);

        let reqId;
        const animate = () => {
          reqId = requestAnimationFrame(animate);
          if (!isDragging) bodyGroup.rotation.y += 0.008;
          ringMesh.rotation.z += 0.015;
          renderer.render(scene, camera);
        };
        animate();

        return () => {
          cancelAnimationFrame(reqId);
          container.innerHTML = '';
        };
      }, []);

        const groups = muscleMeshesRef.current;
        if (!groups) return;
        const baseMat = new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.5, metalness: 0.3 });
        const glowMat = new THREE.MeshStandardMaterial({ color: 0xf43f5e, roughness: 0.2, metalness: 0.6, emissive: 0x9f1239, emissiveIntensity: 0.9 });

        Object.keys(groups).forEach(key => {
          const meshes = groups[key];
          if (meshes) {
            const isTarget = key === activeMuscle;
            meshes.forEach(m => { m.material = isTarget ? glowMat : baseMat; });
          }
        });
      }, [activeMuscle]);

      return (
        <div className="relative w-full h-56 bg-slate-950/90 rounded-2xl border border-slate-800 overflow-hidden shadow-2xl">
          <div ref={mountRef} className="w-full h-full cursor-grab active:cursor-grabbing" />

              <p className="text-xs font-black text-rose-400 capitalize">{activeMuscle || "Full Body"}</p>
            </div>
          </div>
          <div className="absolute bottom-2.5 left-3 text-[10px] text-slate-300 font-semibold bg-slate-900/70 backdrop-blur px-2.5 py-1 rounded-lg border border-slate-800">
            Active: <span className="text-rose-300">{exerciseName || "Exercise"}</span>
          </div>
          <div className="absolute bottom-2.5 right-3 text-[9px] text-slate-500 font-medium">
            Drag 360° to rotate
          </div>
        </div>
      );
    }

    // --- Main Application Engine ---
    function App() {
      const [activeTab, setActiveTab] = useState('workout'); // 'dashboard', 'workout', 'nutrition', 'tempo', 'history'
      const [difficulty, setDifficulty] = useState(() => safeGetString('fm_difficulty', 'intermediate'));
      const [activeDay, setActiveDay] = useState(() => safeGetString('fm_day', 'A'));

      // Cycle Calendar
      const defaultStartDate = () => {
        const d = new Date();
        d.setDate(d.getDate() - 10);
        return d.toISOString().slice(0, 10);
      };
      const [periodStartDate, setPeriodStartDate] = useState(() => safeGetString('fm_period_start', defaultStartDate()));
      const [cycleLengthDays, setCycleLengthDays] = useState(() => parseInt(safeGetString('fm_cycle_len', '28'), 10));
      const [periodDurationDays, setPeriodDurationDays] = useState(() => parseInt(safeGetString('fm_period_dur', '5'), 10));

      // Voice & Audio
      const [voiceEnabled, setVoiceEnabled] = useState(() => safeGetString('fm_voice', 'true') !== 'false');
      const [handsFreeListening, setHandsFreeListening] = useState(false);
      const recognitionRef = useRef(null);

      // Tailored workout state & Persistent History
      const [customSets, setCustomSets] = useState(() => safeGetJSON('fm_custom_sets', {}));
      const [customReps, setCustomReps] = useState(() => safeGetJSON('fm_custom_reps', {}));
      const [customRest, setCustomRest] = useState(() => safeGetJSON('fm_custom_rest', {}));
      const [weightLogs, setWeightLogs] = useState(() => safeGetJSON('fm_weights', {}));
      const [completedSets, setCompletedSets] = useState(() => safeGetJSON('fm_sets', {}));
      const [streakHistory, setStreakHistory] = useState(() => safeGetJSON('fm_streak', []));
      const [sessionArchive, setSessionArchive] = useState(() => safeGetJSON('fm_session_archive', []));

      // Meal Plan Subtab & Checked Groceries State
      const [mealSubTab, setMealSubTab] = useState('plan'); // 'plan', 'recipes', 'grocery', 'prep'
      const [checkedGroceries, setCheckedGroceries] = useState(() => safeGetJSON('fm_checked_groceries', {}));

      // Daily Dashboard & Body Measurements
      const [dailyLog, setDailyLog] = useState(() => safeGetJSON('fm_daily_log', { sleep: 8, stress: 4, soreness: 3 }));
      const [bodyMetrics, setBodyMetrics] = useState(() => safeGetJSON('fm_body_metrics', { weight: 75.0, waist: 78, hips: 102, thigh: 58 }));
      
      const [focusedExerciseId, setFocusedExerciseId] = useState('i_a1');
      const [selectedExercise, setSelectedExercise] = useState(null);

      // Timers & Warmup
      const [showWarmupPlayer, setShowWarmupPlayer] = useState(false);
      const [warmupIndex, setWarmupIndex] = useState(0);
      const [warmupTimer, setWarmupTimer] = useState(45);
      const [warmupRunning, setWarmupRunning] = useState(false);

      const [timerSeconds, setTimerSeconds] = useState(60);
      const [targetTimerSec, setTargetTimerSec] = useState(60);
      const [isTimerRunning, setIsTimerRunning] = useState(false);

      const [metronomeRunning, setMetronomeRunning] = useState(false);
      const [tempoPhase, setTempoPhase] = useState('Lower (3s)');
      const [tempoCount, setTempoCount] = useState(3);

      const fileInputRef = useRef(null);

      // Cycle Math
      const computeCycleData = () => {
        try {
          const today = new Date();
          const start = new Date(periodStartDate);
          const diffMs = today.setHours(0,0,0,0) - start.setHours(0,0,0,0);
          const diffDays = Math.floor(diffMs / (1000 * 60 * 60 * 24));
          const currentDay = (diffDays % cycleLengthDays) + 1;
          const positiveDay = currentDay > 0 ? currentDay : currentDay + cycleLengthDays;

          const ovulationDay = Math.max(10, cycleLengthDays - 14);
          let calculatedPhase = 'follicular';

          if (positiveDay <= periodDurationDays) calculatedPhase = 'menstrual';
          else if (positiveDay <= ovulationDay - 2) calculatedPhase = 'follicular';
          else if (positiveDay <= ovulationDay + 1) calculatedPhase = 'ovulatory';
          else calculatedPhase = 'luteal';

          const daysUntilNextPeriod = cycleLengthDays - positiveDay + 1;
          return { cycleDay: positiveDay, phaseKey: calculatedPhase, ovulationDay, daysUntilNextPeriod };
        } catch (e) {
          return { cycleDay: 10, phaseKey: 'follicular', ovulationDay: 14, daysUntilNextPeriod: 18 };
        }
      };

      const { cycleDay, phaseKey: activeCyclePhase, ovulationDay, daysUntilNextPeriod } = computeCycleData();

      // LocalStorage Sync
      useEffect(() => {
        localStorage.setItem('fm_difficulty', difficulty);
        localStorage.setItem('fm_day', activeDay);
        localStorage.setItem('fm_period_start', periodStartDate);
        localStorage.setItem('fm_cycle_len', cycleLengthDays.toString());
        localStorage.setItem('fm_period_dur', periodDurationDays.toString());
        localStorage.setItem('fm_custom_sets', JSON.stringify(customSets));
        localStorage.setItem('fm_custom_reps', JSON.stringify(customReps));
        localStorage.setItem('fm_custom_rest', JSON.stringify(customRest));
        localStorage.setItem('fm_weights', JSON.stringify(weightLogs));
        localStorage.setItem('fm_sets', JSON.stringify(completedSets));
        localStorage.setItem('fm_streak', JSON.stringify(streakHistory));
        localStorage.setItem('fm_session_archive', JSON.stringify(sessionArchive));
        localStorage.setItem('fm_checked_groceries', JSON.stringify(checkedGroceries));
        localStorage.setItem('fm_daily_log', JSON.stringify(dailyLog));
        localStorage.setItem('fm_body_metrics', JSON.stringify(bodyMetrics));
        localStorage.setItem('fm_voice', voiceEnabled.toString());
      }, [difficulty, activeDay, periodStartDate, cycleLengthDays, periodDurationDays, customSets, customReps, customRest, weightLogs, completedSets, streakHistory, sessionArchive, checkedGroceries, dailyLog, bodyMetrics, voiceEnabled]);

      // Speech Recognition
      useEffect(() => {
        const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (SpeechRec) {
          const rec = new SpeechRec();
          rec.continuous = true;
          rec.interimResults = false;
          rec.lang = 'en-US';
          rec.onresult = (e) => {
            const last = e.results.length - 1;
            const command = e.results[last][0].transcript.trim().toLowerCase();
            handleVoiceCommand(command);
          };
          rec.onerror = () => setHandsFreeListening(false);
          recognitionRef.current = rec;
        }
      }, []);

      const toggleHandsFree = () => {
        if (!recognitionRef.current) {
          alert("Speech recognition is not supported in this browser. Please use Chrome or Safari.");
          return;
        }
        if (handsFreeListening) {
          recognitionRef.current.stop();
          setHandsFreeListening(false);
          speakCoach("Voice control paused.", voiceEnabled);
        } else {
          try {
            recognitionRef.current.start();
            setHandsFreeListening(true);
            speakCoach("Voice control active. Say 'Complete Set'.", voiceEnabled);
          } catch (e) {
            setHandsFreeListening(false);
          }
        }
      };

      const handleVoiceCommand = (cmd) => {
        if (cmd.includes("complete") || cmd.includes("done") || cmd.includes("finish") || cmd.includes("next")) {
          triggerNextIncompleteSet();
        } else if (cmd.includes("pause") || cmd.includes("stop")) {
          setIsTimerRunning(false);
          setMetronomeRunning(false);
        } else if (cmd.includes("resume") || cmd.includes("start")) {
          setIsTimerRunning(true);
        } else if (cmd.includes("tempo") || cmd.includes("metronome")) {
          setActiveTab('tempo');
          setMetronomeRunning(true);
        }
      };

      // Rest Timer Interval
      useEffect(() => {
        let interval = null;
        if (isTimerRunning && timerSeconds > 0) {
          interval = setInterval(() => {
            setTimerSeconds((prev) => {
              if (prev <= 4 && prev > 1) playTone(550, 'triangle', 0.08);
              else if (prev === 1) {
                playTone(880, 'sine', 0.3);
                speakCoach("Break is over. Next set ready.", voiceEnabled);
                autoScrollToNextExercise();
              }
              return prev - 1;
            });
          }, 1000);
        } else if (timerSeconds === 0) {
          setIsTimerRunning(false);
          setTimerSeconds(targetTimerSec);
        }
        return () => clearInterval(interval);
      }, [isTimerRunning, timerSeconds, voiceEnabled, targetTimerSec]);

      // Warmup Interval
      useEffect(() => {
        let timer = null;
        if (warmupRunning && warmupTimer > 0) {
          timer = setInterval(() => setWarmupTimer(prev => prev - 1), 1000);
        } else if (warmupTimer === 0 && warmupRunning) {
          if (warmupIndex < WARMUP_ROUTINE.length - 1) {
            setWarmupIndex(prev => prev + 1);
            setWarmupTimer(WARMUP_ROUTINE[warmupIndex + 1].dur);
            playTone(700, 'sine', 0.2);
            speakCoach(`Next: ${WARMUP_ROUTINE[warmupIndex + 1].name}`, voiceEnabled);
          } else {
            setWarmupRunning(false);
            setShowWarmupPlayer(false);
            speakCoach("Warm-up complete! You are primed to lift.", voiceEnabled);
            if (window.confetti) window.confetti({ particleCount: 50, spread: 60 });
          }
        }
        return () => clearInterval(timer);
      }, [warmupRunning, warmupTimer, warmupIndex, voiceEnabled]);

      // Metronome Interval
      useEffect(() => {
        let timer = null;
        if (metronomeRunning) {
          let step = 0;
          timer = setInterval(() => {
            if (step === 0) { setTempoPhase('Lowering (Down)'); setTempoCount(3); playTone(400, 'sine', 0.06); }
            else if (step === 1) { setTempoCount(2); playTone(400, 'sine', 0.06); }
            else if (step === 2) { setTempoCount(1); playTone(400, 'sine', 0.06); }
            else if (step === 3) { setTempoPhase('Drive Up (Lift)'); setTempoCount(1); playTone(800, 'triangle', 0.1); }
            step = (step + 1) % 4;
          }, 1000);
        }
        return () => clearInterval(timer);
      }, [metronomeRunning]);

      // Readiness Calculations
      const readinessScore = Math.max(1, Math.min(10, Math.round(dailyLog.sleep - dailyLog.stress * 0.4 - dailyLog.soreness * 0.4 + 4)));
      const isHighCortisol = readinessScore <= 5;
      const loadMultiplier = (isHighCortisol ? 0.85 : 1.0) * (CYCLE_MODES[activeCyclePhase] ? CYCLE_MODES[activeCyclePhase].modifier : 1.0);

      const currentExercises = MASTER_EXERCISE_DATA[difficulty][activeDay] || MASTER_EXERCISE_DATA.intermediate.A;
      const activeExerciseObj = currentExercises.find(e => e.id === focusedExerciseId) || currentExercises[0];

      const autoScrollToNextExercise = () => {
        for (const ex of currentExercises) {
          const sCount = customSets[ex.id] ?? ex.defaultSets;
          for (let i = 0; i < sCount; i++) {
            if (!completedSets[`${ex.id}_set_${i}`]) {
              setFocusedExerciseId(ex.id);
              const el = document.getElementById(`ex_card_${ex.id}`);
              if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
              return;
            }
          }
        }
      };

      const triggerNextIncompleteSet = () => {
        for (const ex of currentExercises) {
          const sCount = customSets[ex.id] ?? ex.defaultSets;
          const rest = customRest[ex.id] ?? ex.defaultRest;
          for (let i = 0; i < sCount; i++) {
            const key = `${ex.id}_set_${i}`;
            if (!completedSets[key]) {
              triggerSetComplete(key, rest, ex.id);
              return;
            }
          }
        }
      };

      const triggerSetComplete = (setKey, restSec, exId) => {
        const nextState = !completedSets[setKey];
        const updated = { ...completedSets, [setKey]: nextState };
        setCompletedSets(updated);

        if (exId) setFocusedExerciseId(exId);

        if (nextState) {
          const duration = restSec || 60;
          setTargetTimerSec(duration);
          setTimerSeconds(duration);
          setIsTimerRunning(true);
          playTone(520, 'sine', 0.1);
          speakCoach(`Good set. Rest for ${duration} seconds.`, voiceEnabled);

          const today = new Date().toISOString().slice(0, 10);
          if (!streakHistory.includes(today)) {
            setStreakHistory([...streakHistory, today]);
          }
        }
      };

      const advanceToNextWorkout = () => {
        const nextDayMap = { 'A': 'B', 'B': 'C', 'C': 'A' };
        const nextDay = nextDayMap[activeDay] || 'A';

        const newRecord = {
          date: new Date().toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }),
          workoutDay: activeDay,
          difficulty: difficulty,
          tonnage: totalSessionTonnage,
          timestamp: Date.now()
        };
        setSessionArchive([newRecord, ...sessionArchive]);

        const cleanSets = { ...completedSets };
        currentExercises.forEach(ex => {
          const sCount = customSets[ex.id] ?? ex.defaultSets;
          for (let i = 0; i < sCount; i++) {
            delete cleanSets[`${ex.id}_set_${i}`];
          }
        });
        setCompletedSets(cleanSets);

        setActiveDay(nextDay);
        const nextExercises = MASTER_EXERCISE_DATA[difficulty][nextDay] || [];
        if (nextExercises.length > 0) setFocusedExerciseId(nextExercises[0].id);

        if (window.confetti) {
          window.confetti({ particleCount: 150, spread: 80, origin: { y: 0.6 } });
        }
        speakCoach(`Session logged! Advanced to Workout ${nextDay}.`, voiceEnabled);
      };

      const adjustSetCount = (exId, delta, defaultCount) => {
        const currentCount = customSets[exId] ?? defaultCount;
        const newCount = Math.max(1, Math.min(6, currentCount + delta));
        setCustomSets({ ...customSets, [exId]: newCount });
      };

      const adjustRest = (exId, seconds) => {
        setCustomRest({ ...customRest, [exId]: seconds });
        setTargetTimerSec(seconds);
        setTimerSeconds(seconds);
      };

      const applyProgressiveOverload = (exId, currentW) => {
        const newW = currentW + 0.5;
        setWeightLogs({ ...weightLogs, [exId]: newW });
        speakCoach(`Load increased to ${newW.toFixed(1)} kilograms.`, voiceEnabled);
      };

      const toggleGrocery = (item) => {
        setCheckedGroceries(prev => ({ ...prev, [item]: !prev[item] }));
      };

      const exportUserData = () => {
        const backupObj = {
          difficulty, activeDay, periodStartDate, cycleLengthDays, periodDurationDays, customSets, customReps, customRest, weightLogs, completedSets, streakHistory, sessionArchive, checkedGroceries, dailyLog, bodyMetrics, date: new Date().toISOString()
        };
        const blob = new Blob([JSON.stringify(backupObj, null, 2)], { type: "application/json" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = `fem_metabolic_backup_${new Date().toISOString().slice(0, 10)}.json`;
        a.click();
        URL.revokeObjectURL(url);
      };

      const importUserData = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (evt) => {
          try {
            const data = JSON.parse(evt.target.result);
            if (data.difficulty) setDifficulty(data.difficulty);
            if (data.periodStartDate) setPeriodStartDate(data.periodStartDate);
            if (data.cycleLengthDays) setCycleLengthDays(data.cycleLengthDays);
            if (data.periodDurationDays) setPeriodDurationDays(data.periodDurationDays);
            if (data.customSets) setCustomSets(data.customSets);
            if (data.customReps) setCustomReps(data.customReps);
            if (data.customRest) setCustomRest(data.customRest);
            if (data.weightLogs) setWeightLogs(data.weightLogs);
            if (data.completedSets) setCompletedSets(data.completedSets);
            if (data.streakHistory) setStreakHistory(data.streakHistory);
            if (data.sessionArchive) setSessionArchive(data.sessionArchive);
            if (data.checkedGroceries) setCheckedGroceries(data.checkedGroceries);
            if (data.bodyMetrics) setBodyMetrics(data.bodyMetrics);
            alert("Backup restored successfully!");
          } catch (err) {
            alert("Invalid backup file.");
          }
        };
        reader.readAsText(file);
      };

      // Tonnage Math
      const totalSessionTonnage = currentExercises.reduce((total, ex) => {
        const loggedW = (weightLogs[ex.id] ?? ex.defaultWeight) * loadMultiplier;
        const sCount = customSets[ex.id] ?? ex.defaultSets;
        const reps = customReps[ex.id] ?? ex.defaultReps;
        let completedCount = 0;
        for (let i = 0; i < sCount; i++) if (completedSets[`${ex.id}_set_${i}`]) completedCount++;
        return total + Math.round(completedCount * reps * loggedW);
      }, 0);

      let totalSetsCount = 0;
      let completedSetsCount = 0;
      currentExercises.forEach(ex => {
        const sCount = customSets[ex.id] ?? ex.defaultSets;
        for (let i = 0; i < sCount; i++) {
          totalSetsCount++;
          if (completedSets[`${ex.id}_set_${i}`]) completedSetsCount++;
        }
      });
      const isWorkoutFullyCompleted = totalSetsCount > 0 && totalSetsCount === completedSetsCount;

      const radius = 22;
      const circumference = 2 * Math.PI * radius;
      const strokeDashoffset = circumference - (timerSeconds / (targetTimerSec || 60)) * circumference;

      return (
        <div className="min-h-screen max-w-md mx-auto bg-slate-950 pb-36 font-sans">
          
          {/* Top Sticky Header */}
          <div className="sticky top-0 z-30 bg-slate-950/95 backdrop-blur-md border-b border-slate-800 px-4 py-3">
            <header className="flex justify-between items-center">
              <div>
                <h1 className="text-lg font-black text-white tracking-tight flex items-center gap-1.5">
                  <span className="text-rose-500">🌸</span> FemMetabolic Pro
                </h1>
                <p className="text-[10px] text-slate-400">3D Biomechanics & Nutrition Suite</p>
              </div>
              <div className="flex items-center gap-2">
                <button
                  onClick={toggleHandsFree}
                  className={`px-2.5 py-1.5 rounded-xl border text-xs font-bold transition-all flex items-center gap-1.5 ${
                    handsFreeListening
                      ? 'bg-rose-600 text-white border-rose-500 shadow-lg shadow-rose-900/60 mic-live'
                      : 'bg-slate-900 border-slate-800 text-slate-400 hover:text-slate-200'
                  }`}
                  title="Hands-free Voice Commands"
                >
                  <span>🎤</span> {handsFreeListening ? "Listening..." : "Voice Log"}
                </button>
              </div>
            </header>
          </div>

          <div className="p-4 space-y-4">

            {/* TAB 1: DASHBOARD & MENSTRUAL CALENDAR */}
            {activeTab === 'dashboard' && (
              <div className="space-y-4">
                <div className="bg-slate-900 border border-slate-800 rounded-2xl p-5 shadow-xl space-y-4">
                  <div className="flex justify-between items-center">
                    <div>
                      <h2 className="text-base font-black text-white flex items-center gap-2">
                        <span>🗓️</span> Menstrual Cycle Calendar
                      </h2>
                      <p className="text-[11px] text-slate-400">Automates workout loads & carb timing</p>
                    </div>
                    <span className={`text-[10px] font-bold uppercase tracking-wider px-2.5 py-1 rounded-full border ${CYCLE_MODES[activeCyclePhase].color}`}>
                      Day {cycleDay} of {cycleLengthDays}
                    </span>
                  </div>

                  <div className="grid grid-cols-1 gap-3 bg-slate-950 p-3.5 rounded-xl border border-slate-800/80">
                    <div>
                      <label className="block text-[11px] font-bold text-slate-300 mb-1">Last Period Start Date</label>
                      <input
                        type="date"
                        value={periodStartDate}
                        onChange={(e) => setPeriodStartDate(e.target.value)}
                        className="w-full bg-slate-900 border border-slate-700 text-white text-xs font-semibold rounded-lg px-3 py-2 focus:outline-none focus:border-rose-500"
                      />
                    </div>

                    <div className="grid grid-cols-2 gap-2 pt-1">
                      <div>
                        <div className="flex justify-between text-[10px] font-bold text-slate-400 mb-1">
                          <span>Cycle Length</span>
                          <span className="text-rose-400">{cycleLengthDays} Days</span>
                        </div>
                        <input
                          type="range"
                          min="21"
                          max="35"
                          value={cycleLengthDays}
                          onChange={(e) => setCycleLengthDays(Number(e.target.value))}
                          className="w-full h-1.5 bg-slate-900 rounded-lg appearance-none cursor-pointer accent-rose-500"
                        />
                      </div>

                      <div>
                        <div className="flex justify-between text-[10px] font-bold text-slate-400 mb-1">
                          <span>Period Length</span>
                          <span className="text-sky-400">{periodDurationDays} Days</span>
                        </div>
                        <input
                          type="range"
                          min="3"
                          max="8"
                          value={periodDurationDays}
                          onChange={(e) => setPeriodDurationDays(Number(e.target.value))}
                          className="w-full h-1.5 bg-slate-900 rounded-lg appearance-none cursor-pointer accent-sky-500"
                        />
                      </div>
                    </div>
                  </div>

                  {/* Horizontal Cycle Bar */}
                  <div>
                    <div className="flex justify-between text-[10px] text-slate-400 font-bold uppercase mb-1.5">
                      <span>Day 1</span>
                      <span>Day {ovulationDay} (Ovulation)</span>
                      <span>Day {cycleLengthDays}</span>
                    </div>
                    <div className="h-3 w-full bg-slate-950 rounded-full overflow-hidden flex border border-slate-800 relative">
                      <div style={{ width: `${(periodDurationDays / cycleLengthDays) * 100}%` }} className="bg-sky-500 h-full"></div>
                      <div style={{ width: `${((ovulationDay - 2 - periodDurationDays) / cycleLengthDays) * 100}%` }} className="bg-rose-500 h-full"></div>
                      <div style={{ width: `${(3 / cycleLengthDays) * 100}%` }} className="bg-fuchsia-500 h-full"></div>
                      <div style={{ width: `${((cycleLengthDays - (ovulationDay + 1)) / cycleLengthDays) * 100}%` }} className="bg-amber-500 h-full"></div>
                      <div
                        style={{ left: `${Math.min(98, Math.max(2, (cycleDay / cycleLengthDays) * 100))}%` }}
                        className="absolute top-0 bottom-0 w-1 bg-white shadow-[0_0_8px_#ffffff] rounded-full transform -translate-x-1/2"
                      ></div>
                    </div>
                  </div>

                  <div className="bg-slate-950 p-3.5 rounded-xl border border-slate-800 space-y-1.5">
                    <div className="flex items-center justify-between">
                      <span className="text-xs font-black text-white">{CYCLE_MODES[activeCyclePhase].name}</span>
                      <span className="text-[10px] font-bold text-slate-400">Next Period: ~{daysUntilNextPeriod} days</span>
                    </div>
                    <p className="text-xs text-rose-400 font-semibold">{CYCLE_MODES[activeCyclePhase].tag}</p>
                    <p className="text-[11px] text-slate-300 leading-relaxed pt-1 border-t border-slate-900">
                      💡 <strong>Nutrition & Energy Rule:</strong> {CYCLE_MODES[activeCyclePhase].carbTip}
                    </p>
                  </div>
                </div>

                {/* Readiness Scanner */}
                <div className="bg-slate-900 border border-slate-800 rounded-2xl p-5 shadow-xl space-y-4">
                  <h3 className="text-xs font-bold uppercase tracking-wider text-slate-400">Readiness & Cortisol Scanner</h3>
                  <div className="space-y-4">
                    <div>
                      <div className="flex justify-between text-xs font-bold text-slate-300 mb-1">
                        <span>Sleep Quality</span>
                        <span className="text-sky-400">{dailyLog.sleep} / 10</span>
                      </div>
                      <input type="range" min="1" max="10" value={dailyLog.sleep} onChange={(e) => setDailyLog({...dailyLog, sleep: Number(e.target.value)})} className="w-full h-1.5 bg-slate-950 rounded-lg appearance-none cursor-pointer accent-sky-500" />
                    </div>
                    <div>
                      <div className="flex justify-between text-xs font-bold text-slate-300 mb-1">
                        <span>Stress / Cortisol</span>
                        <span className="text-amber-400">{dailyLog.stress} / 10</span>
                      </div>
                      <input type="range" min="1" max="10" value={dailyLog.stress} onChange={(e) => setDailyLog({...dailyLog, stress: Number(e.target.value)})} className="w-full h-1.5 bg-slate-950 rounded-lg appearance-none cursor-pointer accent-amber-500" />
                    </div>
                    <div>
                      <div className="flex justify-between text-xs font-bold text-slate-300 mb-1">
                        <span>Muscle Soreness</span>
                        <span className="text-rose-400">{dailyLog.soreness} / 10</span>
                      </div>
                      <input type="range" min="1" max="10" value={dailyLog.soreness} onChange={(e) => setDailyLog({...dailyLog, soreness: Number(e.target.value)})} className="w-full h-1.5 bg-slate-950 rounded-lg appearance-none cursor-pointer accent-rose-500" />
                    </div>
                  </div>

                  <div className="bg-slate-950 p-3 rounded-xl border border-slate-800 flex justify-between items-center">
                    <div>
                      <span className="text-[9px] font-bold text-slate-400 uppercase">Readiness Score</span>
                      <p className={`text-xl font-black ${readinessScore >= 7 ? 'text-emerald-400' : readinessScore >= 5 ? 'text-amber-400' : 'text-rose-400'}`}>
                        {readinessScore} / 10
                      </p>
                    </div>
                    <div className="text-right">
                      <span className="text-[9px] font-bold text-slate-400 uppercase">Load Modifier</span>
                      <p className="text-lg font-black text-white">{Math.round(loadMultiplier * 100)}%</p>
                    </div>
                  </div>
                </div>

                {/* Data Backup */}
                <div className="bg-slate-900 border border-slate-800 rounded-2xl p-4 flex justify-between items-center shadow-lg">
                  <div>
                    <h4 className="text-xs font-bold text-white">Data Storage & Export</h4>
                    <p className="text-[10px] text-slate-400">Backup your workouts and meal plans</p>
                  </div>
                  <div className="flex gap-2">
                    <button onClick={exportUserData} className="bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-bold px-3 py-1.5 rounded-xl border border-slate-700">Export</button>
                    <button onClick={() => fileInputRef.current.click()} className="bg-rose-600 hover:bg-rose-500 text-white text-xs font-bold px-3 py-1.5 rounded-xl">Import</button>
                    <input ref={fileInputRef} type="file" accept=".json" onChange={importUserData} className="hidden" />
                  </div>
                </div>
              </div>
            )}

            {/* TAB 2: WORKOUT */}
            {activeTab === 'workout' && (
              <>
                <div className="bg-slate-900 p-1 rounded-2xl border border-slate-800 flex gap-1">
                  {['beginner', 'intermediate', 'advanced'].map((tier) => (
                    <button
                      key={tier}
                      onClick={() => setDifficulty(tier)}
                      className={`flex-1 py-2 rounded-xl text-xs font-bold capitalize transition-all ${
                        difficulty === tier
                          ? 'bg-rose-600 text-white shadow-lg shadow-rose-950'
                          : 'text-slate-400 hover:text-slate-200'
                      }`}
                    >
                      {tier}
                    </button>
                  ))}
                </div>

                <div className="flex gap-2 items-center">
                  {['A', 'B', 'C'].map((day) => (
                    <button
                      key={day}
                      onClick={() => {
                        setActiveDay(day);
                        const first = (MASTER_EXERCISE_DATA[difficulty][day] || [])[0];
                        if (first) setFocusedExerciseId(first.id);
                      }}
                      className={`flex-1 py-2 rounded-xl text-xs font-bold border transition-all ${
                        activeDay === day ? 'bg-slate-800 text-rose-400 border-rose-500/50 shadow' : 'bg-slate-900 text-slate-400 border-slate-800'
                      }`}
                    >
                      Workout {day}
                    </button>
                  ))}
                </div>

                <Interactive3DHumanoid activeMuscle={activeExerciseObj.primaryMuscle} exerciseName={activeExerciseObj.name} />

                {/* Finish & Next Day Banner */}
                <div className="bg-slate-900/90 border border-slate-800 rounded-2xl p-4 shadow-xl flex flex-col gap-3">
                  <div className="flex justify-between items-center">
                    <div>
                      <span className="text-[10px] font-bold uppercase text-slate-400">Session Progress</span>
                      <p className="text-sm font-black text-white">{completedSetsCount} of {totalSetsCount} Sets Logged ({totalSessionTonnage.toLocaleString()} kg)</p>
                    </div>
                    <span className={`text-[10px] font-bold px-2 py-0.5 rounded-full ${isWorkoutFullyCompleted ? 'bg-emerald-950 text-emerald-400 border border-emerald-800' : 'bg-slate-800 text-slate-400'}`}>
                      {isWorkoutFullyCompleted ? "100% Done" : "In Progress"}
                    </span>
                  </div>

                  <button
                    onClick={advanceToNextWorkout}
                    className="w-full bg-gradient-to-r from-rose-600 to-rose-500 hover:from-rose-500 hover:to-rose-400 text-white font-bold py-2.5 rounded-xl text-xs shadow-lg shadow-rose-950 flex items-center justify-center gap-1.5 transition-all"
                  >
                    <span>🏆</span> Finish & Advance to Next Workout ({activeDay === 'A' ? 'B' : activeDay === 'B' ? 'C' : 'A'})
                  </button>
                </div>

                {/* Guided Warmup */}
                <div className="bg-slate-900/90 border border-slate-800 rounded-xl p-3 flex justify-between items-center">

          {/* Guided 3-Minute Warmup Modal */}
          {showWarmupPlayer && (
            <div className="fixed inset-0 bg-black/90 backdrop-blur-md flex items-center justify-center p-4 z-50">
              <div className="bg-slate-900 border border-slate-700 rounded-3xl max-w-sm w-full p-6 text-center space-y-4 shadow-2xl">
                <div className="flex justify-between items-center">
                  <span className="text-[10px] font-bold text-rose-400 uppercase tracking-wider">Warm-up {warmupIndex + 1} / {WARMUP_ROUTINE.length}</span>
                  <button onClick={() => { setShowWarmupPlayer(false); setWarmupRunning(false); }} className="text-slate-400 text-sm font-bold">✕</button>
                </div>
                <h3 className="text-lg font-black text-white">{WARMUP_ROUTINE[warmupIndex].name}</h3>
                <div className="w-24 h-24 rounded-full bg-rose-600/20 border-2 border-rose-500 mx-auto flex items-center justify-center">
                  <span className="text-3xl font-black font-mono text-white">{warmupTimer}s</span>
                </div>
                <p className="text-xs text-slate-300 bg-slate-950 p-3 rounded-xl border border-slate-800 leading-relaxed">
                  {WARMUP_ROUTINE[warmupIndex].cue}
                </p>
                <div className="flex gap-2">
                  <button
                    onClick={() => {
                      if (warmupIndex < WARMUP_ROUTINE.length - 1) {
                        setWarmupIndex(prev => prev + 1);
                        setWarmupTimer(WARMUP_ROUTINE[warmupIndex + 1].dur);
                      } else {
                        setShowWarmupPlayer(false);
                      }
                    }}
                    className="flex-1 bg-slate-800 text-slate-200 py-2.5 rounded-xl text-xs font-bold"
                  >
                    Skip Movement
                  </button>
                  <button
                    onClick={() => setWarmupRunning(!warmupRunning)}
                    className="flex-1 bg-rose-600 text-white py-2.5 rounded-xl text-xs font-bold shadow-lg"
                  >
                    {warmupRunning ? "Pause" : "Resume"}
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* Exercise Form Modal */}
          {selectedExercise && (
            <div className="fixed inset-0 bg-black/90 backdrop-blur-md flex items-center justify-center p-4 z-50">
              <div className="bg-slate-900 border border-slate-700 rounded-3xl max-w-sm w-full overflow-hidden shadow-2xl flex flex-col max-h-[90vh]">
                <div className="relative h-44 bg-slate-950 shrink-0">
                  <img src={selectedExercise.gifUrl} alt={selectedExercise.name} className="w-full h-full object-cover opacity-80" />
                  <button onClick={() => setSelectedExercise(null)} className="absolute top-3 right-3 bg-black/60 text-white rounded-full w-7 h-7 flex items-center justify-center font-bold text-xs border border-slate-500 backdrop-blur">✕</button>
                  <div className="absolute bottom-2 left-3 bg-slate-950/80 backdrop-blur px-2.5 py-0.5 rounded-full border border-rose-500/50">
                    <span className="text-[10px] text-rose-400 font-mono font-bold">Tempo: {selectedExercise.tempo}</span>
                  </div>
                </div>

                <div className="p-4 overflow-y-auto space-y-3">
                  <div>
                    <h3 className="text-base font-black text-white leading-tight">{selectedExercise.name}</h3>
                    <p className="text-[11px] text-rose-400 font-bold uppercase tracking-wider mt-0.5">Target: {selectedExercise.target}</p>
                  </div>

                  <div className="bg-slate-950 p-3 rounded-xl border border-slate-800 text-xs text-slate-300 leading-relaxed">
                    <p><strong>Form Execution:</strong> {selectedExercise.cues}</p>
                  </div>

                  <button onClick={() => setSelectedExercise(null)} className="w-full bg-rose-600 hover:bg-rose-500 text-white py-3 rounded-xl font-bold text-xs transition-all shadow-lg shadow-rose-900/50">
                    Close Form Guide
                  </button>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
