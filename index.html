        return fallback;
      }
    };

      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        const ctx = new AudioCtx();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0.05, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + dur);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + dur);
      } catch {}
    };

      const calcMetabolicTargets = (p) => {
        const w = Number(p.currentWeight) || 75;
        const h = Number(p.height) || 165;
        const a = Number(p.age) || 30;
        const bmr = Math.round(10 * w + 6.25 * h - 5 * a - 161);
        const tdee = Math.round(bmr * 1.375);
        const deficitCals = Math.max(1450, tdee - 350);
        
        let pRatio = 0.40, cRatio = 0.30, fRatio = 0.30;
        if (p.somatotype === "Ectomorph") { pRatio = 0.30; cRatio = 0.50; fRatio = 0.20; }
        else if (p.somatotype === "Mesomorph") { pRatio = 0.35; cRatio = 0.40; fRatio = 0.25; }

        const pGrams = Math.round((deficitCals * pRatio) / 4);
        const cGrams = Math.round((deficitCals * cRatio) / 4);
        const fGrams = Math.round((deficitCals * fRatio) / 9);

        return { calories: deficitCals, pGrams, cGrams, fGrams, pRatio: Math.round(pRatio * 100), cRatio: Math.round(cRatio * 100), fRatio: Math.round(fRatio * 100) };

        if (day <= 5) phase = "menstrual";
        else if (day <= 13) phase = "follicular";

                              triggerHaptic(8);
                            }}
                            className={`flex-1 py-2 rounded-xl text-[11px] font-bold capitalize border transition-all ${
                              tempProfile.experience.toLowerCase() === exp.toLowerCase() ? "bg-rose-600 text-white border-rose-500" : "bg-slate-950 text-slate-400 border-slate-800"
                            }`}
                          >
                            {exp}
                          </button>
                        ))}
                      </div>
                    </div>
                  </div>
                )}

                {/* STEP 5: PROTOCOL CONFIRMATION */}
                {onboardingStep === 5 && (
                  <div className="space-y-3.5 text-center">
                    <div className="w-12 h-12 rounded-full bg-gradient-to-tr from-amber-500 to-rose-600 mx-auto flex items-center justify-center text-xl font-black text-white">
                      ⚡
                    </div>
                    <div>
                      <h4 className="text-base font-black text-white">Protocol Ready for {tempProfile.name}!</h4>
                      <p className="text-xs text-slate-400 mt-1">Caloric target calibrated for {tempProfile.somatotype} body type.</p>
                    </div>

                    <div className="bg-slate-950 p-3.5 rounded-2xl border border-slate-800 space-y-2 text-xs text-left">
                      <div className="flex justify-between border-b border-slate-900 pb-1.5">
                        <span className="text-slate-400">Daily Caloric Target:</span>
                        <span className="font-bold text-white">~{calcMetabolicTargets(tempProfile).calories} kcal / day</span>
                      </div>
                      <div className="flex justify-between border-b border-slate-900 pb-1.5">
                        <span className="text-slate-400">Macro Distribution:</span>
                        <span className="font-bold text-rose-400">{calcMetabolicTargets(tempProfile).pRatio}% P / {calcMetabolicTargets(tempProfile).cRatio}% C / {calcMetabolicTargets(tempProfile).fRatio}% F</span>
                      </div>
                      <div className="flex justify-between">
                        <span className="text-slate-400">Hydration Target:</span>
                        <span className="font-bold text-sky-400">3.0 Liters Daily</span>
                      </div>
                    </div>
                  </div>
                )}

                {/* Wizard Navigation Actions */}
                <div className="flex gap-2 pt-2 border-t border-slate-800">
                  {onboardingStep > 1 && (
                    <button
                      onClick={() => { setOnboardingStep(prev => prev - 1); triggerHaptic(8); }}
                      className="px-4 py-2.5 rounded-xl card-dark text-xs font-bold text-slate-300"
                    >
                      Back
                    </button>
                  )}
                  {onboardingStep < 5 ? (
                    <button
                      onClick={() => { setOnboardingStep(prev => prev + 1); triggerHaptic(12); }}
                      className="flex-1 py-2.5 rounded-xl bg-amber-500 hover:bg-amber-400 text-slate-950 text-xs font-black transition-all shadow-md"
                    >
                      Continue →
                    </button>
                  ) : (
                    <button
                      onClick={completeOnboarding}
                      className="flex-1 py-3 rounded-xl bg-gradient-to-r from-rose-600 to-amber-600 text-white text-xs font-black transition-all shadow-lg"
                    >
                      Save & Launch 🚀
                    </button>
                  )}
                </div>

              </div>
            </div>
          )}

          {/* RESET PROFILE CONFIRMATION MODAL */}
          {showResetConfirmModal && (
            <div className="fixed inset-0 bg-black/90 backdrop-blur-md flex items-center justify-center p-4 z-50">
              <div className="card-dark rounded-3xl p-5 max-w-sm w-full space-y-4 border-red-500/50 shadow-2xl text-center">
                <div className="w-12 h-12 rounded-full bg-red-950/80 text-red-400 flex items-center justify-center mx-auto text-xl border border-red-800">
                  ⚠️
                </div>
                <div>
                  <h3 className="text-base font-black text-white">Reset Profile & Data?</h3>
                  <p className="text-xs text-slate-400 mt-1">
                    This will wipe all custom weights, completed workout histories, and profile questionnaire entries.
                  </p>
                </div>

                <div className="flex gap-2 pt-2 border-t border-slate-800">
                  <button
                    onClick={() => setShowResetConfirmModal(false)}
                    className="flex-1 py-2.5 rounded-xl card-dark text-xs font-bold text-slate-300"
                  >
                    Cancel
                  </button>
                  <button
                    onClick={executeFullReset}
                    className="flex-1 py-2.5 rounded-xl bg-red-600 hover:bg-red-500 text-white text-xs font-black transition-all shadow-lg shadow-red-950"
                  >
                    Yes, Reset
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* BOTTOM DOCK (4 CLEAN BUTTONS) */}
          <nav className="fixed bottom-0 left-0 right-0 bg-[#070a12]/95 backdrop-blur border-t border-slate-800 px-4 py-2.5 flex justify-around items-center z-40">
            <button
              onClick={() => { setTab("train"); triggerHaptic(10); }}
              className={`flex flex-col items-center gap-0.5 text-xs font-bold transition-all ${
                tab === "train" ? "text-rose-500" : "text-slate-400"
              }`}
            >
              <span className="text-base">🏋️</span>
              <span className="text-[10px]">Train</span>
            </button>
            <button
              onClick={() => { setTab("fuel"); triggerHaptic(10); }}
              className={`flex flex-col items-center gap-0.5 text-xs font-bold transition-all ${
                tab === "fuel" ? "text-rose-500" : "text-slate-400"
              }`}
            >
              <span className="text-base">🥗</span>
              <span className="text-[10px]">Fuel</span>
            </button>
            <button
              onClick={() => { setTab("cycle"); triggerHaptic(10); }}
              className={`flex flex-col items-center gap-0.5 text-xs font-bold transition-all ${
                tab === "cycle" ? "text-rose-500" : "text-slate-400"
              }`}
            >
              <span className="text-base">🗓️</span>
              <span className="text-[10px]">Cycle</span>
            </button>
            <button
              onClick={() => { setTab("profile"); triggerHaptic(10); }}
              className={`flex flex-col items-center gap-0.5 text-xs font-bold transition-all ${
                tab === "profile" ? "text-rose-500" : "text-slate-400"
              }`}
            >
              <span className="text-base">👤</span>
              <span className="text-[10px]">Profile</span>
            </button>
          </nav>

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
