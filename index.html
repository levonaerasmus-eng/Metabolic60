          { name: "Lunch", title: "Herb Chicken Breast & Roasted Patats", img: "https://images.unsplash.com/photo-1532550907401-a500c9a57435?auto=format&fit=crop&w=600&q=80", desc: "160g chicken fillet, 120g roasted sweet potato cubes, steamed green beans.", steps: ["Roast cubed sweet potatoes at 200°C with 1 tsp olive oil for 22 mins.", "Pan-sear seasoned chicken breast for 5 mins each side.", "Steam green beans 4 mins until crisp and vibrant."] },
          { name: "Snack", title: "Greek Yogurt & Chia Glow Pot", img: "https://images.unsplash.com/photo-1488477181946-6428a0291777?auto=format&fit=crop&w=600&q=80", desc: "1 cup 0% Greek yogurt, 1 tbsp chia seeds, vanilla extract.", steps: ["Spoon yogurt into glass pot, fold in chia seeds and vanilla.", "Let sit 5 mins for chia seeds to blossom."] },
          { name: "Dinner", title: "Lean Beef Bolognese over Zoodles", img: "https://images.unsplash.com/photo-1547592166-23ac45744acd?auto=format&fit=crop&w=600&q=80", desc: "150g lean beef mince (90/10), baby marrows (zucchini), tomato passata, ¼ avocado.", steps: ["Brown mince with Italian herbs in a hot skillet.", "Add tomato passata and simmer on low for 8 mins.", "Toss spiralized baby marrows in the pan for 2 mins.", "Serve with sliced avocado."] }
        ]
      },
      {
        day: "Tuesday",
        type: "Restorative Recovery",
        target: "1,640 kcal • 144g Protein",
        meals: [
          { name: "Breakfast", title: "Savory Egg & Spinach Cups w/ Avocado", img: "https://images.unsplash.com/photo-1525351484163-7529414344d8?auto=format&fit=crop&w=600&q=80", desc: "2 whole eggs + 2 whites baked with morogo/spinach, ½ avocado.", steps: ["Whisk eggs with chopped spinach and bell peppers.", "Bake in muffin tins at 180°C for 20 mins.", "Serve warm with fresh avocado."] },
          { name: "Lunch", title: "Lucky Star Pilchard Protein Bowl", img: "https://images.unsplash.com/photo-1546069901-ba9599a7e63c?auto=format&fit=crop&w=600&q=80", desc: "½ tin pilchards in tomato sauce, mixed greens, steamed gem squash.", steps: ["Steam gem squash halves for 15 mins.", "Warm pilchards and flake over fresh salad greens and squash."] }
        ]
      }
    ];

    // --- Grocery Checklist ---
    const GROCERY_CATEGORIES = {
      "Lean Proteins": ["Skinless Chicken Breast", "Extra-Lean Beef Mince", "Cape Hake Fillets", "Free-Range Eggs", "0% Greek Yogurt", "Low-Fat Cottage Cheese", "Vanilla Whey/Plant Protein"],
      "Glowing Carbs": ["Sweet Potatoes (*Patats*)", "Jungle Rolled Oats", "Brown Basmati Rice", "100% Seeded Rye Bread", "Quinoa"],
      "Fresh Produce": ["Swiss Chard / Morogo", "Baby Marrows (Zucchini)", "Green Beans", "Gem Squash", "Broccoli", "Baby Spinach", "Fresh Blueberries & Lemons"],
      "Healthy Fats": ["Ripe Avocados", "Raw Almonds & Walnuts", "Chia Seeds & Flaxseeds", "Extra Virgin Olive Oil", "Sugar-Free Peanut Butter"]
    };

    const SUBSTITUTIONS = {
      "Lean Proteins": ["Chicken breast", "Turkey mince", "Cape Hake / Kingklip", "Extra-lean Beef mince", "Ostrich steaks", "Tinned Tuna", "Free-Range Eggs"],
      "Glowing Carbs": ["Sweet Potato", "Butternut", "Rolled Oats", "Brown Rice", "100% Seeded Rye Bread"],
      "Fibrous Greens": ["Swiss Chard / Morogo", "Zucchini", "Green Beans", "Gem Squash", "Broccoli", "Spinach"],
      "Healthy Fats": ["Avocado", "Raw Almonds", "Chia Seeds", "Olive Oil", "Sugar-Free Peanut Butter"]
    };

    // --- Main Application Component ---
    function App() {
      const [tab, setTab] = useState("train"); // train, fuel, progress, profile
      const [difficulty, setDifficulty] = useState(() => getStored("m60_diff", "intermediate"));
      const [workoutDay, setWorkoutDay] = useState(() => getStored("m60_day", "A"));
      const [focusedId, setFocusedId] = useState("i_a1");
      
      // Interactive Exercise Timing & Live Cadence Modal
      const [activeModalExercise, setActiveModalExercise] = useState(null);
      const [activeModalPacing, setActiveModalPacing] = useState(false);
      const [modalPacePhase, setModalPacePhase] = useState("Ready");
      const [modalPaceCount, setModalPaceCount] = useState(3);

      const [weights, setWeights] = useState(() => getStored("m60_weights", {}));
      const [completedSets, setCompletedSets] = useState(() => getStored("m60_sets", {}));
      const [history, setHistory] = useState(() => getStored("m60_history", []));

      const [selectedCalendarDate, setSelectedCalendarDate] = useState(null);

      // Onboarding & Profile State
      const defaultProfile = {
        onboardingCompleted: false,
        name: "Lindiwe",
        age: 29,
        somatotype: "Endomorph",
        height: 166,
        currentWeight: 76.5,
        targetWeight: 68.0,
        waist: 79,
        hips: 104,
        experience: "Intermediate",
        goal: "Fat Loss & Metabolic Reset"
      };

      const [userProfile, setUserProfile] = useState(() => getStored("m60_user_profile", defaultProfile));
      const [showWelcomeScreen, setShowWelcomeScreen] = useState(!userProfile.onboardingCompleted);
      const [showOnboardingModal, setShowOnboardingModal] = useState(false);
      const [showResetConfirmModal, setShowResetConfirmModal] = useState(false);
      const [onboardingStep, setOnboardingStep] = useState(1);
      const [tempProfile, setTempProfile] = useState({ ...userProfile });

      // Fuel State
      const [fuelSubTab, setFuelSubTab] = useState("meals");
      const [mealDayIdx, setMealDayIdx] = useState(0);
      const [expandedMealIdx, setExpandedMealIdx] = useState(null);
      const [checkedGroceries, setCheckedGroceries] = useState(() => getStored("m60_grocery", {}));

      // 3L Water Tracker
      const todayDateStr = getLocalDateStr();
      const [waterGlasses, setWaterGlasses] = useState(() => getStored(`m60_water_${todayDateStr}`, 0));

      // Rest Timer State
      const [restSec, setRestSec] = useState(0);
      const [targetRestSec, setTargetRestSec] = useState(60);
      const [isResting, setIsResting] = useState(false);

      // Global Metronome State
      const [showTempo, setShowTempo] = useState(false);
      const [tempoRunning, setTempoRunning] = useState(false);
      const [tempoCount, setTempoCount] = useState(3);
      const [tempoPhase, setTempoPhase] = useState("Lower (3s)");

      const [toastMsg, setToastMsg] = useState(null);

      // Menstrual Cycle State (Accessible directly in Train & Profile)
      const [periodStart, setPeriodStart] = useState(() => getStored("m60_pstart", "2026-08-01"));
      const [cycleLen, setCycleLen] = useState(() => getStored("m60_clen", 28));

      // Persistence
      useEffect(() => { setStored("m60_diff", difficulty); }, [difficulty]);
      useEffect(() => { setStored("m60_day", workoutDay); }, [workoutDay]);
      useEffect(() => { setStored("m60_weights", weights); }, [weights]);
      useEffect(() => { setStored("m60_sets", completedSets); }, [completedSets]);
      useEffect(() => { setStored("m60_history", history); }, [history]);
      useEffect(() => { setStored("m60_grocery", checkedGroceries); }, [checkedGroceries]);
      useEffect(() => { setStored(`m60_water_${todayDateStr}`, waterGlasses); }, [waterGlasses, todayDateStr]);
      useEffect(() => { setStored("m60_pstart", periodStart); }, [periodStart]);
      useEffect(() => { setStored("m60_clen", cycleLen); }, [cycleLen]);
      useEffect(() => { setStored("m60_user_profile", userProfile); }, [userProfile]);

      // Rest Timer Engine
      useEffect(() => {
        let timer = null;
        if (isResting && restSec > 0) {
          timer = setInterval(() => {
            setRestSec(prev => {
              if (prev <= 4 && prev > 1) {
                playBeep(587.33, 0.08);
                triggerHaptic(10);
              }
              if (prev === 1) {
                playBeep(880, 0.25);
                triggerHaptic([40, 60, 40]);
                setIsResting(false);
              }
              return prev - 1;
            });
          }, 1000);
        }
        return () => clearInterval(timer);
      }, [isResting, restSec]);

      // Global Metronome Engine
      useEffect(() => {
        let timer = null;
        if (tempoRunning) {
          let step = 0;
          timer = setInterval(() => {
            if (step === 0) { setTempoPhase("Lower (3s)"); setTempoCount(3); playBeep(440, 0.05); triggerHaptic(8); }
            else if (step === 1) { setTempoCount(2); playBeep(440, 0.05); }
            else if (step === 2) { setTempoCount(1); playBeep(440, 0.05); }
            else if (step === 3) { setTempoPhase("Drive Up (1s)"); setTempoCount(1); playBeep(880, 0.1); triggerHaptic(20); }
            step = (step + 1) % 4;
          }, 1000);
        }
        return () => clearInterval(timer);
      }, [tempoRunning]);

      // Exercise-Specific Live Tempo & Cadence Engine
      useEffect(() => {
        let timer = null;
        if (activeModalExercise && activeModalPacing) {
          const ecc = activeModalExercise.ecc || 3;
          const pause = activeModalExercise.pause || 0;
          const conc = activeModalExercise.conc || 1;
          const totalCycle = ecc + pause + conc;

          let tick = 0;
          timer = setInterval(() => {
            const pos = tick % totalCycle;
            if (pos < ecc) {
              setModalPacePhase(`Lowering (Down)`);
              setModalPaceCount(ecc - pos);
              playBeep(440, 0.05);
              triggerHaptic(8);
            } else if (pos < ecc + pause) {
              setModalPacePhase(`Pause & Hold`);
              setModalPaceCount(ecc + pause - pos);
              playBeep(520, 0.08);
              triggerHaptic(12);
            } else {
              setModalPacePhase(`Drive Up (Lift)`);
              setModalPaceCount(1);
              playBeep(880, 0.12);
              triggerHaptic(25);
            }
            tick++;
          }, 1000);
        } else {
          setModalPacePhase("Ready");
          setModalPaceCount(activeModalExercise ? (activeModalExercise.ecc || 3) : 3);
        }
        return () => clearInterval(timer);
      }, [activeModalExercise, activeModalPacing]);

      // Cycle Math
      const calcCycle = () => {
        const start = new Date(periodStart);
        start.setHours(0, 0, 0, 0);
        const now = new Date();
        now.setHours(0, 0, 0, 0);
        const diff = Math.floor((now - start) / (1000 * 60 * 60 * 24));
        const day = ((diff % cycleLen) + cycleLen) % cycleLen + 1;
        let phase = "follicular";
        if (day <= 5) phase = "menstrual";
        else if (day <= 13) phase = "follicular";
        else if (day <= 16) phase = "ovulatory";
        else phase = "luteal";
        return { day, phase, info: CYCLE_MODES[phase] };
      };

      const cycle = calcCycle();
      const currentList = EXERCISE_DATA[difficulty][workoutDay] || EXERCISE_DATA.intermediate.A;
      const activeEx = currentList.find(e => e.id === focusedId) || currentList[0];

      // Live Session Volume
      const currentLoadMod = cycle.info.mod;
      const liveSessionVolume = currentList.reduce((sum, ex) => {
        const loggedKg = (Number(weights[ex.id]) || ex.defaultKg) * currentLoadMod;
        let done = 0;
        for (let s = 0; s < ex.sets; s++) {
          if (completedSets[`${ex.id}_s_${s}`]) done++;
        }
        return sum + Math.round(done * ex.reps * loggedKg);
      }, 0);

      const totalSetsCount = currentList.reduce((sum, ex) => sum + ex.sets, 0);
      const completedSetsCount = currentList.reduce((sum, ex) => {
        let done = 0;
        for (let s = 0; s < ex.sets; s++) {
          if (completedSets[`${ex.id}_s_${s}`]) done++;
        }
        return sum + done;
      }, 0);

      // Set Check Toggle
      const toggleSet = (key, restDuration, exId, ex) => {
        const next = !completedSets[key];
        const updated = { ...completedSets, [key]: next };
        setCompletedSets(updated);
        setFocusedId(exId);

        if (next) {
          triggerHaptic(15);
          playBeep(659.25, 0.1);
          setTargetRestSec(restDuration);
          setRestSec(restDuration);
          setIsResting(true);

          let allSetsDone = true;
          for (let s = 0; s < ex.sets; s++) {
            if (!updated[`${ex.id}_s_${s}`]) { allSetsDone = false; break; }
          }

          if (allSetsDone) {
            const nextIncompleteEx = currentList.find(otherEx => {
              for (let s = 0; s < otherEx.sets; s++) {
                if (!updated[`${otherEx.id}_s_${s}`]) return true;
              }
              return false;
            });
            if (nextIncompleteEx) {
              setFocusedId(nextIncompleteEx.id);
            }
          }
        }
      };

      const startManualTimer = (seconds) => {
        setTargetRestSec(seconds);
        setRestSec(seconds);
        setIsResting(true);
        triggerHaptic(15);
        playBeep(587.33, 0.08);
      };

      const toggleGroceryItem = (item) => {
        setCheckedGroceries(prev => ({ ...prev, [item]: !prev[item] }));
        triggerHaptic(12);
        playBeep(659.25, 0.05);
      };

      const setWater = (idx) => {
        const nextVal = (idx + 1 === waterGlasses) ? idx : idx + 1;
        setWaterGlasses(nextVal);
        triggerHaptic(20);
        playBeep(659.25, 0.06);
      };

      const finishWorkout = () => {
        const localDateStr = getLocalDateStr();
        const entry = {
          date: new Date().toLocaleDateString("en-ZA", { month: "short", day: "numeric" }),
          fullDate: localDateStr,
          day: workoutDay,
          difficulty,
          tonnage: liveSessionVolume,
          sets: completedSetsCount,
          timestamp: Date.now()
        };
        setHistory([entry, ...history]);
        triggerHaptic([50, 100, 50, 100]);
        if (window.confetti) window.confetti({ particleCount: 120, spread: 70, colors: ['#E49B90', '#D97365', '#F6DDD9'] });
        
        const nextDay = workoutDay === "A" ? "B" : workoutDay === "B" ? "C" : "A";
        setWorkoutDay(nextDay);
        setFocusedId(EXERCISE_DATA[difficulty][nextDay][0].id);
      };

      // Milestone Badges
      const totalHistoricalTonnage = history.reduce((sum, h) => sum + (h.tonnage || 0), 0) + liveSessionVolume;
      const badges = [
        { id: "b1", name: "Radiant Starter", desc: "Finished 1+ workout session", icon: "✨", unlocked: history.length >= 1 },
        { id: "b2", name: "Grace in Momentum", desc: "Completed 3+ workouts", icon: "🌸", unlocked: history.length >= 3 },
        { id: "b3", name: "10k kg Sculpt Club", desc: "Moved 10,000+ kg sculpted load", icon: "👑", unlocked: totalHistoricalTonnage >= 10000 },
        { id: "b4", name: "Hydration Radiance", desc: "Drank 3L water today (8/8 glasses)", icon: "💧", unlocked: waterGlasses >= 8 },
        { id: "b5", name: "Hormonal Symphony", desc: "Menstrual cycle engine synchronized", icon: "🌙", unlocked: !!periodStart }
      ];

      // Circular Arc Math
      const safeTargetSec = Math.max(1, targetRestSec || 60);
      const arcRadius = 18;
      const arcCircumference = 2 * Math.PI * arcRadius;
      const arcOffset = arcCircumference - (restSec / safeTargetSec) * arcCircumference;

      // Calendar Construction
      const now = new Date();
      const currentYear = now.getFullYear();
      const currentMonth = now.getMonth();
      const firstDayIndex = new Date(currentYear, currentMonth, 1).getDay();
      const daysInMonth = new Date(currentYear, currentMonth + 1, 0).getDate();
      const monthName = now.toLocaleString("default", { month: "long" });

      return (
        <div className="min-h-screen max-w-md mx-auto pb-24 flex flex-col justify-between">
          
          {/* Header */}
          <header className="sticky top-0 z-30 bg-[#FAF6F4]/90 backdrop-blur border-b border-blush-200 px-4 py-3.5 flex items-center justify-between shadow-sm">
            <div className="flex items-center gap-2">
              <span className="w-2.5 h-2.5 rounded-full bg-blush-500"></span>
              <h1 className="text-base font-serif font-bold text-charcoal tracking-tight">metabolic60 ✨</h1>
            </div>
            <div className="flex items-center gap-2">
              <span className="text-[11px] font-medium text-blush-600 bg-blush-100/80 px-3 py-0.5 rounded-full border border-blush-200">
                {userProfile.name} • Day {cycle.day}
              </span>
            </div>
          </header>

          <main className="p-4 space-y-4 flex-1">

            {/* TAB 1: TRAIN */}
            {tab === "train" && (
              <div className="space-y-3.5">
                
                {/* 1. MENSTRUAL PHASE DISPLAY & DIRECT INPUT CARD */}
                <div className="card-light rounded-3xl p-4 space-y-3 border-blush-300">
                  <div className="flex justify-between items-center">
                    <span className="text-[10px] font-bold text-roseGold uppercase tracking-widest">Hormonal Rhythm</span>
                    <span className={`text-[10px] font-bold px-2.5 py-0.5 rounded-full border ${cycle.info.color}`}>
                      Day {cycle.day} • {cycle.info.short} ({Math.round(cycle.info.mod * 100)}% Load)
                    </span>
                  </div>

                  {/* Direct Menstruation Inputs */}
                  <div className="grid grid-cols-2 gap-2.5 bg-blush-50/70 p-3 rounded-2xl border border-blush-200">
                    <div>
                      <label className="block text-[9px] font-semibold text-mutedMauve uppercase mb-1">Period Start</label>
                      <input
                        type="date"
                        value={periodStart}
                        onChange={e => setPeriodStart(e.target.value)}
                        className="w-full bg-white border border-blush-200 text-charcoal text-[11px] font-medium p-1.5 rounded-xl focus:outline-none"
                      />
                    </div>
                    <div>
                      <div className="flex justify-between text-[9px] font-semibold text-mutedMauve uppercase mb-1">
                        <span>Cycle Length</span>
                        <span className="text-blush-600 font-bold">{cycleLen}d</span>
                      </div>
                      <input
                        type="range"
                        min="21"
                        max="35"
                        value={cycleLen}
                        onChange={e => setCycleLen(Number(e.target.value))}
                        className="w-full h-1 bg-blush-200 rounded accent-blush-500 mt-2.5"
                      />
                    </div>
                  </div>

                  <p className="text-[11px] text-charcoal/80 bg-white/80 p-2.5 rounded-2xl leading-relaxed border border-blush-100">
                    🌸 <strong>{cycle.info.tag}:</strong> {cycle.info.tip}
                  </p>
                </div>

                {/* 2. REAL-TIME LOAD & PROGRESS HUD */}
                <div className="card-light p-3.5 rounded-2xl flex items-center justify-between">
                  <div>
                    <span className="text-[9px] font-bold text-roseGold uppercase tracking-wider">Session Load</span>
                    <p className="text-xs font-black text-blush-600 font-mono">{liveSessionVolume.toLocaleString()} kg Sculpted</p>
                  </div>
                  <div className="text-right">
                    <span className="text-[9px] font-bold text-roseGold uppercase tracking-wider">Workout Progress</span>
                    <p className="text-xs font-black text-charcoal font-mono">{completedSetsCount} / {totalSetsCount} Sets Completed</p>
                  </div>
                </div>

                {/* 3. 3-TIER DIFFICULTY SELECTOR */}
                <div className="card-light p-1 rounded-2xl flex gap-1">
                  {["beginner", "intermediate", "advanced"].map(tier => (
                    <button
                      key={tier}
                      onClick={() => {
                        setDifficulty(tier);
                        setUserProfile(prev => ({ ...prev, experience: tier.charAt(0).toUpperCase() + tier.slice(1) }));
                        setFocusedId(EXERCISE_DATA[tier][workoutDay][0].id);
                        triggerHaptic(10);
                      }}
                      className={`flex-1 py-1.5 rounded-xl text-xs font-semibold capitalize transition-all ${
                        difficulty === tier ? "bg-blush-500 text-white shadow-sm font-bold" : "text-mutedMauve hover:text-charcoal"
                      }`}
                    >
                      {tier}
                    </button>
                  ))}
                </div>

                {/* 4. WORKOUT SELECTOR & TEMPO */}
                <div className="space-y-2">
                  <div className="flex items-center justify-between gap-2">
                    <div className="flex gap-1.5 flex-1">
                      {["A", "B", "C"].map(d => (
                        <button
                          key={d}
                          onClick={() => { 
                            setWorkoutDay(d); 
                            setFocusedId(EXERCISE_DATA[difficulty][d][0].id);
                            triggerHaptic(10);
                          }}
                          className={`flex-1 py-2 rounded-xl text-xs font-bold transition-all border ${
                            workoutDay === d ? "bg-white text-blush-600 border-blush-400 shadow-sm" : "bg-blush-50/60 text-mutedMauve border-blush-100"
                          }`}
                        >
                          Workout {d}
                        </button>
                      ))}
                    </div>
                    <button
                      onClick={() => { setShowTempo(!showTempo); triggerHaptic(12); }}
                      className="card-light px-3 py-2 rounded-xl text-xs font-semibold text-charcoal hover:bg-blush-50"
                    >
                      ⏱️ 3-0-1 Tempo
                    </button>
                  </div>

                  {/* Manual Quick-Timer Presets */}
                  <div className="card-light p-2.5 rounded-2xl flex items-center justify-between gap-2">
                    <span className="text-[9px] font-bold uppercase text-roseGold">Quick Rest:</span>
                    <div className="flex gap-1.5">
                      {[30, 45, 60, 90].map(s => (
                        <button
                          key={s}
                          onClick={() => startManualTimer(s)}
                          className="bg-blush-50 hover:bg-blush-100 text-blush-600 px-2.5 py-1 rounded-lg text-[10px] font-bold border border-blush-200"
                        >
                          {s}s
                        </button>
                      ))}
                    </div>
                  </div>
                </div>

                {/* 5. REST COUNTDOWN BANNER */}
                {isResting && (
                  <div className="card-light border-blush-400 p-3.5 rounded-2xl flex items-center justify-between animate-pulse">
                    <div className="flex items-center gap-3">
                      <svg width="40" height="40" className="w-10 h-10 shrink-0">
                        <circle cx="20" cy="20" r={arcRadius} stroke="#FBF0EE" strokeWidth="3.5" fill="transparent" />
                        <circle
                          cx="20"
                          cy="20"
                          r={arcRadius}
                          stroke="#D97365"
                          strokeWidth="3.5"
                          fill="transparent"
                          strokeDasharray={arcCircumference}
                          strokeDashoffset={arcOffset}
                          strokeLinecap="round"
                          className="timer-arc"
                        />
                        <text x="20" y="24" textAnchor="middle" fill="#2D2726" fontSize="10" fontWeight="bold">{restSec}s</text>
                      </svg>
                      <div>
                        <span className="text-[9px] font-bold uppercase tracking-wider text-roseGold">Resting Interval</span>
                        <p className="text-xs font-bold text-blush-600">Breathe & prepare for your next set</p>
                      </div>
                    </div>
                    <button onClick={() => { setIsResting(false); triggerHaptic(10); }} className="text-[10px] text-mutedMauve underline">
                      Skip
                    </button>
                  </div>
                )}

                {/* 6. METRONOME DRAWER */}
                {showTempo && (
                  <div className="card-light p-4 rounded-2xl text-center space-y-3 border-blush-300">
                    <div className="flex justify-between items-center">
                      <span className="text-xs font-bold text-blush-600 font-serif">3-0-1 Rep Metronome</span>
                      <button onClick={() => setShowTempo(false)} className="text-xs text-mutedMauve">✕</button>
                    </div>
                    <div className="py-3 bg-blush-50/80 rounded-2xl border border-blush-200">
                      <div className="text-3xl font-black font-mono text-charcoal">{tempoRunning ? tempoCount : "3-0-1"}</div>
                      <p className="text-[10px] text-blush-600 font-bold uppercase tracking-wider mt-1">{tempoPhase}</p>
                    </div>
                    <button
                      onClick={() => { setTempoRunning(!tempoRunning); triggerHaptic(15); }}
                      className={`w-full py-2.5 rounded-xl text-xs font-bold transition-all shadow-sm ${
                        tempoRunning ? "bg-blush-600 text-white" : "bg-blush-100 text-blush-600 hover:bg-blush-200"

          {showWelcomeScreen && (
            <div className="fixed inset-0 bg-charcoal/40 backdrop-blur-sm flex items-center justify-center p-4 z-50 overflow-y-auto">
              <div className="card-light rounded-3xl p-5 max-w-sm w-full space-y-4 my-auto border-blush-300 shadow-2xl">
                <div className="text-center space-y-1">
                  <span className="text-[9px] font-bold text-roseGold uppercase tracking-widest">Welcome Tour</span>
                  <h3 className="text-lg font-serif font-bold text-charcoal">metabolic60 ✨</h3>
                  <p className="text-xs text-mutedMauve">Feminine metabolic strength & hormonal lifestyle sync.</p>
                </div>

                <div className="relative rounded-2xl overflow-hidden border border-blush-200 bg-blush-50 aspect-video shadow-sm flex items-center justify-center">
                  <video
                    src="https://cdn.coverr.co/videos/coverr-woman-exercising-in-a-gym-5364/1080p.mp4"
                    poster="https://images.unsplash.com/photo-1518611012118-696072aa579a?auto=format&fit=crop&w=800&q=80"
                    autoPlay
                    loop
                    muted
                    playsInline
                    className="w-full h-full object-cover"
                  />
                  <div className="absolute inset-0 bg-gradient-to-t from-charcoal/40 via-transparent to-transparent"></div>
                  <div className="absolute bottom-2.5 left-3 right-3 flex justify-between items-center text-[10px] text-white font-bold">
                    <span>60-Day Transformation</span>
                    <span className="bg-blush-500 px-2 py-0.5 rounded-full">Preview</span>
                  </div>
                </div>

                <button
                  onClick={() => {
                    setShowWelcomeScreen(false);
                    if (!userProfile.onboardingCompleted) startOnboardingWizard();
                  }}
                  className="w-full py-3 rounded-2xl bg-gradient-to-r from-blush-400 to-blush-500 text-white font-bold text-xs shadow-md"
                >
                  {userProfile.onboardingCompleted ? "Enter App ✨" : "Begin Personalization Setup →"}
                </button>
              </div>
            </div>
          )}

          {/* ONBOARDING WIZARD */}
          {showOnboardingModal && (
            <div className="fixed inset-0 bg-charcoal/40 backdrop-blur-sm flex items-center justify-center p-4 z-50 overflow-y-auto">
              <div className="card-light rounded-3xl p-5 max-w-sm w-full space-y-4 my-auto border-blush-300 shadow-2xl">
                <div className="flex justify-between items-center border-b border-blush-100 pb-3">
                  <div>
                    <span className="text-[9px] font-bold text-roseGold uppercase tracking-widest">Personalization</span>
                    <h3 className="text-sm font-serif font-bold text-charcoal">Step {onboardingStep} of 3</h3>
                  </div>
                </div>

                {onboardingStep === 1 && (
                  <div className="space-y-3">
                    <label className="block text-[10px] font-bold text-mutedMauve uppercase">Your First Name</label>
                    <input
                      type="text"
                      value={tempProfile.name}
                      onChange={e => setTempProfile({ ...tempProfile, name: e.target.value })}
                      placeholder="e.g. Lindiwe"
                      className="w-full bg-blush-50 border border-blush-200 text-charcoal rounded-xl p-3 text-xs font-bold focus:outline-none"
                    />
                  </div>
                )}

                {onboardingStep === 2 && (
                  <div className="space-y-3">
                    <label className="block text-[10px] font-bold text-mutedMauve uppercase">Primary Focus Goal</label>
                    {["Fat Loss & Metabolic Reset", "Glute Lift & Waist Taper", "Full Body Recomposition"].map(g => (
                      <div
                        key={g}
                        onClick={() => setTempProfile({ ...tempProfile, goal: g })}
                        className={`p-3 rounded-2xl border text-xs font-bold cursor-pointer ${
                          tempProfile.goal === g ? "bg-blush-50 border-blush-500 text-blush-600" : "bg-white border-blush-200 text-charcoal"
                        }`}
                      >
                        {g}
                      </div>
                    ))}
                  </div>
                )}

                {onboardingStep === 3 && (
                  <div className="text-center space-y-2">
                    <h4 className="text-base font-serif font-bold text-charcoal">All Set for {tempProfile.name}!</h4>
                    <p className="text-xs text-mutedMauve">Your custom metabolic macros & hormonal strength plan are calibrated.</p>
                  </div>
                )}

                <div className="flex gap-2 pt-2 border-t border-blush-100">
                  {onboardingStep < 3 ? (
                    <button
                      onClick={() => setOnboardingStep(prev => prev + 1)}
                      className="flex-1 py-2.5 rounded-xl bg-blush-500 text-white text-xs font-bold"
                    >
                      Continue →
                    </button>
                  ) : (
                    <button
                      onClick={completeOnboarding}
                      className="flex-1 py-3 rounded-xl bg-gradient-to-r from-blush-400 to-blush-500 text-white text-xs font-bold shadow-md"
                    >
                      Launch metabolic60 ✨
                    </button>
                  )}
                </div>
              </div>
            </div>
          )}

          {/* RESET CONFIRMATION MODAL */}
          {showResetConfirmModal && (
            <div className="fixed inset-0 bg-charcoal/40 backdrop-blur-sm flex items-center justify-center p-4 z-50">
              <div className="card-light rounded-3xl p-5 max-w-sm w-full space-y-4 border-rose-300 shadow-2xl text-center">
                <h3 className="text-base font-serif font-bold text-charcoal">Reset All Lifestyle Data?</h3>
                <p className="text-xs text-mutedMauve">This will clear your local workout records and restart fresh.</p>
                <div className="flex gap-2 pt-2 border-t border-blush-100">
                  <button onClick={() => setShowResetConfirmModal(false)} className="flex-1 py-2 rounded-xl bg-blush-50 text-xs font-bold text-charcoal">
                    Cancel
                  </button>
                  <button onClick={executeFullReset} className="flex-1 py-2 rounded-xl bg-rose-500 text-white text-xs font-bold">
                    Reset
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* BOTTOM NAVIGATION DOCK */}
          <nav className="fixed bottom-0 left-0 right-0 bg-white/95 backdrop-blur border-t border-blush-200 px-4 py-2.5 flex justify-around items-center z-40 shadow-sm">
            <button
              onClick={() => { setTab("train"); triggerHaptic(10); }}
              className={`flex flex-col items-center gap-0.5 text-xs font-medium transition-all ${
                tab === "train" ? "text-blush-600 font-bold" : "text-mutedMauve"
              }`}
            >
              <span className="text-base">🌸</span>
              <span className="text-[10px]">Train</span>
            </button>
            <button
              onClick={() => { setTab("fuel"); triggerHaptic(10); }}
              className={`flex flex-col items-center gap-0.5 text-xs font-medium transition-all ${
                tab === "fuel" ? "text-blush-600 font-bold" : "text-mutedMauve"
              }`}
            >
              <span className="text-base">🥗</span>
              <span className="text-[10px]">Fuel</span>
            </button>
            <button
              onClick={() => { setTab("progress"); triggerHaptic(10); }}
              className={`flex flex-col items-center gap-0.5 text-xs font-medium transition-all ${
                tab === "progress" ? "text-blush-600 font-bold" : "text-mutedMauve"
              }`}
            >
              <span className="text-base">🗓️</span>
              <span className="text-[10px]">Calendar</span>
            </button>
            <button
              onClick={() => { setTab("profile"); triggerHaptic(10); }}
              className={`flex flex-col items-center gap-0.5 text-xs font-medium transition-all ${
                tab === "profile" ? "text-blush-600 font-bold" : "text-mutedMauve"
              }`}
            >
              <span className="text-base">✨</span>
              <span className="text-[10px]">Profile</span>
            </button>
          </nav>

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
