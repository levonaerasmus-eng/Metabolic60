    const playTone = (freq = 440, type = 'sine', duration = 0.15) => {
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        const ctx = new AudioCtx();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = type;
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0.08, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + duration);
      } catch (e) {}
    };

    // --- Interactive Three.js 3D Lab Component ---
    function Interactive3DLab({ targetMuscles = [] }) {
      const mountRef = useRef(null);

      useEffect(() => {
        const container = mountRef.current;
        if (!container) return;

        // Scene, Camera, Renderer
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
        camera.position.set(0, 0, 8);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        container.innerHTML = '';
        container.appendChild(renderer.domElement);

        // Lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
        scene.add(ambientLight);

        const pointLight = new THREE.PointLight(0xf43f5e, 2, 50);
        pointLight.position.set(5, 5, 5);
        scene.add(pointLight);

        // 3D Dumbbell / Anatomical Model Assembly
        const group = new THREE.Group();

        // Dumbbell Bar (Metallic Chrome)
        const barGeo = new THREE.CylinderGeometry(0.12, 0.12, 4.2, 32);
        const barMat = new THREE.MeshStandardMaterial({ color: 0xe2e8f0, roughness: 0.2, metalness: 0.85 });
        const barMesh = new THREE.Mesh(barGeo, barMat);
        barMesh.rotation.z = Math.PI / 2;
        group.add(barMesh);

        // Dumbbell Weight Plates (Rose Neon Glow)
        const plateGeo = new THREE.CylinderGeometry(1.2, 1.2, 0.4, 32);
        const plateMat = new THREE.MeshStandardMaterial({ color: 0xf43f5e, roughness: 0.3, metalness: 0.5, emissive: 0x881337, emissiveIntensity: 0.6 });

        const leftPlate1 = new THREE.Mesh(plateGeo, plateMat);
        leftPlate1.rotation.z = Math.PI / 2;
        leftPlate1.position.x = -1.6;
        group.add(leftPlate1);

        const leftPlate2 = new THREE.Mesh(plateGeo, plateMat);
        leftPlate2.rotation.z = Math.PI / 2;
        leftPlate2.position.x = -1.9;
        leftPlate2.scale.set(0.85, 0.85, 0.85);
        group.add(leftPlate2);

        const rightPlate1 = new THREE.Mesh(plateGeo, plateMat);
        rightPlate1.rotation.z = Math.PI / 2;
        rightPlate1.position.x = 1.6;
        group.add(rightPlate1);

        const rightPlate2 = new THREE.Mesh(plateGeo, plateMat);
        rightPlate2.rotation.z = Math.PI / 2;
        rightPlate2.position.x = 1.9;
        rightPlate2.scale.set(0.85, 0.85, 0.85);
        group.add(rightPlate2);

        // Glowing Muscle Orbital Ring
        const ringGeo = new THREE.TorusGeometry(2.4, 0.04, 16, 100);
        const ringMat = new THREE.MeshBasicMaterial({ color: 0xfb7185 });
        const ringMesh = new THREE.Mesh(ringGeo, ringMat);
        group.add(ringMesh);

        scene.add(group);

        // Touch & Drag Interaction
        let isDragging = false;
        let prevMousePos = { x: 0, y: 0 };

        const onPointerDown = (e) => {
          isDragging = true;
          prevMousePos = { x: e.clientX || (e.touches && e.touches[0].clientX), y: e.clientY || (e.touches && e.touches[0].clientY) };
        };

        const onPointerMove = (e) => {
          if (!isDragging) return;
          const clientX = e.clientX || (e.touches && e.touches[0].clientX);
          const clientY = e.clientY || (e.touches && e.touches[0].clientY);
          const deltaX = clientX - prevMousePos.x;
          const deltaY = clientY - prevMousePos.y;

          group.rotation.y += deltaX * 0.01;
          group.rotation.x += deltaY * 0.01;

          prevMousePos = { x: clientX, y: clientY };
        };

        const onPointerUp = () => { isDragging = false; };

        container.addEventListener('mousedown', onPointerDown);
        container.addEventListener('mousemove', onPointerMove);
        window.addEventListener('mouseup', onPointerUp);
        container.addEventListener('touchstart', onPointerDown);
        container.addEventListener('touchmove', onPointerMove);
        window.addEventListener('touchend', onPointerUp);

        // Animation Loop
        let reqId;
        const animate = () => {
          reqId = requestAnimationFrame(animate);
          if (!isDragging) {
            group.rotation.y += 0.008;
            group.rotation.x += 0.004;
          }
          ringMesh.rotation.z += 0.015;
          renderer.render(scene, camera);
        };
        animate();

        return () => {
          cancelAnimationFrame(reqId);
          container.innerHTML = '';
        };
      }, [targetMuscles]);

      return (
        <div className="relative w-full h-56 bg-slate-950/90 rounded-2xl border border-slate-800 overflow-hidden shadow-2xl">
          <div ref={mountRef} className="w-full h-full cursor-grab active:cursor-grabbing" />
          <div className="absolute top-3 left-3 bg-slate-900/80 backdrop-blur px-2.5 py-1 rounded-lg border border-slate-700/60">
            <span className="text-[10px] font-bold text-rose-400 uppercase tracking-wider flex items-center gap-1.5">
              <span className="w-2 h-2 rounded-full bg-rose-500 animate-pulse"></span> 3D Interactive Lab
            </span>
          </div>
          <div className="absolute bottom-2.5 right-3 text-[10px] text-slate-400 font-medium">
            Touch & Drag to Rotate 3D Model
          </div>
        </div>
      );
    }

      // Metronome Engine (3-0-1)

      const radius = 24;
      const circumference = 2 * Math.PI * radius;

      // Persistence
      useEffect(() => {
        localStorage.setItem('fm_phase', phase);

        localStorage.setItem('fm_sets', JSON.stringify(completedSets));

                    <button
                      onClick={() => setSelectedExercise(null)}
                      className="bg-slate-950/80 text-white rounded-full w-7 h-7 flex items-center justify-center font-bold text-xs border border-slate-700"
                    >
                      ✕
                    </button>
                  </div>
                  <div className="absolute bottom-2 left-3 bg-slate-950/80 backdrop-blur px-2.5 py-0.5 rounded-full border border-rose-500/40">
                    <span className="text-[10px] text-rose-400 font-mono font-bold">Tempo: {selectedExercise.tempo}</span>
                  </div>
                </div>

                <div className="p-4 space-y-3">
                  <div>
                    <h3 className="text-sm font-black text-white">{selectedExercise.name}</h3>
                    <p className="text-[11px] text-rose-400 font-medium">Primary Focus: {selectedExercise.target}</p>
                  </div>

                  <div className="bg-slate-950 p-3 rounded-xl border border-slate-800 text-xs text-slate-300 leading-relaxed">
                    <p><strong>Form Execution:</strong> {selectedExercise.cues}</p>
                  </div>

                  <button
                    onClick={() => setSelectedExercise(null)}
                    className="w-full bg-rose-600 hover:bg-rose-500 text-white py-2.5 rounded-xl font-bold text-xs transition-all shadow-lg shadow-rose-950"
                  >
                    Got It, Let's Lift
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
