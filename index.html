<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>FemMetabolic Pro • 60-Day Visual Coach</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React 18 & Babel CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body {
      background-color: #020617;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    .timer-ring {
      transition: stroke-dashoffset 1s linear;
      transform: rotate(-90deg);
      transform-origin: 50% 50%;
    }
    .tempo-pulse {
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // --- 1. Sound & Voice Engine ---
    const playTone = (freq = 440, type = 'sine', duration = 0.15) => {
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        const ctx = new AudioCtx();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = type;
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0.08, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + duration);
      } catch (e) {}
    };

    const speakCoach = (text, enabled = true) => {
      if (!enabled || !('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.rate = 1.05;
      u.pitch = 1.1;
      window.speechSynthesis.speak(u);
    };

    // --- 2. Program Master Data ---
    const CYCLE_MODES = {
      follicular: {
        name: "Follicular Phase (Days 1–13)",
        focus: "High Insulin Sensitivity • Max Strength & Load",
        tag: "High Energy",
        color: "text-rose-400 border-rose-500 bg-rose-950/60",
        carbNote: "Consume 60% of daily starchy carbohydrates within 90 min of workout.",
        loadModifier: 1.0
      },
      luteal: {
        name: "Luteal Phase (Days 14–28)",
        focus: "Elevated Core Temp • Steady Tempo & Low Cortisol",
        tag: "Recovery Mode",
        color: "text-amber-400 border-amber-500 bg-amber-950/60",
        carbNote: "Higher progesterone reduces carb tolerance. Focus on healthy fats & electrolytes.",
        loadModifier: 0.92
      }
    };

    const WORKOUT_DB = {
      phase1: {
        A: {
          title: "Workout A: Glute Drive & Push Sculpt",
          focus: "Posterior Chain, Glute Max & Core Stabilization",
          muscles: ["glutes", "quads", "chest", "shoulders"],
          warmup: ["Diaphragmatic 360° Breaths (10x)", "Glute Bridges w/ 2s Squeeze (12x)", "Banded Clamshells (12/side)"],
          exercises: [
            { id: "p1_a1", name: "Dumbbell Goblet Squat", target: "Glutes & Quads", primaryMuscle: "quads", sets: 3, reps: 12, defaultWeight: 7.5, tempo: "3-0-1", icon: "🍑" },
            { id: "p1_a2", name: "Dumbbell Floor Press", target: "Chest & Triceps", primaryMuscle: "chest", sets: 3, reps: 12, defaultWeight: 5.0, tempo: "2-0-1", icon: "💪" },
            { id: "p1_a3", name: "Dumbbell Romanian Deadlift", target: "Hamstrings & Glute Tie-in", primaryMuscle: "glutes", sets: 3, reps: 12, defaultWeight: 7.5, tempo: "3-1-1", icon: "🦵" },
            { id: "p1_a4", name: "Seated DB Overhead Press", target: "Deltoid Definition", primaryMuscle: "shoulders", sets: 3, reps: 10, defaultWeight: 4.0, tempo: "2-0-1", icon: "✨" },
            { id: "p1_a5", name: "Dumbbell Lateral Raises", target: "Hourglass Shoulder Cap", primaryMuscle: "shoulders", sets: 3, reps: 12, defaultWeight: 2.5, tempo: "2-1-1", icon: "🦋" }
          ]
        },
        B: {
          title: "Workout B: Back Sculpt, Glute Med & Core",
          focus: "Waist Tapering, Gluteus Medius & Pelvic Floor",
          muscles: ["lats", "glutes", "core", "hamstrings"],
          warmup: ["Cat-Cow Pelvic Tilts (10x)", "Bird-Dog Core Holds (8/side)", "Side-Lying Leg Raises (12/side)"],
          exercises: [
            { id: "p1_b1", name: "Weighted Hip Thrust", target: "Glute Upper Shelf", primaryMuscle: "glutes", sets: 3, reps: 15, defaultWeight: 10.0, tempo: "2-2-1", icon: "🍑" },
            { id: "p1_b2", name: "Single-Arm DB Row", target: "Mid-Back (Waist Taper)", primaryMuscle: "lats", sets: 3, reps: 10, defaultWeight: 6.0, tempo: "2-1-1", icon: "🚣" },
            { id: "p1_b3", name: "DB Deficit Reverse Lunges", target: "Glute Stretch & Stability", primaryMuscle: "glutes", sets: 3, reps: 10, defaultWeight: 5.0, tempo: "2-0-1", icon: "🦵" },
            { id: "p1_b4", name: "Banded Face Pulls", target: "Postural Lift & Rear Delts", primaryMuscle: "shoulders", sets: 3, reps: 15, defaultWeight: 0, tempo: "2-2-1", icon: "🎯" },
            { id: "p1_b5", name: "Deadbugs (Pelvic Locked)", target: "Transverse Abdominis", primaryMuscle: "core", sets: 3, reps: 10, defaultWeight: 0, tempo: "Slow", icon: "🛡️" }
          ]
        },
        C: {
          title: "Workout C: Metabolic Full Body Burn",
          focus: "EPOC Caloric Density & Dynamic Core",
          muscles: ["quads", "lats", "shoulders", "core"],
          warmup: ["World's Greatest Stretch (5/side)", "Bodyweight Squat to Stand (10x)"],
          exercises: [
            { id: "p1_c1", name: "DB Step-Ups (Ottoman/Chair)", target: "Single-Leg Glute Power", primaryMuscle: "glutes", sets: 3, reps: 10, defaultWeight: 4.0, tempo: "2-0-1", icon: "🪜" },
            { id: "p1_c2", name: "Dumbbell Thrusters", target: "Full Body Glycogen Burn", primaryMuscle: "quads", sets: 3, reps: 10, defaultWeight: 4.0, tempo: "1-0-1", icon: "⚡" },
            { id: "p1_c3", name: "DB Renegade Rows", target: "Anti-Rotational Core & Back", primaryMuscle: "core", sets: 3, reps: 8, defaultWeight: 5.0, tempo: "2-0-1", icon: "🔥" },
            { id: "p1_c4", name: "DB Sumo Squats", target: "Inner Thigh & Glutes", primaryMuscle: "quads", sets: 3, reps: 12, defaultWeight: 8.0, tempo: "3-0-1", icon: "🧘‍♀️" },
            { id: "p1_c5", name: "Plank Shoulder Taps", target: "Deep Core Endurance", primaryMuscle: "core", sets: 3, reps: 30, defaultWeight: 0, tempo: "Iso", icon: "⏱️" }
          ]
        }
      },
      phase2: {
        A: {
          title: "Workout A: Density Supersets",
          focus: "Maximum Afterburn & Glycogen Depletion",
          muscles: ["glutes", "quads", "lats", "chest"],
          warmup: ["Glute Bridge March (12x)", "Thoracic Rotations (8/side)"],
          exercises: [
            { id: "p2_a1", name: "Superset: Goblet Squat + DB Row", target: "Antagonist Metabolic Pair", primaryMuscle: "quads", sets: 4, reps: 12, defaultWeight: 8.0, tempo: "2-0-1", icon: "⚡" },
            { id: "p2_a2", name: "Superset: DB RDL + Floor Press", target: "Posterior & Anterior Chain", primaryMuscle: "glutes", sets: 4, reps: 12, defaultWeight: 8.0, tempo: "2-0-1", icon: "🔥" },
            { id: "p2_a3", name: "Finisher: Elevated Mountain Climbers", target: "Core & Cardiovascular EPOC", primaryMuscle: "core", sets: 4, reps: 30, defaultWeight: 0, tempo: "Fast", icon: "💨" }
          ]
        },
        B: {
          title: "Workout B: Unilateral Sculpt & Core",
          focus: "Glute Isolation & Anti-Rotational Strength",
          muscles: ["glutes", "shoulders", "core"],
          warmup: ["Single Leg Glute Bridge (10/side)", "Side Plank Lift (8/side)"],
          exercises: [
            { id: "p2_b1", name: "Superset: Split Squats + Lateral Raises", target: "Glute Stretch & Shoulder Caps", primaryMuscle: "glutes", sets: 4, reps: 10, defaultWeight: 6.0, tempo: "2-0-1", icon: "🦋" },
            { id: "p2_b2", name: "Superset: Hip Thrust + Face Pull", target: "Upper Glute Shelf & Posture", primaryMuscle: "glutes", sets: 4, reps: 15, defaultWeight: 10.0, tempo: "2-1-1", icon: "🎯" }
          ]
        },
        C: {
          title: "Workout C: Metabolic Complexes",
          focus: "Continuous Time-Under-Tension",
          muscles: ["quads", "lats", "shoulders", "core"],
          warmup: ["Cat Cow (10x)", "Inchworms (6x)"],
          exercises: [
            { id: "p2_c1", name: "Complex: Clean to Squat to Press", target: "Full Body Conditioning", primaryMuscle: "quads", sets: 4, reps: 10, defaultWeight: 5.0, tempo: "Continuous", icon: "🌟" },
            { id: "p2_c2", name: "Renegade Row to Push-Up", target: "Upper Body & Transverse Abs", primaryMuscle: "core", sets: 4, reps: 8, defaultWeight: 5.0, tempo: "Controlled", icon: "🛡️" }
          ]
        }
      }
    };

    // --- 3. Interactive SVG Muscle Heatmap Component ---
    function MuscleHeatmap({ activeMuscles = [] }) {
      const isLit = (group) => activeMuscles.includes(group);
      const activeColor = "#f43f5e"; // Rose-500
      const inactiveColor = "#1e293b"; // Slate-800

      return (
        <div className="bg-slate-950 p-3 rounded-2xl border border-slate-800 flex items-center justify-around">
          {/* Front Body */}
          <div className="flex flex-col items-center">
            <span className="text-[9px] font-bold uppercase text-slate-400 mb-1">Front Focus</span>
            <svg width="64" height="110" viewBox="0 0 100 180" className="drop-shadow">
              {/* Head */}
              <circle cx="50" cy="16" r="11" fill="#334155" />
              {/* Shoulders */}
              <path d="M 28 35 Q 50 30 72 35 L 78 50 L 22 50 Z" fill={isLit('shoulders') ? activeColor : inactiveColor} />
              {/* Chest */}
              <rect x="30" y="48" width="40" height="20" rx="4" fill={isLit('chest') ? activeColor : inactiveColor} />
              {/* Core / Abs */}
              <rect x="34" y="70" width="32" height="26" rx="3" fill={isLit('core') ? activeColor : inactiveColor} />
              {/* Quads / Legs */}
              <path d="M 28 100 L 46 100 L 42 145 L 26 145 Z" fill={isLit('quads') ? activeColor : inactiveColor} />
              <path d="M 54 100 L 72 100 L 74 145 L 58 145 Z" fill={isLit('quads') ? activeColor : inactiveColor} />
              {/* Lower Legs */}
              <rect x="28" y="148" width="12" height="24" rx="2" fill="#334155" />
              <rect x="60" y="148" width="12" height="24" rx="2" fill="#334155" />
            </svg>
          </div>

          {/* Back Body */}
          <div className="flex flex-col items-center">
            <span className="text-[9px] font-bold uppercase text-slate-400 mb-1">Back Focus</span>
            <svg width="64" height="110" viewBox="0 0 100 180" className="drop-shadow">
              {/* Head */}
              <circle cx="50" cy="16" r="11" fill="#334155" />
              {/* Upper Back / Lats */}
              <path d="M 26 35 Q 50 32 74 35 L 70 70 L 30 70 Z" fill={isLit('lats') ? activeColor : inactiveColor} />
              {/* Lower Back */}
              <rect x="36" y="72" width="28" height="16" rx="2" fill={isLit('core') ? activeColor : inactiveColor} />
              {/* Glutes */}
              <rect x="28" y="90" width="44" height="24" rx="6" fill={isLit('glutes') ? activeColor : inactiveColor} />
              {/* Hamstrings */}
              <path d="M 28 116 L 46 116 L 43 148 L 27 148 Z" fill={isLit('glutes') || isLit('hamstrings') ? activeColor : inactiveColor} />
              <path d="M 54 116 L 72 116 L 73 148 L 57 148 Z" fill={isLit('glutes') || isLit('hamstrings') ? activeColor : inactiveColor} />
              {/* Calves */}
              <rect x="28" y="150" width="12" height="22" rx="2" fill="#334155" />
              <rect x="60" y="150" width="12" height="22" rx="2" fill="#334155" />
            </svg>
          </div>
        </div>
      );
    }

    // --- 4. Main App Controller ---
    function App() {
      // Navigation & Settings
      const [activeTab, setActiveTab] = useState('workout');
      const [phase, setPhase] = useState(() => localStorage.getItem('fm_phase') || 'phase1');
      const [activeDay, setActiveDay] = useState(() => localStorage.getItem('fm_day') || 'A');
      const [cyclePhase, setCyclePhase] = useState(() => localStorage.getItem('fm_cycle') || 'follicular');
      const [voiceEnabled, setVoiceEnabled] = useState(() => localStorage.getItem('fm_voice') !== 'false');

      // Workout Tracker State
      const [completedSets, setCompletedSets] = useState(() => JSON.parse(localStorage.getItem('fm_sets') || '{}'));
      const [weightLogs, setWeightLogs] = useState(() => JSON.parse(localStorage.getItem('fm_weights') || '{}'));
      const [streakHistory, setStreakHistory] = useState(() => JSON.parse(localStorage.getItem('fm_streak') || '[]'));
      const [waterGlasses, setWaterGlasses] = useState(() => parseInt(localStorage.getItem('fm_water') || '0', 10));

      // Readiness & Cortisol State
      const [readiness, setReadiness] = useState(() => JSON.parse(localStorage.getItem('fm_readiness') || '{"sleep":8,"stress":3,"soreness":4}'));
      const [selectedExercise, setSelectedExercise] = useState(null);

      // Rest Timer State
      const [timerSeconds, setTimerSeconds] = useState(60);
      const [isTimerRunning, setIsTimerRunning] = useState(false);

      // Tempo Metronome State (3-0-1)
      const [metronomeRunning, setMetronomeRunning] = useState(false);
      const [tempoPhase, setTempoPhase] = useState('Lower (3s)');
      const [tempoCount, setTempoCount] = useState(3);

      // SVG Ring Math
      const radius = 24;
      const circumference = 2 * Math.PI * radius;
      const strokeDashoffset = circumference - (timerSeconds / 60) * circumference;

      // Persistence
      useEffect(() => {
        localStorage.setItem('fm_phase', phase);
        localStorage.setItem('fm_day', activeDay);
        localStorage.setItem('fm_cycle', cyclePhase);
        localStorage.setItem('fm_sets', JSON.stringify(completedSets));
        localStorage.setItem('fm_weights', JSON.stringify(weightLogs));
        localStorage.setItem('fm_streak', JSON.stringify(streakHistory));
        localStorage.setItem('fm_water', waterGlasses.toString());
        localStorage.setItem('fm_voice', voiceEnabled.toString());
        localStorage.setItem('fm_readiness', JSON.stringify(readiness));
      }, [phase, activeDay, cyclePhase, completedSets, weightLogs, streakHistory, waterGlasses, voiceEnabled, readiness]);

      // Timer Engine with Audio & Voice Feedback
      useEffect(() => {
        let interval = null;
        if (isTimerRunning && timerSeconds > 0) {
          interval = setInterval(() => {
            setTimerSeconds((prev) => {
              if (prev <= 4 && prev > 1) {
                playTone(550, 'triangle', 0.08);
              } else if (prev === 1) {
                playTone(880, 'sine', 0.3);
                speakCoach("Rest is up! Time for your next set.", voiceEnabled);
              }
              return prev - 1;
            });
          }, 1000);
        } else if (timerSeconds === 0) {
          setIsTimerRunning(false);
          setTimerSeconds(60);
        }
        return () => clearInterval(interval);
      }, [isTimerRunning, timerSeconds, voiceEnabled]);

      // Visual Metronome Engine (3s Down, 0s Pause, 1s Up)
      useEffect(() => {
        let timer = null;
        if (metronomeRunning) {
          let step = 0; // 0,1,2 = eccentric (3s), 3 = concentric (1s)
          timer = setInterval(() => {
            if (step === 0) {
              setTempoPhase('Lowering (Down)');
              setTempoCount(3);
              playTone(400, 'sine', 0.05);
            } else if (step === 1) {
              setTempoCount(2);
              playTone(400, 'sine', 0.05);
            } else if (step === 2) {
              setTempoCount(1);
              playTone(400, 'sine', 0.05);
            } else if (step === 3) {
              setTempoPhase('Drive Up (Explode)');
              setTempoCount(1);
              playTone(800, 'triangle', 0.1);
            }
            step = (step + 1) % 4;
          }, 1000);
        }
        return () => clearInterval(timer);
      }, [metronomeRunning]);

      // Readiness Score Calculation (1 to 10 scale)
      const readinessScore = Math.max(1, Math.min(10, Math.round(readiness.sleep - readiness.stress * 0.4 - readiness.soreness * 0.4 + 4)));
      const isHighCortisol = readinessScore <= 5;
      const loadMultiplier = (isHighCortisol ? 0.85 : 1.0) * CYCLE_MODES[cyclePhase].loadModifier;

      const toggleSet = (key, exerciseName, reps, weight) => {
        const nextState = !completedSets[key];
        const updated = { ...completedSets, [key]: nextState };
        setCompletedSets(updated);

        if (nextState) {
          setTimerSeconds(60);
          setIsTimerRunning(true);
          playTone(520, 'sine', 0.1);
          speakCoach(`Good set. Rest for 60 seconds.`, voiceEnabled);

          // Update Streak History
          const today = new Date().toISOString().slice(0, 10);
          if (!streakHistory.includes(today)) {
            setStreakHistory([...streakHistory, today]);
          }
        }
      };

      const updateWeight = (id, val) => {
        setWeightLogs((prev) => ({ ...prev, [id]: parseFloat(val) || 0 }));
      };

      const currentWorkout = WORKOUT_DB[phase][activeDay];

      // Calculate Total Tonnage Lifted in this session
      const totalSessionTonnage = currentWorkout.exercises.reduce((total, ex) => {
        const loggedW = (weightLogs[ex.id] ?? ex.defaultWeight) * loadMultiplier;
        let completedCount = 0;
        for (let i = 0; i < ex.sets; i++) {
          if (completedSets[`${ex.id}_s_${i}`]) completedCount++;
        }
        return total + Math.round(completedCount * ex.reps * loggedW);
      }, 0);

      return (
        <div className="min-h-screen max-w-md mx-auto p-4 pb-28">
          {/* Header */}
          <header className="flex justify-between items-center mb-3">
            <div>
              <h1 className="text-xl font-black text-white tracking-tight flex items-center gap-1.5">
                <span className="text-rose-500">🌸</span> FemMetabolic Pro
              </h1>
              <p className="text-[10px] text-slate-400">Endomorph Recomposition • Home Protocol</p>
            </div>
            <div className="flex items-center gap-2">
              <button
                onClick={() => setVoiceEnabled(!voiceEnabled)}
                className={`p-1.5 rounded-lg border text-xs ${voiceEnabled ? 'bg-rose-950 border-rose-800 text-rose-300' : 'bg-slate-900 border-slate-800 text-slate-500'}`}
                title="Toggle Voice Coach"
              >
                {voiceEnabled ? "🔊 Voice On" : "🔇 Voice Off"}
              </button>
            </div>
          </header>

          {/* Menstrual & Cortisol Status Strip */}
          <div className="bg-slate-900 border border-slate-800 rounded-2xl p-3 mb-3 shadow-md">
            <div className="flex justify-between items-center mb-2">
              <span className="text-[10px] font-bold uppercase tracking-wider text-slate-400">Cycle Syncing</span>
              <div className="flex gap-1">
                <button
                  onClick={() => setCyclePhase('follicular')}
                  className={`px-2.5 py-1 rounded-lg text-[10px] font-bold border transition-all ${
                    cyclePhase === 'follicular' ? 'bg-rose-600 text-white border-rose-500 shadow' : 'bg-slate-950 text-slate-400 border-slate-800'
                  }`}
                >
                  Follicular
                </button>
                <button
                  onClick={() => setCyclePhase('luteal')}
                  className={`px-2.5 py-1 rounded-lg text-[10px] font-bold border transition-all ${
                    cyclePhase === 'luteal' ? 'bg-amber-600 text-white border-amber-500 shadow' : 'bg-slate-950 text-slate-400 border-slate-800'
                  }`}
                >
                  Luteal
                </button>
              </div>
            </div>
            <div className="flex items-center justify-between text-xs pt-1 border-t border-slate-800/80">
              <span className="text-slate-300 font-semibold">{CYCLE_MODES[cyclePhase].name}</span>
              <span className={`text-[10px] font-bold px-2 py-0.5 rounded-full border ${CYCLE_MODES[cyclePhase].color}`}>
                {CYCLE_MODES[cyclePhase].tag}
              </span>
            </div>
          </div>

          {/* Tab Navigation Views */}
          {activeTab === 'workout' && (
            <>
              {/* Phase & Day Selectors */}
              <div className="grid grid-cols-2 gap-1 bg-slate-900 p-1 rounded-xl border border-slate-800 mb-3">
                <button
                  onClick={() => setPhase('phase1')}
                  className={`py-1.5 text-xs font-bold rounded-lg ${phase === 'phase1' ? 'bg-rose-600 text-white shadow' : 'text-slate-400'}`}
                >
                  Phase 1 (D1–30)
                </button>
                <button
                  onClick={() => setPhase('phase2')}
                  className={`py-1.5 text-xs font-bold rounded-lg ${phase === 'phase2' ? 'bg-rose-600 text-white shadow' : 'text-slate-400'}`}
                >
                  Phase 2 (D31–60)
                </button>
              </div>

              <div className="flex gap-2 mb-3">
                {['A', 'B', 'C'].map((day) => (
                  <button
                    key={day}
                    onClick={() => setActiveDay(day)}
                    className={`flex-1 py-2 rounded-xl text-xs font-bold border transition-all ${
                      activeDay === day ? 'bg-slate-800 text-rose-400 border-rose-500/50 shadow' : 'bg-slate-900 text-slate-400 border-slate-800'
                    }`}
                  >
                    Workout {day}
                  </button>
                ))}
              </div>

              {/* Dynamic Muscle Target Heatmap */}
              <div className="mb-3">
                <MuscleHeatmap activeMuscles={currentWorkout.muscles} />
              </div>

              {/* Live Session Tonnage Card */}
              <div className="bg-slate-900/80 border border-slate-800 rounded-xl px-3.5 py-2 mb-3 flex justify-between items-center">
                <div>
                  <span className="text-[9px] font-bold uppercase text-slate-400">Session Volume Load</span>
                  <p className="text-base font-black text-rose-400 font-mono">{totalSessionTonnage.toLocaleString()} kg</p>
                </div>
                <div className="text-right">
                  <span className="text-[9px] font-bold uppercase text-slate-400">Load Modifier</span>
                  <p className="text-xs font-bold text-slate-200">{Math.round(loadMultiplier * 100)}% ({isHighCortisol ? "Recovery" : "Full"})</p>
                </div>
              </div>

              {/* Pelvic Core Warm-up Checklist */}
              <div className="bg-slate-900/50 border border-slate-800 rounded-xl p-3 mb-3">
                <p className="text-[10px] font-bold uppercase tracking-wider text-rose-400 mb-1">
                  🛡️ Pelvic Floor & Core Activation
                </p>
                <div className="flex flex-wrap gap-1">
                  {currentWorkout.warmup.map((w, idx) => (
                    <span key={idx} className="text-[10px] bg-slate-950 text-slate-300 px-2 py-0.5 rounded-md border border-slate-800">
                      • {w}
                    </span>
                  ))}
                </div>
              </div>

              {/* Exercise Log Cards */}
              <div className="space-y-3">
                {currentWorkout.exercises.map((ex) => {
                  const baseW = weightLogs[ex.id] ?? ex.defaultWeight;
                  const adjustedW = (baseW * loadMultiplier).toFixed(1);
                  return (
                    <div key={ex.id} className="bg-slate-900 border border-slate-800 rounded-2xl p-3.5 shadow-md">
                      <div className="flex items-start justify-between mb-2">
                        <div className="flex items-center gap-2.5 cursor-pointer" onClick={() => setSelectedExercise(ex)}>
                          <div className="w-9 h-9 rounded-xl bg-slate-950 border border-slate-800 flex items-center justify-center text-base">
                            {ex.icon}
                          </div>
                          <div>
                            <h3 className="text-xs font-bold text-slate-100 hover:text-rose-400">{ex.name} ℹ️</h3>
                            <p className="text-[10px] text-slate-400">
                              {ex.sets} sets × {ex.reps} • Target: <span className="text-rose-300">{ex.target}</span>
                            </p>
                          </div>
                        </div>

                        {/* Weight Adjuster */}
                        <div className="flex items-center gap-1">
                          <input
                            type="number"
                            step="0.5"
                            value={baseW}
                            onChange={(e) => updateWeight(ex.id, e.target.value)}
                            className="w-12 bg-slate-950 border border-slate-700 text-white font-mono text-xs text-center py-1 rounded-lg focus:outline-none focus:border-rose-500"
                          />
                          <span className="text-[10px] text-slate-400">kg</span>
                        </div>
                      </div>

                      {/* Set Completion Bubbles */}
                      <div className="flex gap-2">
                        {Array.from({ length: ex.sets }).map((_, idx) => {
                          const setKey = `${ex.id}_s_${idx}`;
                          const isDone = !!completedSets[setKey];
                          return (
                            <button
                              key={idx}
                              onClick={() => toggleSet(setKey, ex.name, ex.reps, adjustedW)}
                              className={`flex-1 py-2 rounded-xl text-xs font-bold transition-all ${
                                isDone ? 'bg-rose-600 text-white shadow' : 'bg-slate-950 text-slate-400 hover:bg-slate-800'
                              }`}
                            >
                              {isDone ? "✓" : `Set ${idx + 1}`}
                            </button>
                          );
                        })}
                      </div>
                    </div>
                  );
                })}
              </div>
            </>
          )}

          {/* Visual Tempo Metronome Tab */}
          {activeTab === 'metronome' && (
            <div className="bg-slate-900 border border-slate-800 rounded-2xl p-5 shadow-xl text-center space-y-6">
              <div>
                <h2 className="text-base font-black text-white">Visual 3-0-1 Tempo Metronome</h2>
                <p className="text-xs text-slate-400 mt-1">3s Lower (Eccentric) • 0s Pause • 1s Explode (Concentric)</p>
              </div>

              {/* Dynamic Expanding Animation Box */}
              <div className="h-44 bg-slate-950 rounded-2xl border border-slate-800 flex flex-col items-center justify-center relative overflow-hidden">
                <div
                  className="w-28 h-28 rounded-2xl bg-rose-600/30 border-2 border-rose-500 flex flex-col items-center justify-center tempo-pulse shadow-2xl"
                  style={{
                    transform: metronomeRunning
                      ? tempoCount === 3
                        ? 'scale(1.25)'
                        : tempoCount === 2
                        ? 'scale(1.1)'
                        : tempoCount === 1 && tempoPhase.includes('Lower')
                        ? 'scale(0.95)'
                        : 'scale(1.3)'
                      : 'scale(1.0)'
                  }}
                >
                  <span className="text-3xl font-black font-mono text-white">{metronomeRunning ? tempoCount : "3-0-1"}</span>
                  <span className="text-[9px] font-bold uppercase text-rose-300 mt-1">{tempoPhase}</span>
                </div>
              </div>

              <div className="flex gap-2">
                <button
                  onClick={() => setMetronomeRunning(!metronomeRunning)}
                  className={`flex-1 py-3 rounded-xl font-bold text-xs transition-all ${
                    metronomeRunning ? 'bg-amber-600 text-white' : 'bg-rose-600 text-white shadow-lg'
                  }`}
                >
                  {metronomeRunning ? "Pause Metronome" : "Start Rep Tempo"}
                </button>
              </div>
            </div>
          )}

          {/* Daily Readiness & Cortisol Tab */}
          {activeTab === 'readiness' && (
            <div className="bg-slate-900 border border-slate-800 rounded-2xl p-5 shadow-xl space-y-5">
              <div className="flex justify-between items-center">
                <h2 className="text-sm font-bold text-white">Morning Cortisol & Readiness Check</h2>
                <span className={`text-xs font-black px-2.5 py-1 rounded-full ${readinessScore > 5 ? 'bg-emerald-950 text-emerald-400 border border-emerald-800' : 'bg-amber-950 text-amber-400 border border-amber-800'}`}>
                  Score: {readinessScore}/10
                </span>
              </div>

              {/* Sliders */}
              <div className="space-y-3">
                <div>
                  <div className="flex justify-between text-xs text-slate-300 mb-1">
                    <span>Sleep Quality (Hours/Depth)</span>
                    <span className="font-bold text-rose-400">{readiness.sleep}/10</span>
                  </div>
                  <input
                    type="range"
                    min="1"
                    max="10"
                    value={readiness.sleep}
                    onChange={(e) => setReadiness({ ...readiness, sleep: Number(e.target.value) })}
                    className="w-full h-1.5 bg-slate-950 rounded-lg appearance-none cursor-pointer accent-rose-500"
                  />
                </div>

                <div>
                  <div className="flex justify-between text-xs text-slate-300 mb-1">
                    <span>Life Stress / Mental Load</span>
                    <span className="font-bold text-amber-400">{readiness.stress}/10</span>
                  </div>
                  <input
                    type="range"
                    min="1"
                    max="10"
                    value={readiness.stress}
                    onChange={(e) => setReadiness({ ...readiness, stress: Number(e.target.value) })}
                    className="w-full h-1.5 bg-slate-950 rounded-lg appearance-none cursor-pointer accent-amber-500"
                  />
                </div>

                <div>
                  <div className="flex justify-between text-xs text-slate-300 mb-1">
                    <span>Muscle Soreness / Fatigue</span>
                    <span className="font-bold text-sky-400">{readiness.soreness}/10</span>
                  </div>
                  <input
                    type="range"
                    min="1"
                    max="10"
                    value={readiness.soreness}
                    onChange={(e) => setReadiness({ ...readiness, soreness: Number(e.target.value) })}
                    className="w-full h-1.5 bg-slate-950 rounded-lg appearance-none cursor-pointer accent-sky-500"
                  />
                </div>
              </div>

              {/* Assessment Message */}
              <div className="bg-slate-950 p-3.5 rounded-xl border border-slate-800 text-xs leading-relaxed text-slate-300">
                {readinessScore > 5 ? (
                  <p>✅ <strong>Optimal Recovery:</strong> Cortisol is controlled. Proceed with standard weights and focus on progressive overload.</p>
                ) : (
                  <p>⚠️ <strong>High Cortisol Alert:</strong> Working weights automatically scaled down by 15% to protect joint recovery and prevent fluid retention.</p>
                )}
              </div>
            </div>
          )}

          {/* Progress & 60-Day Streak Grid */}
          {activeTab === 'progress' && (
            <div className="bg-slate-900 border border-slate-800 rounded-2xl p-5 shadow-xl space-y-4">
              <h2 className="text-sm font-bold text-white">60-Day Consistency Grid</h2>
              <p className="text-[11px] text-slate-400">Total Completed Sessions: {streakHistory.length} Days</p>

              {/* 60-Day Heatmap Blocks */}
              <div className="grid grid-cols-10 gap-1.5 bg-slate-950 p-3 rounded-xl border border-slate-800">
                {Array.from({ length: 60 }).map((_, i) => {
                  const isDone = i < streakHistory.length;
                  return (
                    <div
                      key={i}
                      className={`h-5 rounded-md flex items-center justify-center text-[8px] font-bold ${
                        isDone ? 'bg-rose-600 text-white shadow-sm' : 'bg-slate-900 text-slate-600'
                      }`}
                    >
                      {i + 1}
                    </div>
                  );
                })}
              </div>

              {/* Anti-Bloat Hydration Tracker */}
              <div className="bg-slate-950 p-3.5 rounded-xl border border-slate-800">
                <div className="flex justify-between items-center mb-2">
                  <span className="text-xs font-bold text-slate-200">💧 Anti-Bloat Water Goal</span>
                  <span className="text-xs font-black text-sky-400">{(waterGlasses * 0.25).toFixed(1)} / 3.0 L</span>
                </div>
                <div className="flex gap-1">
                  {Array.from({ length: 12 }).map((_, i) => (
                    <button
                      key={i}
                      onClick={() => setWaterGlasses((prev) => (prev === i + 1 ? i : i + 1))}
                      className={`flex-1 h-7 rounded-md text-[9px] font-bold ${
                        i < waterGlasses ? 'bg-sky-500 text-white' : 'bg-slate-900 text-slate-600'
                      }`}
                    >
                      •
                    </button>
                  ))}
                </div>
              </div>
            </div>
          )}

          {/* Floating Persistent Circular Rest Timer */}
          {activeTab === 'workout' && (
            <div className="fixed bottom-14 left-4 right-4 max-w-md mx-auto bg-slate-900/95 backdrop-blur border border-slate-800 rounded-2xl p-3 flex justify-between items-center shadow-2xl z-40">
              <div className="flex items-center gap-3">
                <svg width="56" height="56" className="w-10 h-10">
                  <circle cx="20" cy="20" r={radius} stroke="#1e293b" strokeWidth="4" fill="transparent" />
                  <circle
                    cx="20"
                    cy="20"
                    r={radius}
                    stroke="#f43f5e"
                    strokeWidth="4"
                    fill="transparent"
                    strokeDasharray={circumference}
                    strokeDashoffset={strokeDashoffset}
                    strokeLinecap="round"
                    className="timer-ring"
                  />
                  <text x="20" y="23" textAnchor="middle" fill="#ffffff" fontSize="9" fontWeight="bold">
                    {timerSeconds}s
                  </text>
                </svg>
                <div>
                  <p className="text-[9px] font-bold uppercase text-slate-400 tracking-wider">Rest Recovery</p>
                  <p className="text-xs text-slate-200 font-medium">{isTimerRunning ? "Oxidizing lactic acid..." : "Interval Paused"}</p>
                </div>
              </div>
              <div className="flex gap-1.5">
                <button
                  onClick={() => setIsTimerRunning(!isTimerRunning)}
                  className="bg-rose-600 hover:bg-rose-500 text-white text-xs font-bold px-3.5 py-1.5 rounded-xl transition-all"
                >
                  {isTimerRunning ? "Pause" : "Start"}
                </button>
                <button
                  onClick={() => {
                    setIsTimerRunning(false);
                    setTimerSeconds(60);
                  }}
                  className="bg-slate-800 text-slate-300 text-xs font-bold px-2.5 py-1.5 rounded-xl"
                >
                  ↺
                </button>
              </div>
            </div>
          )}

          {/* Bottom Dock Navigation */}
          <nav className="fixed bottom-0 left-0 right-0 bg-slate-950 border-t border-slate-800/80 py-2.5 px-4 flex justify-around items-center z-50">
            <button
              onClick={() => setActiveTab('workout')}
              className={`text-xs font-bold transition-all flex flex-col items-center ${activeTab === 'workout' ? 'text-rose-500' : 'text-slate-400'}`}
            >
              🏋️ Workout
            </button>
            <button
              onClick={() => setActiveTab('metronome')}
              className={`text-xs font-bold transition-all flex flex-col items-center ${activeTab === 'metronome' ? 'text-rose-500' : 'text-slate-400'}`}
            >
              ⏱️ Tempo
            </button>
            <button
              onClick={() => setActiveTab('readiness')}
              className={`text-xs font-bold transition-all flex flex-col items-center ${activeTab === 'readiness' ? 'text-rose-500' : 'text-slate-400'}`}
            >
              🧘 Readiness
            </button>
            <button
              onClick={() => setActiveTab('progress')}
              className={`text-xs font-bold transition-all flex flex-col items-center ${activeTab === 'progress' ? 'text-rose-500' : 'text-slate-400'}`}
            >
              📊 Grid
            </button>
          </nav>

          {/* Exercise Form Modal */}
          {selectedExercise && (
            <div className="fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 z-50">
              <div className="bg-slate-900 border border-slate-800 rounded-2xl max-w-xs w-full p-4 space-y-3">
                <div className="flex justify-between items-center">
                  <h3 className="text-sm font-bold text-white">{selectedExercise.name}</h3>
                  <button onClick={() => setSelectedExercise(null)} className="text-slate-400 hover:text-white text-sm font-bold">✕</button>
                </div>
                <div className="h-24 bg-slate-950 rounded-xl border border-slate-800 flex flex-col items-center justify-center text-3xl">
                  {selectedExercise.icon}
                  <span className="text-[10px] text-rose-400 font-mono mt-1">Tempo: {selectedExercise.tempo}</span>
                </div>
                <div className="space-y-1 text-xs text-slate-300">
                  <p>• <strong>Primary Target:</strong> <span className="text-rose-400">{selectedExercise.target}</span></p>
                  <p>• <strong>Form Cue:</strong> Control the 3-second descent. Keep your core braced and exhale on the lift.</p>
                </div>
                <button
                  onClick={() => setSelectedExercise(null)}
                  className="w-full bg-slate-800 text-slate-200 py-2 rounded-xl font-bold text-xs hover:bg-slate-700"
                >
                  Got It
                </button>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
