      try {
        const item = localStorage.getItem(key);
        return (item && item !== "undefined") ? JSON.parse(item) : fallback;
      } catch {
        return fallback;
      }
    };

      try { localStorage.setItem(key, JSON.stringify(val)); } catch {}

      return `${year}-${month}-${day}`;

    // --- Global Audio & Speech Engine ---
    let sharedAudioCtx = null;
    let activeUtterance = null;

    const getAudioContext = () => {
      if (!sharedAudioCtx && typeof window !== 'undefined') {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (AudioCtx) sharedAudioCtx = new AudioCtx();
      }
      if (sharedAudioCtx && sharedAudioCtx.state === 'suspended') {
        sharedAudioCtx.resume();
      }
      return sharedAudioCtx;
    };

    const unlockAudioAndSpeech = () => {
      try {
        const ctx = getAudioContext();
        if (ctx) {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          gain.gain.value = 0.001;
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start();
          osc.stop(ctx.currentTime + 0.01);
        }
        if ('speechSynthesis' in window && window.speechSynthesis.paused) {
          window.speechSynthesis.resume();
        }
      } catch (e) {}
    };

    if (typeof window !== 'undefined') {
      ['touchstart', 'click'].forEach(evt => {
        window.addEventListener(evt, unlockAudioAndSpeech, { once: true, passive: true });
      });
    }

    const playChime = (notes = [523.25, 659.25, 783.99], dur = 0.1, vol = 1.0) => {
      try {
        const ctx = getAudioContext();
        if (!ctx) return;
        notes.forEach((freq, idx) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.value = freq;
          const startTime = ctx.currentTime + (idx * 0.07);
          gain.gain.setValueAtTime(0.04 * vol, startTime);
          gain.gain.exponentialRampToValueAtTime(0.0001, startTime + dur);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(startTime);
          osc.stop(startTime + dur);
        });
      } catch (e) {}
    };

        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.frequency.value = freq;

        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + dur);
      } catch (e) {}
    };

            const chosen = voices.find(v => v.voiceURI === settings.voiceURI);

          utterance.onerror = () => { activeUtterance = null; };

          { id: "a_b2", name: "DB Renegade Row to Push-Up", target: "Core & Upper Body", primary: "core", sets: 4, reps: 8, rest: 45, tempo: "2-1-1", ecc: 2, pause: 1, conc: 1, defaultKg: 6.0, img: "https://images.unsplash.com/photo-1605296867304-46d5465a13f1?auto=format&fit=crop&w=600&q=80", cues: "Feet wide for plank stability. Row right, row left, push-up.", execution: ["High plank on dumbbells.", "Row right dumbbell, row left, lower into strict push-up."] }
        ],
        C: [
          { id: "a_c1", name: "Clean to Squat to Press", target: "Metabolic Complex", primary: "quads", sets: 4, reps: 10, rest: 45, tempo: "1-0-1", ecc: 1, pause: 0, conc: 1, defaultKg: 6.0, img: "https://images.unsplash.com/photo-1517838277536-f5f99be501cd?auto=format&fit=crop&w=600&q=80", cues: "Hinge, clean to shoulders, deep squat, press overhead.", execution: ["Clean dumbbells to shoulders, sink into deep squat, press overhead."] }
        ]
      }
    };

    const getInitialTab = () => {
      try {
        const params = new URLSearchParams(window.location.search);
        const tabParam = params.get('tab');
        if (['train', 'fuel', 'progress', 'profile', 'settings', 'about'].includes(tabParam)) {
          return tabParam;
        }
      } catch (e) {}
      return "train";
    };

    function App() {
      const [tab, setTab] = useState(getInitialTab);
      const [difficulty, setDifficulty] = useState(() => getStored("m60_diff", "intermediate"));
      const [workoutDay, setWorkoutDay] = useState(() => getStored("m60_day", "A"));
      const [focusedId, setFocusedId] = useState("i_a1");
      
      const [audioMode, setAudioMode] = useState(() => getStored("m60_audio_mode", "voice"));
      const [speechRate, setSpeechRate] = useState(() => getStored("m60_speech_rate", 1.05));
      const [speechPitch, setSpeechPitch] = useState(() => getStored("m60_speech_pitch", 1.15));
      const [audioVolume, setAudioVolume] = useState(() => getStored("m60_audio_vol", 1.0));
      const [selectedVoiceURI, setSelectedVoiceURI] = useState(() => getStored("m60_voice_uri", ""));
      const [availableVoices, setAvailableVoices] = useState([]);
      const [wakeLockActive, setWakeLockActive] = useState(false);
      const [hapticsEnabled, setHapticsEnabled] = useState(() => getStored("m60_haptics", true));

      const [activeModalExercise, setActiveModalExercise] = useState(null);
      const [activeModalPacing, setActiveModalPacing] = useState(false);
      const [modalPacePhase, setModalPacePhase] = useState("Ready");
      const [modalPaceCount, setModalPaceCount] = useState(3);

      const [weights, setWeights] = useState(() => getStored("m60_weights", {}));
      const [completedSets, setCompletedSets] = useState(() => getStored("m60_sets", {}));
      const [history, setHistory] = useState(() => getStored("m60_history", []));
      const [selectedCalendarDate, setSelectedCalendarDate] = useState(null);

      const defaultProfile = {
        onboardingCompleted: false,
        name: "Lindiwe",
        age: 29,
        somatotype: "Endomorph",
        height: 166,
        currentWeight: 76.5,
        targetWeight: 68.0,
        waist: 79,
        hips: 104,
        experience: "Intermediate",
        goal: "Fat Loss & Metabolic Reset"
      };

      const [userProfile, setUserProfile] = useState(() => {
        const stored = getStored("m60_user_profile", null);
        return stored ? { ...defaultProfile, ...stored } : defaultProfile;
      });

      const [showWelcomeScreen, setShowWelcomeScreen] = useState(!userProfile.onboardingCompleted);
      const [tourSlide, setTourSlide] = useState(0);

      const [showOnboardingModal, setShowOnboardingModal] = useState(false);
      const [showResetConfirmModal, setShowResetConfirmModal] = useState(false);
      const [onboardingStep, setOnboardingStep] = useState(1);
      const [tempProfile, setTempProfile] = useState({ ...userProfile });

      const [fuelSubTab, setFuelSubTab] = useState("meals");
      const [mealDayIdx, setMealDayIdx] = useState(0);
      const [expandedMealIdx, setExpandedMealIdx] = useState(null);
      const [checkedGroceries, setCheckedGroceries] = useState(() => getStored("m60_grocery", {}));

      const todayDateStr = getLocalDateStr();
      const [waterGlasses, setWaterGlasses] = useState(() => getStored(`m60_water_${todayDateStr}`, 0));

      const [restSec, setRestSec] = useState(0);
      const [targetRestSec, setTargetRestSec] = useState(60);
      const [isResting, setIsResting] = useState(false);

      const [showTempo, setShowTempo] = useState(false);
      const [tempoRunning, setTempoRunning] = useState(false);
      const [tempoCount, setTempoCount] = useState(3);
      const [tempoPhase, setTempoPhase] = useState("Lower (3s)");

      const [periodStart, setPeriodStart] = useState(() => getStored("m60_pstart", "2026-08-01"));
      const [cycleLen, setCycleLen] = useState(() => getStored("m60_clen", 28));

      useEffect(() => {
        const loadVoices = () => {
          if (typeof window !== 'undefined' && 'speechSynthesis' in window) {
            const vList = window.speechSynthesis.getVoices();
            setAvailableVoices(vList);
            if (!selectedVoiceURI && vList.length > 0) {
              const preferred = vList.find(v => (v.lang.startsWith('en') && (v.name.includes('Female') || v.name.includes('Samantha') || v.name.includes('Victoria')))) || vList[0];
              setSelectedVoiceURI(preferred.voiceURI);
            }
          }
        };
        loadVoices();
        if (typeof window !== 'undefined' && 'speechSynthesis' in window) {
          window.speechSynthesis.onvoiceschanged = loadVoices;
        }
      }, []);

      useEffect(() => {
        let wakeLockObj = null;
        const requestWakeLock = async () => {
          if (wakeLockActive && 'wakeLock' in navigator) {
            try {
              wakeLockObj = await navigator.wakeLock.request('screen');
            } catch (err) {}
          }
        };
        requestWakeLock();
        return () => {
          if (wakeLockObj) wakeLockObj.release().catch(() => {});
        };
      }, [wakeLockActive]);

      const calcMetabolicTargets = (p) => {
        const w = Number(p.currentWeight) || 75;
        const h = Number(p.height) || 165;
        const a = Number(p.age) || 30;
        const bmr = Math.round(10 * w + 6.25 * h - 5 * a - 161);
        const tdee = Math.round(bmr * 1.375);
        const deficitCals = Math.max(1450, tdee - 350);
        
        let pRatio = 0.40, cRatio = 0.30, fRatio = 0.30;
        if (p.somatotype === "Ectomorph") { pRatio = 0.30; cRatio = 0.50; fRatio = 0.20; }
        else if (p.somatotype === "Mesomorph") { pRatio = 0.35; cRatio = 0.40; fRatio = 0.25; }

        const pGrams = Math.round((deficitCals * pRatio) / 4);
        const cGrams = Math.round((deficitCals * cRatio) / 4);
        const fGrams = Math.round((deficitCals * fRatio) / 9);

        return { calories: deficitCals, pGrams, cGrams, fGrams, pRatio: Math.round(pRatio * 100), cRatio: Math.round(cRatio * 100), fRatio: Math.round(fRatio * 100) };
      };

      const metabolicTargets = calcMetabolicTargets(userProfile);

      useEffect(() => { setStored("m60_diff", difficulty); }, [difficulty]);
      useEffect(() => { setStored("m60_day", workoutDay); }, [workoutDay]);
      useEffect(() => { setStored("m60_weights", weights); }, [weights]);
      useEffect(() => { setStored("m60_sets", completedSets); }, [completedSets]);
      useEffect(() => { setStored("m60_history", history); }, [history]);
      useEffect(() => { setStored("m60_grocery", checkedGroceries); }, [checkedGroceries]);
      useEffect(() => { setStored(`m60_water_${todayDateStr}`, waterGlasses); }, [waterGlasses, todayDateStr]);
      useEffect(() => { setStored("m60_pstart", periodStart); }, [periodStart]);
      useEffect(() => { setStored("m60_clen", cycleLen); }, [cycleLen]);
      useEffect(() => { setStored("m60_user_profile", userProfile); }, [userProfile]);
      useEffect(() => { setStored("m60_audio_mode", audioMode); }, [audioMode]);
      useEffect(() => { setStored("m60_speech_rate", speechRate); }, [speechRate]);
      useEffect(() => { setStored("m60_speech_pitch", speechPitch); }, [speechPitch]);
      useEffect(() => { setStored("m60_audio_vol", audioVolume); }, [audioVolume]);
      useEffect(() => { setStored("m60_voice_uri", selectedVoiceURI); }, [selectedVoiceURI]);
      useEffect(() => { setStored("m60_haptics", hapticsEnabled); }, [hapticsEnabled]);

      const speechSettings = { rate: speechRate, pitch: speechPitch, volume: audioVolume, voiceURI: selectedVoiceURI };

      useEffect(() => {
        let timer = null;
        if (isResting && restSec > 0) {
          timer = setInterval(() => {
            setRestSec(prev => {
              if (prev === 10) {
                speakPrompt("10 seconds remaining", audioMode, speechSettings);
                playBeepTone(440, 0.08, audioVolume);
              }
              if (prev <= 3 && prev > 1) {
                playBeepTone(587.33, 0.08, audioVolume);
                if (hapticsEnabled) triggerHaptic(10);
              }
              if (prev === 1) {
                playChime([523.25, 659.25, 783.99, 1046.50], 0.3, audioVolume);
                speakPrompt("Rest complete. Start next set", audioMode, speechSettings);
                if (hapticsEnabled) triggerHaptic([40, 60, 40]);
                setIsResting(false);
              }
              return prev - 1;
            });
          }, 1000);
        }
        return () => clearInterval(timer);
      }, [isResting, restSec, audioMode, speechSettings, audioVolume, hapticsEnabled]);

      useEffect(() => {
        let timer = null;
        if (tempoRunning) {
          let step = 0;
          timer = setInterval(() => {
            if (step === 0) { setTempoPhase("Lower (3s)"); setTempoCount(3); playBeepTone(440, 0.05, audioVolume); if (hapticsEnabled) triggerHaptic(8); }
            else if (step === 1) { setTempoCount(2); playBeepTone(440, 0.05, audioVolume); }
            else if (step === 2) { setTempoCount(1); playBeepTone(440, 0.05, audioVolume); }
            else if (step === 3) { setTempoPhase("Drive Up (1s)"); setTempoCount(1); playBeepTone(880, 0.1, audioVolume); if (hapticsEnabled) triggerHaptic(20); }
            step = (step + 1) % 4;
          }, 1000);
        }
        return () => clearInterval(timer);
      }, [tempoRunning, audioVolume, hapticsEnabled]);

      useEffect(() => {
        let timer = null;
        if (activeModalExercise && activeModalPacing) {
          const ecc = activeModalExercise.ecc || 3;
          const pause = activeModalExercise.pause || 0;
          const conc = activeModalExercise.conc || 1;
          const totalCycle = ecc + pause + conc;

          let tick = 0;
          timer = setInterval(() => {
            const pos = tick % totalCycle;
            if (pos === 0) {
              speakPrompt("Lower", audioMode, speechSettings);
            }
            if (pos < ecc) {
              const remainingEcc = ecc - pos;
              setModalPacePhase(`Lowering (Down)`);
              setModalPaceCount(remainingEcc);
              playBeepTone(440, 0.05, audioVolume);
              if (hapticsEnabled) triggerHaptic(8);
            } else if (pos < ecc + pause) {
              if (pos === ecc) speakPrompt("Hold", audioMode, speechSettings);
              setModalPacePhase(`Pause & Hold`);
              setModalPaceCount(ecc + pause - pos);
              playBeepTone(520, 0.08, audioVolume);
              if (hapticsEnabled) triggerHaptic(12);
            } else {
              speakPrompt("Drive up", audioMode, speechSettings);
              setModalPacePhase(`Drive Up (Lift)`);
              setModalPaceCount(1);
              playChime([659.25, 880.00], 0.15, audioVolume);
              if (hapticsEnabled) triggerHaptic(25);
            }
            tick++;
          }, 1000);
        } else {
          setModalPacePhase("Ready");
          setModalPaceCount(activeModalExercise ? (activeModalExercise.ecc || 3) : 3);
        }
        return () => clearInterval(timer);
      }, [activeModalExercise, activeModalPacing, audioMode, speechSettings, audioVolume, hapticsEnabled]);

      const calcCycle = () => {
        const start = new Date(periodStart);
        start.setHours(0, 0, 0, 0);
        const now = new Date();
        now.setHours(0, 0, 0, 0);
        const diff = Math.floor((now - start) / (1000 * 60 * 60 * 24));
        const day = ((diff % cycleLen) + cycleLen) % cycleLen + 1;
        let phase = "follicular";
        if (day <= 5) phase = "menstrual";
        else if (day <= 13) phase = "follicular";
        else if (day <= 16) phase = "ovulatory";
        else phase = "luteal";
        return { day, phase, info: CYCLE_MODES[phase] };
      };

      const cycle = calcCycle();
      const currentList = EXERCISE_DATA[difficulty][workoutDay] || EXERCISE_DATA.intermediate.A;
      const activeEx = currentList.find(e => e.id === focusedId) || currentList[0];

      const currentLoadMod = cycle.info.mod;
      const liveSessionVolume = currentList.reduce((sum, ex) => {
        const loggedKg = (Number(weights[ex.id]) || ex.defaultKg) * currentLoadMod;
        let done = 0;
        for (let s = 0; s < ex.sets; s++) {
          if (completedSets[`${ex.id}_s_${s}`]) done++;
        }
        return sum + Math.round(done * ex.reps * loggedKg);
      }, 0);

      const totalSetsCount = currentList.reduce((sum, ex) => sum + ex.sets, 0);
      const completedSetsCount = currentList.reduce((sum, ex) => {
        let done = 0;
        for (let s = 0; s < ex.sets; s++) {
          if (completedSets[`${ex.id}_s_${s}`]) done++;
        }
        return sum + done;
      }, 0);

      const toggleSet = (key, restDuration, exId, ex) => {
        unlockAudioAndSpeech();
        const next = !completedSets[key];
        const updated = { ...completedSets, [key]: next };
        setCompletedSets(updated);
        setFocusedId(exId);

        if (next) {
          if (hapticsEnabled) triggerHaptic(15);
          playChime([523.25, 659.25, 783.99], 0.15, audioVolume);
          speakPrompt(`Set completed. Rest for ${restDuration} seconds`, audioMode, speechSettings);
          setTargetRestSec(restDuration);
          setRestSec(restDuration);
          setIsResting(true);

          let allSetsDone = true;
          for (let s = 0; s < ex.sets; s++) {
            if (!updated[`${ex.id}_s_${s}`]) { allSetsDone = false; break; }
          }

          if (allSetsDone) {
            const nextIncompleteEx = currentList.find(otherEx => {
              for (let s = 0; s < otherEx.sets; s++) {
                if (!updated[`${otherEx.id}_s_${s}`]) return true;
              }
              return false;
            });
            if (nextIncompleteEx) {
              setFocusedId(nextIncompleteEx.id);
            }
          }
        }
      };

      const startManualTimer = (seconds) => {
        unlockAudioAndSpeech();
        setTargetRestSec(seconds);
        setRestSec(seconds);
        setIsResting(true);
        if (hapticsEnabled) triggerHaptic(15);
        playBeepTone(587.33, 0.08, audioVolume);
      };

      const toggleGroceryItem = (item) => {
        setCheckedGroceries(prev => ({ ...prev, [item]: !prev[item] }));
        if (hapticsEnabled) triggerHaptic(12);
        playBeepTone(659.25, 0.05, audioVolume);
      };

      const setWater = (idx) => {
        const nextVal = (idx + 1 === waterGlasses) ? idx : idx + 1;
        setWaterGlasses(nextVal);

      const finishWorkout = () => {

          timestamp: Date.now()

        setWorkoutDay(nextDay);
        setFocusedId(EXERCISE_DATA[difficulty][nextDay][0].id);

      const completeOnboarding = () => {

      const executeFullReset = () => {
        try { localStorage.clear(); } catch (e) {}
        setUserProfile(defaultProfile);
        setWeights({});
        setCompletedSets({});
        setHistory([]);
        setCheckedGroceries({});

        setDifficulty("intermediate");
        setWorkoutDay("A");
        setShowResetConfirmModal(false);
        setTourSlide(0);
        setShowWelcomeScreen(true);
        if (hapticsEnabled) triggerHaptic([100, 50, 100]);
      };

      const handleExportData = () => {
        const backupObj = {
          userProfile,
          weights,
          completedSets,
          history,
          periodStart,
          cycleLen,
          waterGlasses,
          exportDate: new Date().toISOString()
        };
        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(backupObj, null, 2));
        const dlAnchor = document.createElement('a');
        dlAnchor.setAttribute("href", dataStr);
        dlAnchor.setAttribute("download", `m60_backup_${getLocalDateStr()}.json`);
        document.body.appendChild(dlAnchor);
        dlAnchor.click();
        dlAnchor.remove();
      };

      const handleImportData = (e) => {
        const fileReader = new FileReader();
        if (e.target.files && e.target.files[0]) {
          fileReader.readAsText(e.target.files[0], "UTF-8");
          fileReader.onload = (event) => {
            try {
              const parsed = JSON.parse(event.target.result);
              if (parsed.userProfile) setUserProfile(parsed.userProfile);
              if (parsed.weights) setWeights(parsed.weights);
              if (parsed.completedSets) setCompletedSets(parsed.completedSets);
              if (parsed.history) setHistory(parsed.history);
              if (parsed.periodStart) setPeriodStart(parsed.periodStart);
              if (parsed.cycleLen) setCycleLen(parsed.cycleLen);
              alert("✨ M60 backup successfully restored!");
            } catch (err) {
              alert("⚠️ Invalid backup file format.");
            }
          };
        }
      };

      const totalHistoricalTonnage = history.reduce((sum, h) => sum + (h.tonnage || 0), 0) + liveSessionVolume;
      const badges = [
        { id: "b1", name: "Radiant Starter", desc: "Finished 1+ workout session", icon: "✨", unlocked: history.length >= 1 },
        { id: "b2", name: "Grace in Momentum", desc: "Completed 3+ workouts", icon: "🌸", unlocked: history.length >= 3 },
        { id: "b3", name: "10k kg Sculpt Club", desc: "Moved 10,000+ kg sculpted load", icon: "👑", unlocked: totalHistoricalTonnage >= 10000 },
        { id: "b4", name: "Hydration Radiance", desc: "Drank 3L water today (8/8 glasses)", icon: "💧", unlocked: waterGlasses >= 8 },
        { id: "b5", name: "Hormonal Symphony", desc: "Menstrual cycle engine synchronized", icon: "🌙", unlocked: !!periodStart }
      ];

      const safeTargetSec = Math.max(1, targetRestSec || 60);
      const arcRadius = 18;
      const arcCircumference = 2 * Math.PI * arcRadius;
      const arcOffset = arcCircumference - (restSec / safeTargetSec) * arcCircumference;

      const now = new Date();
      const currentYear = now.getFullYear();
      const currentMonth = now.getMonth();
      const firstDayIndex = new Date(currentYear, currentMonth, 1).getDay();
      const daysInMonth = new Date(currentYear, currentMonth + 1, 0).getDate();
      const monthName = now.toLocaleString("default", { month: "long" });

      return (
        <div className="min-h-screen max-w-md mx-auto pb-24 flex flex-col justify-between" onClick={unlockAudioAndSpeech}>
          
          {/* TOP APP BAR */}
          <header className="sticky top-0 z-30 bg-[#FAF6F4]/90 backdrop-blur border-b border-blush-200 px-4 py-3 flex items-center justify-between shadow-sm">
            <div className="flex items-center gap-2">
              <div className="w-8 h-8 rounded-full bg-gradient-to-tr from-blush-400 to-roseGold flex items-center justify-center text-white text-xs font-serif font-black shadow-sm">
                M60
              </div>
              <h1 className="text-base font-serif font-bold text-charcoal tracking-tight">M60 ✨</h1>
            </div>
            
            <div className="flex items-center gap-2">
              <button
                onClick={() => {
                  unlockAudioAndSpeech();
                  const modes = ["voice", "chimes", "mute"];
                  const nextIdx = (modes.indexOf(audioMode) + 1) % modes.length;
                  const nextMode = modes[nextIdx];
                  setAudioMode(nextMode);
                  if (hapticsEnabled) triggerHaptic(10);
                  if (nextMode === "voice") speakPrompt("Voice coaching active", "voice", speechSettings);
                  else if (nextMode === "chimes") playChime([659.25, 783.99], 0.1, audioVolume);
                }}
                className="text-[10px] font-bold text-blush-600 bg-blush-100/90 px-2.5 py-1 rounded-full border border-blush-200 flex items-center gap-1 hover:bg-blush-200"
              >
                <span>{audioMode === "voice" ? "🗣️ Voice" : audioMode === "chimes" ? "🔔 Chimes" : "🔇 Mute"}</span>
              </button>

              <span className="text-[11px] font-medium text-blush-600 bg-blush-100/80 px-2.5 py-0.5 rounded-full border border-blush-200">
                Day {cycle.day}
              </span>
            </div>
          </header>

          <main className="p-4 space-y-4 flex-1">

            {/* TAB 1: TRAIN */}
            {tab === "train" && (
              <div className="space-y-3.5">
                <div className="card-light rounded-3xl p-4 space-y-3 border-blush-300">
                  <div className="flex justify-between items-center">
                    <span className="text-[10px] font-bold text-roseGold uppercase tracking-widest">Hormonal Rhythm</span>
                    <span className={`text-[10px] font-bold px-2.5 py-0.5 rounded-full border ${cycle.info.color}`}>
                      Day {cycle.day} • {cycle.info.short} ({Math.round(cycle.info.mod * 100)}% Load)
                    </span>
                  </div>

                  <div className="grid grid-cols-2 gap-2.5 bg-blush-50/70 p-3 rounded-2xl border border-blush-200">
                    <div>
                      <label className="block text-[9px] font-semibold text-mutedMauve uppercase mb-1">Period Start</label>
                      <input
                        type="date"
                        value={periodStart}
                        onChange={e => setPeriodStart(e.target.value)}
                        className="w-full bg-white border border-blush-200 text-charcoal text-[11px] font-medium p-1.5 rounded-xl focus:outline-none"
                      />
                    </div>
                    <div>
                      <div className="flex justify-between text-[9px] font-semibold text-mutedMauve uppercase mb-1">
                        <span>Cycle Length</span>
                        <span className="text-blush-600 font-bold">{cycleLen}d</span>
                      </div>
                      <input
                        type="range"
                        min="21"
                        max="35"
                        value={cycleLen}
                        onChange={e => setCycleLen(Number(e.target.value))}
                        className="w-full h-1 bg-blush-200 rounded accent-blush-500 mt-2.5"
                      />
                    </div>

                    </div>
                    <div className="space-y-1.5 text-[11px]">
                      <div className="p-2 rounded-xl bg-blush-50/70 border border-blush-100 flex items-center justify-between">
                        <span className="text-charcoal font-medium">✨ 7-Day South African Meal Plans</span>
                        <span className="text-[10px] text-blush-600 font-bold">1,720 kcal</span>
                      </div>
                      <div className="p-2 rounded-xl bg-blush-50/70 border border-blush-100 flex items-center justify-between">
                        <span className="text-charcoal font-medium">💧 3.0 Liters Daily Water Tracker</span>
                        <span className="text-[10px] text-blush-600 font-bold">8 Glasses</span>
                      </div>
                      <div className="p-2 rounded-xl bg-blush-50/70 border border-blush-100 flex items-center justify-between">
                        <span className="text-charcoal font-medium">🛒 Interactive Grocery Checklist</span>
                        <span className="text-[10px] text-blush-600 font-bold">Smart Swaps</span>
                      </div>
                    </div>
                  </div>
                )}

                {tourSlide === 4 && (
                  <div className="space-y-3 text-center">
                    <div>
                      <span className="text-2xl">👑</span>
                      <h3 className="text-sm font-serif font-bold text-charcoal mt-1">60-Day Consistency Timeline</h3>
                      <p className="text-[10px] text-mutedMauve">Unlock achievement trophies as you transform.</p>
                    </div>
                    <div className="p-3 bg-blush-50/70 rounded-2xl border border-blush-200 flex justify-around items-center text-xl">
                      <span>✨</span>
                      <span>🌸</span>
                      <span>👑</span>
                      <span>💧</span>
                      <span>🌙</span>
                    </div>
                    <p className="text-[10px] text-mutedMauve leading-relaxed">
                      Every workout logs total weight volume, updates your consistency map, and advances your 60-day challenge journey.
                    </p>
                  </div>
                )}

                <div className="flex justify-center items-center gap-1.5 pt-1">
                  {[0, 1, 2, 3, 4].map(idx => (
                    <button
                      key={idx}
                      onClick={() => { setTourSlide(idx); if (hapticsEnabled) triggerHaptic(8); }}
                      className={`h-1.5 rounded-full transition-all ${
                        tourSlide === idx ? "w-6 bg-blush-500" : "w-1.5 bg-blush-200"
                      }`}
                    />
                  ))}
                </div>

                <div className="flex gap-2 pt-1 border-t border-blush-100">
                  {tourSlide > 0 && (
                    <button
                      onClick={() => { setTourSlide(prev => prev - 1); if (hapticsEnabled) triggerHaptic(8); }}
                      className="px-3.5 py-2.5 rounded-xl bg-blush-50 text-xs font-bold text-mutedMauve hover:text-charcoal"
                    >
                      ← Back
                    </button>
                  )}
                  {tourSlide < 4 ? (
                    <button
                      onClick={() => { setTourSlide(prev => prev + 1); if (hapticsEnabled) triggerHaptic(12); }}
                      className="flex-1 py-2.5 rounded-xl bg-blush-500 text-white text-xs font-bold shadow-sm hover:bg-blush-600"
                    >
                      Next Feature →
                    </button>
                  ) : (
                    <button
                      onClick={() => {
                        setShowWelcomeScreen(false);
                        if (!userProfile.onboardingCompleted) startOnboardingWizard();
                        else {
                          playChime([523.25, 659.25, 783.99], 0.2, audioVolume);
                          if (hapticsEnabled) triggerHaptic([40, 60, 40]);
                        }
                      }}
                      className="flex-1 py-3 rounded-xl bg-gradient-to-r from-blush-400 via-blush-500 to-roseGold text-white text-xs font-bold shadow-md"
                    >
                      {userProfile.onboardingCompleted ? "Close & Start Training ✨" : "Begin Personalization Setup →"}
                    </button>
                  )}
                </div>

              </div>
            </div>
          )}

          {/* LIVE CADENCE METRONOME & CUES MODAL */}
          {activeModalExercise && (
            <div className="fixed inset-0 bg-charcoal/40 backdrop-blur-sm flex items-center justify-center p-4 z-50 overflow-y-auto">
              <div className="card-light rounded-3xl p-5 max-w-sm w-full space-y-4 my-auto border-blush-300 shadow-2xl">
                
                <div className="flex items-center justify-between border-b border-blush-100 pb-3">
                  <div className="flex items-center gap-3">
                    <img src={activeModalExercise.img} alt={activeModalExercise.name} className="w-10 h-10 rounded-xl object-cover border border-blush-200" />
                    <div>
                      <h3 className="text-xs font-serif font-bold text-charcoal">{activeModalExercise.name}</h3>
                      <p className="text-[10px] text-blush-600 font-semibold">{activeModalExercise.target}</p>
                    </div>
                  </div>
                  <button
                    onClick={() => {
                      setActiveModalExercise(null);
                      setActiveModalPacing(false);
                    }}
                    className="w-7 h-7 rounded-full bg-blush-50 border border-blush-200 flex items-center justify-center text-xs text-mutedMauve hover:text-charcoal"
                  >
                    ✕
                  </button>
                </div>

                <div className="bg-blush-50/70 p-4 rounded-2xl border border-blush-200 text-center space-y-2">
                  <div className="flex justify-between items-center text-[10px] font-bold text-mutedMauve uppercase">
                    <span>Sculpt Tempo</span>
                    <span className="text-blush-600 font-mono">{activeModalExercise.tempo}</span>
                  </div>

                  <div className="py-4">
                    <div className="text-4xl font-black font-mono text-charcoal tempo-pulse">
                      {activeModalPacing ? modalPaceCount : activeModalExercise.tempo}
                    </div>
                    <p className="text-xs font-bold uppercase tracking-wider text-blush-600 mt-1.5">{modalPacePhase}</p>
                  </div>

                  <button
                    onClick={() => {
                      unlockAudioAndSpeech();
                      setActiveModalPacing(!activeModalPacing);
                      if (hapticsEnabled) triggerHaptic(15);
                    }}
                    className={`w-full py-2.5 rounded-xl font-bold text-xs transition-all shadow-sm ${
                      activeModalPacing ? "bg-blush-600 text-white" : "bg-white text-blush-600 border border-blush-200 hover:bg-blush-50"
                    }`}
                  >
                    {activeModalPacing ? "Pause Cadence Guide" : "Start Live Tempo Guide"}
                  </button>
                </div>

                <div className="space-y-2 bg-white p-3.5 rounded-2xl border border-blush-100 text-xs">
                  <p className="leading-relaxed"><strong className="text-blush-600 font-semibold">Mind-Muscle Cue:</strong> {activeModalExercise.cues}</p>
                  <div className="space-y-1 pt-1.5 border-t border-blush-50">
                    <span className="text-[9px] font-bold uppercase text-mutedMauve">Execution Breakdown:</span>
                    <ol className="list-decimal list-inside space-y-1 text-charcoal/80 text-[11px] leading-relaxed">
                      {activeModalExercise.execution ? activeModalExercise.execution.map((st, i) => (
                        <li key={i}>{st}</li>
                      )) : <li>Maintain core stability and strict cadence through the full range of motion.</li>}
                    </ol>
                  </div>
                </div>

                <button
                  onClick={() => {
                    startManualTimer(activeModalExercise.rest || 60);
                    setActiveModalExercise(null);
                    setActiveModalPacing(false);
                  }}
                  className="w-full py-2.5 rounded-xl bg-blush-500 text-white text-xs font-bold shadow-sm hover:bg-blush-600 transition-all"
                >
                  Start Rest Interval ({activeModalExercise.rest}s)
                </button>
              </div>
            </div>
          )}

          {/* 5-STEP GUIDED ONBOARDING WIZARD */}
          {showOnboardingModal && (
            <div className="fixed inset-0 bg-charcoal/40 backdrop-blur-sm flex items-center justify-center p-4 z-50 overflow-y-auto">
              <div className="card-light rounded-3xl p-5 max-w-sm w-full space-y-4 my-auto border-blush-300 shadow-2xl">
                
                <div className="flex justify-between items-center border-b border-blush-100 pb-3">
                  <div>
                    <span className="text-[9px] font-bold text-roseGold uppercase tracking-widest">Personalization</span>
                    <h3 className="text-sm font-serif font-bold text-charcoal">Step {onboardingStep} of 5</h3>
                  </div>
                  <span className="text-xs font-mono font-bold text-mutedMauve">{Math.round((onboardingStep / 5) * 100)}%</span>
                </div>

                {onboardingStep === 1 && (
                  <div className="space-y-3.5">
                    <div>
                      <h4 className="text-base font-serif font-bold text-charcoal">Welcome, Beautiful</h4>
                      <p className="text-xs text-mutedMauve mt-0.5">Let's tailor your metabolic calibration.</p>
                    </div>
                    <div className="space-y-3">
                      <div>
                        <label className="block text-[10px] font-bold text-mutedMauve uppercase mb-1">Your First Name</label>
                        <input
                          type="text"
                          value={tempProfile.name}
                          onChange={e => setTempProfile({ ...tempProfile, name: e.target.value })}
                          placeholder="e.g. Lindiwe"
                          className="w-full bg-blush-50 border border-blush-200 text-charcoal rounded-xl p-3 text-xs font-bold focus:outline-none"
                        />
                      </div>
                      <div>
                        <label className="block text-[10px] font-bold text-mutedMauve uppercase mb-1">Your Age</label>
                        <input
                          type="number"
                          value={tempProfile.age === '' ? '' : tempProfile.age}
                          onChange={e => {
                            const v = e.target.value;
                            setTempProfile({ ...tempProfile, age: v === '' ? '' : parseInt(v, 10) });
                          }}
                          className="w-full bg-blush-50 border border-blush-200 text-charcoal rounded-xl p-3 text-xs font-bold focus:outline-none"
                        />
                      </div>
                    </div>
                  </div>
                )}

                {onboardingStep === 2 && (
                  <div className="space-y-3">
                    <div>
                      <h4 className="text-sm font-serif font-bold text-charcoal">Select Your Somatotype</h4>
                      <p className="text-[11px] text-mutedMauve">Customizes your insulin sensitivity & carbohydrate split.</p>
                    </div>
                    <div className="space-y-2">
                      {[
                        { type: "Endomorph", desc: "Curves easily, higher carb sensitivity. Thrives on 40P/30C/30F.", img: "https://images.unsplash.com/photo-1518611012118-696072aa579a?auto=format&fit=crop&w=400&q=80" },
                        { type: "Mesomorph", desc: "Athletic structure, sculpts muscle rapidly, handles moderate carbs efficiently.", img: "https://images.unsplash.com/photo-1534438327276-14e5300c3a48?auto=format&fit=crop&w=400&q=80" },
                        { type: "Ectomorph", desc: "Naturally lean structure, fast metabolic burn, excels with higher carb allocation.", img: "https://images.unsplash.com/photo-1571019613454-1cb2f99b2d8b?auto=format&fit=crop&w=400&q=80" }
                      ].map(s => (
                        <div
                          key={s.type}
                          onClick={() => { setTempProfile({ ...tempProfile, somatotype: s.type }); if (hapticsEnabled) triggerHaptic(10); }}
                          className={`p-2.5 rounded-2xl border cursor-pointer flex items-center gap-3 transition-all ${
                            tempProfile.somatotype === s.type ? "bg-blush-50 border-blush-500 shadow-sm" : "bg-white border-blush-200"
                          }`}
                        >
                          <img src={s.img} alt={s.type} className="w-12 h-12 rounded-xl object-cover shrink-0 border border-blush-200" />
                          <div className="flex-1">
                            <span className="text-xs font-serif font-bold text-charcoal">{s.type}</span>
                            <p className="text-[10px] text-mutedMauve leading-tight mt-0.5">{s.desc}</p>
                          </div>
                        </div>
                      ))}
                    </div>
                  </div>
                )}

                {onboardingStep === 3 && (
                  <div className="space-y-3">
                    <div>
                      <h4 className="text-sm font-serif font-bold text-charcoal">Starting Measurements</h4>
                      <p className="text-[11px] text-mutedMauve">Calibrates your baseline energy output equation.</p>
                    </div>
                    <div className="grid grid-cols-2 gap-2.5">
                      <div>
                        <label className="block text-[9px] font-bold text-mutedMauve uppercase mb-1">Height (cm)</label>
                        <input
                          type="number"
                          value={tempProfile.height === '' ? '' : tempProfile.height}
                          onChange={e => {
                            const v = e.target.value;
                            setTempProfile({ ...tempProfile, height: v === '' ? '' : parseInt(v, 10) });
                          }}
                          className="w-full bg-blush-50 border border-blush-200 text-charcoal rounded-xl p-2.5 text-xs font-bold"
                        />
                      </div>
                      <div>
                        <label className="block text-[9px] font-bold text-mutedMauve uppercase mb-1">Current Weight (kg)</label>
                        <input
                          type="number"
                          step="0.1"
                          value={tempProfile.currentWeight === '' ? '' : tempProfile.currentWeight}
                          onChange={e => {
                            const v = e.target.value;
                            setTempProfile({ ...tempProfile, currentWeight: v === '' ? '' : parseFloat(v) });
                          }}
                          className="w-full bg-blush-50 border border-blush-200 text-charcoal rounded-xl p-2.5 text-xs font-bold"
                        />
                      </div>
                      <div>
                        <label className="block text-[9px] font-bold text-mutedMauve uppercase mb-1">Target Weight (kg)</label>
                        <input
                          type="number"
                          step="0.1"
                          value={tempProfile.targetWeight === '' ? '' : tempProfile.targetWeight}
                          onChange={e => {
                            const v = e.target.value;
                            setTempProfile({ ...tempProfile, targetWeight: v === '' ? '' : parseFloat(v) });
                          }}
                          className="w-full bg-blush-50 border border-blush-200 text-charcoal rounded-xl p-2.5 text-xs font-bold"
                        />
                      </div>
                      <div>
                        <label className="block text-[9px] font-bold text-mutedMauve uppercase mb-1">Waist (cm)</label>
                        <input
                          type="number"
                          value={tempProfile.waist === '' ? '' : tempProfile.waist}
                          onChange={e => {
                            const v = e.target.value;
                            setTempProfile({ ...tempProfile, waist: v === '' ? '' : parseInt(v, 10) });
                          }}
                          className="w-full bg-blush-50 border border-blush-200 text-charcoal rounded-xl p-2.5 text-xs font-bold"
                        />
                      </div>
                    </div>
                  </div>
                )}

                {onboardingStep === 4 && (
                  <div className="space-y-3">
                    <div>
                      <h4 className="text-sm font-serif font-bold text-charcoal">Your Focus Transformation Goal</h4>
                      <p className="text-[11px] text-mutedMauve">Customizes training volume and progressive overload.</p>
                    </div>
                    <div className="space-y-2">
                      {["Fat Loss & Metabolic Reset", "Glute Lift & Waist Taper", "Full Body Recomposition & Tone"].map(g => (
                        <div
                          key={g}
                          onClick={() => { setTempProfile({ ...tempProfile, goal: g }); if (hapticsEnabled) triggerHaptic(8); }}
                          className={`p-3 rounded-2xl border text-xs font-bold cursor-pointer transition-all ${
                            tempProfile.goal === g ? "bg-blush-50 border-blush-500 text-blush-600 font-serif" : "bg-white border-blush-200 text-charcoal"
                          }`}
                        >
                          {g}
                        </div>
                      ))}
                    </div>
                    <div className="pt-2">
                      <label className="block text-[9px] font-bold text-mutedMauve uppercase mb-1">Experience Level</label>
                      <div className="flex gap-2">
                        {["Beginner", "Intermediate", "Advanced"].map(exp => (
                          <button
                            key={exp}
                            onClick={() => {
                              setTempProfile({ ...tempProfile, experience: exp });
                              setDifficulty(exp.toLowerCase());
                              if (hapticsEnabled) triggerHaptic(8);
                            }}
                            className={`flex-1 py-2 rounded-xl text-[11px] font-bold capitalize border transition-all ${
                              tempProfile.experience.toLowerCase() === exp.toLowerCase() ? "bg-blush-500 text-white border-blush-500 shadow-sm" : "bg-white text-mutedMauve border-blush-200"
                            }`}
                          >
                            {exp}
                          </button>
                        ))}
                      </div>
                    </div>
                  </div>
                )}

                {onboardingStep === 5 && (
                  <div className="space-y-3.5 text-center">
                    <div className="w-12 h-12 rounded-full bg-gradient-to-tr from-blush-300 via-blush-400 to-roseGold text-white flex items-center justify-center mx-auto text-sm font-serif font-black shadow-sm">
                      M60
                    </div>
                    <div>
                      <h4 className="text-base font-serif font-bold text-charcoal">Ready to Bloom, {tempProfile.name}!</h4>
                      <p className="text-xs text-mutedMauve mt-1">Caloric targets & strength metrics calibrated for your {tempProfile.somatotype} structure.</p>
                    </div>
                  </div>
                )}

                <div className="flex gap-2 pt-2 border-t border-blush-100">
                  {onboardingStep > 1 && (
                    <button
                      onClick={() => { setOnboardingStep(prev => prev - 1); if (hapticsEnabled) triggerHaptic(8); }}
                      className="px-4 py-2.5 rounded-xl bg-blush-50 text-xs font-bold text-mutedMauve hover:text-charcoal"
                    >
                      Back
                    </button>
                  )}
                  {onboardingStep < 5 ? (
                    <button
                      onClick={() => { setOnboardingStep(prev => prev + 1); if (hapticsEnabled) triggerHaptic(12); }}
                      className="flex-1 py-2.5 rounded-xl bg-blush-500 text-white text-xs font-bold shadow-sm hover:bg-blush-600"
                    >
                      Continue →
                    </button>
                  ) : (
                    <button
                      onClick={completeOnboarding}
                      className="flex-1 py-3 rounded-xl bg-gradient-to-r from-blush-400 via-blush-500 to-roseGold text-white text-xs font-bold shadow-md"
                    >
                      Launch M60 ✨
                    </button>
                  )}
                </div>

              </div>
            </div>
          )}

          {/* RESET CONFIRMATION MODAL */}
          {showResetConfirmModal && (
            <div className="fixed inset-0 bg-charcoal/40 backdrop-blur-sm flex items-center justify-center p-4 z-50">
              <div className="card-light rounded-3xl p-5 max-w-sm w-full space-y-4 border-rose-300 shadow-2xl text-center">
                <h3 className="text-base font-serif font-bold text-charcoal">Reset All Lifestyle Data?</h3>
                <p className="text-xs text-mutedMauve">This will clear your local workout records and restart fresh.</p>
                <div className="flex gap-2 pt-2 border-t border-blush-100">
                  <button onClick={() => setShowResetConfirmModal(false)} className="flex-1 py-2 rounded-xl bg-blush-50 text-xs font-bold text-charcoal">
                    Cancel
                  </button>
                  <button onClick={executeFullReset} className="flex-1 py-2 rounded-xl bg-rose-500 text-white text-xs font-bold">
                    Reset
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* BOTTOM NAVIGATION DOCK (6 EQUAL TABS) */}
          <nav className="fixed bottom-0 left-0 right-0 bg-white/95 backdrop-blur border-t border-blush-200 px-2 py-2 flex justify-around items-center z-40 shadow-sm">
            <button onClick={() => { setTab("train"); if (hapticsEnabled) triggerHaptic(10); }} className={`flex flex-col items-center gap-0.5 text-xs ${tab === "train" ? "text-blush-600 font-bold" : "text-mutedMauve"}`}>
              <span className="text-base">🌸</span><span className="text-[9px]">Train</span>
            </button>
            <button onClick={() => { setTab("fuel"); if (hapticsEnabled) triggerHaptic(10); }} className={`flex flex-col items-center gap-0.5 text-xs ${tab === "fuel" ? "text-blush-600 font-bold" : "text-mutedMauve"}`}>
              <span className="text-base">🥗</span><span className="text-[9px]">Fuel</span>
            </button>
            <button onClick={() => { setTab("progress"); if (hapticsEnabled) triggerHaptic(10); }} className={`flex flex-col items-center gap-0.5 text-xs ${tab === "progress" ? "text-blush-600 font-bold" : "text-mutedMauve"}`}>
              <span className="text-base">🗓️</span><span className="text-[9px]">Calendar</span>
            </button>
            <button onClick={() => { setTab("profile"); if (hapticsEnabled) triggerHaptic(10); }} className={`flex flex-col items-center gap-0.5 text-xs ${tab === "profile" ? "text-blush-600 font-bold" : "text-mutedMauve"}`}>
              <span className="text-base">✨</span><span className="text-[9px]">Profile</span>
            </button>
            <button onClick={() => { setTab("settings"); if (hapticsEnabled) triggerHaptic(10); }} className={`flex flex-col items-center gap-0.5 text-xs ${tab === "settings" ? "text-blush-600 font-bold" : "text-mutedMauve"}`}>
              <span className="text-base">⚙️</span><span className="text-[9px]">Settings</span>
            </button>
            <button onClick={() => { setTab("about"); if (hapticsEnabled) triggerHaptic(10); }} className={`flex flex-col items-center gap-0.5 text-xs ${tab === "about" ? "text-blush-600 font-bold" : "text-mutedMauve"}`}>
              <span className="text-base">📜</span><span className="text-[9px]">About</span>
            </button>
          </nav>

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>

  <!-- PWA Service Worker Registration -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then((reg) => console.log('Service Worker registered:', reg.scope))
          .catch((err) => console.error('Service Worker registration failed:', err));
      });
    }
  </script>
</body>
</html>
