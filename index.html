    const playTone = (freq = 440, type = 'sine', duration = 0.15) => {
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        const ctx = new AudioCtx();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = type;
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0.08, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + duration);
      } catch (e) {}
    };

    function Dynamic3DDumbbell({ activeWeight = 7.5, exerciseName = "Goblet Squat" }) {
      const mountRef = useRef(null);
      const platesRef = useRef([]);
      const ringRef = useRef(null);
      const targetScaleRef = useRef({ r: 1.0, w: 1.0 });

      const safeWeight = Math.max(0.5, Math.min(30, activeWeight));
      const radiusScale = Math.max(0.45, Math.min(2.3, Math.sqrt(safeWeight / 5.0)));
      const widthScale = Math.max(0.5, Math.min(2.0, Math.pow(safeWeight / 5.0, 0.4)));
      targetScaleRef.current = { r: radiusScale, w: widthScale };

      useEffect(() => {
        const container = mountRef.current;
        if (!container) return;
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
        camera.position.set(0, 0, 8.5);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        container.innerHTML = '';
        container.appendChild(renderer.domElement);

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.85);
        scene.add(ambientLight);
        const pinkLight = new THREE.PointLight(0xf43f5e, 2.5, 30);
        pinkLight.position.set(4, 5, 5);
        scene.add(pinkLight);
        const blueBacklight = new THREE.PointLight(0x38bdf8, 1.8, 30);
        blueBacklight.position.set(-4, -4, 4);
        scene.add(blueBacklight);

        const mainGroup = new THREE.Group();
        const barGeo = new THREE.CylinderGeometry(0.12, 0.12, 4.6, 32);
        const barMat = new THREE.MeshStandardMaterial({ color: 0xf1f5f9, roughness: 0.25, metalness: 0.85 });
        const barMesh = new THREE.Mesh(barGeo, barMat);
        barMesh.rotation.z = Math.PI / 2;
        mainGroup.add(barMesh);

        const plateMat = new THREE.MeshStandardMaterial({ color: 0xf43f5e, roughness: 0.25, metalness: 0.45, emissive: 0x9f1239, emissiveIntensity: 0.55 });
        const plateGeo = new THREE.CylinderGeometry(1.15, 1.15, 0.35, 36);
        const createdPlates = [];
        const platePositions = [-1.55, -1.95, 1.55, 1.95];
        platePositions.forEach((pos, idx) => {
          const plate = new THREE.Mesh(plateGeo, plateMat);
          plate.rotation.z = Math.PI / 2;
          plate.position.x = pos;
          plate.userData = { baseX: pos, isOuter: idx === 1 || idx === 3 };
          mainGroup.add(plate);
          createdPlates.push(plate);
        });
        platesRef.current = createdPlates;

        const ringGeo = new THREE.TorusGeometry(2.5, 0.035, 16, 100);
        const ringMat = new THREE.MeshBasicMaterial({ color: 0xfb7185, transparent: true, opacity: 0.8 });
        const ringMesh = new THREE.Mesh(ringGeo, ringMat);
        ringRef.current = ringMesh;
        mainGroup.add(ringMesh);

        scene.add(mainGroup);

        let isDragging = false;
        let prevPos = { x: 0, y: 0 };
        const onStart = (e) => { isDragging = true; prevPos = { x: e.clientX || (e.touches && e.touches[0].clientX), y: e.clientY || (e.touches && e.touches[0].clientY) }; };
        const onMove = (e) => {
          if (!isDragging) return;
          const clientX = e.clientX || (e.touches && e.touches[0].clientX);
          const clientY = e.clientY || (e.touches && e.touches[0].clientY);
          mainGroup.rotation.y += (clientX - prevPos.x) * 0.01;
          mainGroup.rotation.x += (clientY - prevPos.y) * 0.01;
          prevPos = { x: clientX, y: clientY };
        };
        const onEnd = () => { isDragging = false; };
        container.addEventListener('mousedown', onStart);
        container.addEventListener('mousemove', onMove);
        window.addEventListener('mouseup', onEnd);
        container.addEventListener('touchstart', onStart);
        container.addEventListener('touchmove', onMove);
        window.addEventListener('touchend', onEnd);

        let reqId;
        const animate = () => {
          reqId = requestAnimationFrame(animate);
          if (!isDragging) { mainGroup.rotation.y += 0.007; mainGroup.rotation.x += 0.003; }
          if (ringRef.current) { ringRef.current.rotation.z += 0.012; ringRef.current.rotation.x += 0.005; }
          const targetR = targetScaleRef.current.r, targetW = targetScaleRef.current.w;
          platesRef.current.forEach((plate) => {
            plate.scale.y += (targetR - plate.scale.y) * 0.1;
            plate.scale.z += (targetR - plate.scale.z) * 0.1;
            plate.scale.x += (targetW - plate.scale.x) * 0.1;
            if (plate.userData.isOuter) {
              const targetX = plate.userData.baseX + (plate.userData.baseX > 0 ? 1 : -1) * (targetW - 1) * 0.35;
              plate.position.x += (targetX - plate.position.x) * 0.1;
            }
          });
          renderer.render(scene, camera);
        };
        animate();
        return () => { cancelAnimationFrame(reqId); container.innerHTML = ''; };
      }, []);

      return (
        <div className="relative w-full h-56 bg-slate-950/90 rounded-2xl border border-slate-800 overflow-hidden shadow-2xl">
          <div ref={mountRef} className="w-full h-full cursor-grab active:cursor-grabbing" />
          <div className="absolute top-3 left-3 bg-slate-900/80 backdrop-blur px-3 py-1.5 rounded-xl border border-slate-700/60 shadow-lg flex items-center gap-2">
            <span className="w-2.5 h-2.5 rounded-full bg-rose-500 animate-pulse"></span>
            <div>
              <p className="text-[9px] font-bold text-slate-400 uppercase tracking-widest leading-tight">3D Load Gauge</p>
              <p className="text-xs font-black text-rose-400 font-mono">{activeWeight.toFixed(1)} kg <span className="text-[10px] text-slate-300 font-normal">({(radiusScale).toFixed(2)}x Plate Scale)</span></p>
            </div>
          </div>
          <div className="absolute bottom-2.5 left-3 text-[10px] text-slate-300 font-semibold bg-slate-900/70 backdrop-blur px-2.5 py-1 rounded-lg border border-slate-800">
            Selected: <span className="text-rose-300">{exerciseName}</span>
          </div>
        </div>
      );
    }

    // --- Main App Controller ---
    function App() {
      const [activeTab, setActiveTab] = useState('workout'); // 'dashboard', 'workout', 'tempo', 'progress'
      const [difficulty, setDifficulty] = useState(() => localStorage.getItem('fm_difficulty') || 'intermediate');
      const [activeDay, setActiveDay] = useState(() => localStorage.getItem('fm_day') || 'A');

      // --- Menstrual Calendar State ---
      const defaultStartDate = () => {
        const d = new Date();
        d.setDate(d.getDate() - 10);
        return d.toISOString().slice(0, 10);
      };
      const [periodStartDate, setPeriodStartDate] = useState(() => localStorage.getItem('fm_period_start') || defaultStartDate());
      const [cycleLengthDays, setCycleLengthDays] = useState(() => parseInt(localStorage.getItem('fm_cycle_len') || '28', 10));
      const [periodDurationDays, setPeriodDurationDays] = useState(() => parseInt(localStorage.getItem('fm_period_dur') || '5', 10));

      // Voice & Audio
      const [voiceEnabled, setVoiceEnabled] = useState(() => localStorage.getItem('fm_voice') !== 'false');
      const [handsFreeListening, setHandsFreeListening] = useState(false);
      const recognitionRef = useRef(null);

      // Tailored workout state
      const [customSets, setCustomSets] = useState(() => JSON.parse(localStorage.getItem('fm_custom_sets') || '{}'));
      const [customReps, setCustomReps] = useState(() => JSON.parse(localStorage.getItem('fm_custom_reps') || '{}'));
      const [customRest, setCustomRest] = useState(() => JSON.parse(localStorage.getItem('fm_custom_rest') || '{}'));
      const [weightLogs, setWeightLogs] = useState(() => JSON.parse(localStorage.getItem('fm_weights') || '{}'));
      const [completedSets, setCompletedSets] = useState(() => JSON.parse(localStorage.getItem('fm_sets') || '{}'));
      const [streakHistory, setStreakHistory] = useState(() => JSON.parse(localStorage.getItem('fm_streak') || '[]'));

      // Daily Dashboard & Body Measurements
      const [dailyLog, setDailyLog] = useState(() => JSON.parse(localStorage.getItem('fm_daily_log') || '{"sleep":8,"stress":4,"soreness":3}'));
      const [bodyMetrics, setBodyMetrics] = useState(() => JSON.parse(localStorage.getItem('fm_body_metrics') || '{"weight":75.0,"waist":78,"hips":102,"thigh":58}'));
      
      const [focusedExerciseId, setFocusedExerciseId] = useState('i_a1');
      const [selectedExercise, setSelectedExercise] = useState(null);

      // Warm-up Guided Player State
      const [showWarmupPlayer, setShowWarmupPlayer] = useState(false);
      const [warmupIndex, setWarmupIndex] = useState(0);
      const [warmupTimer, setWarmupTimer] = useState(45);
      const [warmupRunning, setWarmupRunning] = useState(false);

      // Rest Countdown State
      const [timerSeconds, setTimerSeconds] = useState(60);
      const [targetTimerSec, setTargetTimerSec] = useState(60);
      const [isTimerRunning, setIsTimerRunning] = useState(false);

      // Metronome
      const [metronomeRunning, setMetronomeRunning] = useState(false);
      const [tempoPhase, setTempoPhase] = useState('Lower (3s)');
      const [tempoCount, setTempoCount] = useState(3);

      const fileInputRef = useRef(null);

      // --- Compute Menstrual Cycle Day & Phase Dynamically ---
      const computeCycleData = () => {
        try {
          const today = new Date();
          const start = new Date(periodStartDate);
          const diffMs = today.setHours(0,0,0,0) - start.setHours(0,0,0,0);
          const diffDays = Math.floor(diffMs / (1000 * 60 * 60 * 24));
          const currentDay = (diffDays % cycleLengthDays) + 1;
          const positiveDay = currentDay > 0 ? currentDay : currentDay + cycleLengthDays;

          const ovulationDay = Math.max(10, cycleLengthDays - 14);
          let calculatedPhase = 'follicular';

          if (positiveDay <= periodDurationDays) {
            calculatedPhase = 'menstrual';
          } else if (positiveDay <= ovulationDay - 2) {
            calculatedPhase = 'follicular';
          } else if (positiveDay <= ovulationDay + 1) {
            calculatedPhase = 'ovulatory';
          } else {
            calculatedPhase = 'luteal';
          }

          const daysUntilNextPeriod = cycleLengthDays - positiveDay + 1;

          return {
            cycleDay: positiveDay,
            phaseKey: calculatedPhase,
            ovulationDay,
            daysUntilNextPeriod
          };
        } catch (e) {
          return { cycleDay: 10, phaseKey: 'follicular', ovulationDay: 14, daysUntilNextPeriod: 18 };
        }
      };

      const { cycleDay, phaseKey: activeCyclePhase, ovulationDay, daysUntilNextPeriod } = computeCycleData();

      // --- Persistence ---
      useEffect(() => {
        localStorage.setItem('fm_difficulty', difficulty);
        localStorage.setItem('fm_day', activeDay);
        localStorage.setItem('fm_period_start', periodStartDate);
        localStorage.setItem('fm_cycle_len', cycleLengthDays.toString());
        localStorage.setItem('fm_period_dur', periodDurationDays.toString());
        localStorage.setItem('fm_custom_sets', JSON.stringify(customSets));
        localStorage.setItem('fm_custom_reps', JSON.stringify(customReps));
        localStorage.setItem('fm_custom_rest', JSON.stringify(customRest));
        localStorage.setItem('fm_weights', JSON.stringify(weightLogs));
        localStorage.setItem('fm_sets', JSON.stringify(completedSets));
        localStorage.setItem('fm_streak', JSON.stringify(streakHistory));
        localStorage.setItem('fm_daily_log', JSON.stringify(dailyLog));
        localStorage.setItem('fm_body_metrics', JSON.stringify(bodyMetrics));
        localStorage.setItem('fm_voice', voiceEnabled.toString());
      }, [difficulty, activeDay, periodStartDate, cycleLengthDays, periodDurationDays, customSets, customReps, customRest, weightLogs, completedSets, streakHistory, dailyLog, bodyMetrics, voiceEnabled]);

      // --- Speech Recognition ---
      useEffect(() => {
        const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (SpeechRec) {
          const rec = new SpeechRec();
          rec.continuous = true;
          rec.interimResults = false;
          rec.lang = 'en-US';

          rec.onresult = (e) => {
            const last = e.results.length - 1;
            const command = e.results[last][0].transcript.trim().toLowerCase();
            handleVoiceCommand(command);
          };

          rec.onerror = () => setHandsFreeListening(false);
          recognitionRef.current = rec;
        }
      }, []);

      const toggleHandsFree = () => {
        if (!recognitionRef.current) {
          alert("Speech recognition is not supported in this browser. Please use Chrome or Safari.");
          return;
        }
        if (handsFreeListening) {
          recognitionRef.current.stop();
          setHandsFreeListening(false);
          speakCoach("Voice control paused.", voiceEnabled);
        } else {
          try {
            recognitionRef.current.start();
            setHandsFreeListening(true);
            speakCoach("Voice control active. Say 'Complete Set'.", voiceEnabled);
          } catch (e) {
            setHandsFreeListening(false);
          }
        }
      };

      const handleVoiceCommand = (cmd) => {
        if (cmd.includes("complete") || cmd.includes("done") || cmd.includes("finish") || cmd.includes("next")) {
          triggerNextIncompleteSet();
        } else if (cmd.includes("pause") || cmd.includes("stop")) {
          setIsTimerRunning(false);
          setMetronomeRunning(false);
        } else if (cmd.includes("resume") || cmd.includes("start")) {
          setIsTimerRunning(true);
        } else if (cmd.includes("tempo") || cmd.includes("metronome")) {
          setActiveTab('tempo');
          setMetronomeRunning(true);
        }
      };

      // --- Rest Timer ---
      useEffect(() => {
        let interval = null;
        if (isTimerRunning && timerSeconds > 0) {
          interval = setInterval(() => {
            setTimerSeconds((prev) => {
              if (prev <= 4 && prev > 1) playTone(550, 'triangle', 0.08);
              else if (prev === 1) {
                playTone(880, 'sine', 0.3);
                speakCoach("Break is over. Next set ready.", voiceEnabled);
                autoScrollToNextExercise();
              }
              return prev - 1;
            });
          }, 1000);
        } else if (timerSeconds === 0) {
          setIsTimerRunning(false);
          setTimerSeconds(targetTimerSec);
        }
        return () => clearInterval(interval);
      }, [isTimerRunning, timerSeconds, voiceEnabled, targetTimerSec]);

      // --- Warmup Player Timer ---
      useEffect(() => {
        let timer = null;
        if (warmupRunning && warmupTimer > 0) {
          timer = setInterval(() => setWarmupTimer(prev => prev - 1), 1000);
        } else if (warmupTimer === 0 && warmupRunning) {
          if (warmupIndex < WARMUP_ROUTINE.length - 1) {
            setWarmupIndex(prev => prev + 1);
            setWarmupTimer(WARMUP_ROUTINE[warmupIndex + 1].dur);
            playTone(700, 'sine', 0.2);
            speakCoach(`Next movement: ${WARMUP_ROUTINE[warmupIndex + 1].name}`, voiceEnabled);
          } else {
            setWarmupRunning(false);
            setShowWarmupPlayer(false);
            speakCoach("Warm-up complete! You are primed to lift.", voiceEnabled);
            if (window.confetti) window.confetti({ particleCount: 50, spread: 60 });
          }
        }
        return () => clearInterval(timer);
      }, [warmupRunning, warmupTimer, warmupIndex, voiceEnabled]);

      // --- Metronome ---
      useEffect(() => {
        let timer = null;
        if (metronomeRunning) {
          let step = 0;
          timer = setInterval(() => {
            if (step === 0) { setTempoPhase('Lowering (Down)'); setTempoCount(3); playTone(400, 'sine', 0.06); }
            else if (step === 1) { setTempoCount(2); playTone(400, 'sine', 0.06); }
            else if (step === 2) { setTempoCount(1); playTone(400, 'sine', 0.06); }
            else if (step === 3) { setTempoPhase('Drive Up (Lift)'); setTempoCount(1); playTone(800, 'triangle', 0.1); }
            step = (step + 1) % 4;
          }, 1000);
        }
        return () => clearInterval(timer);
      }, [metronomeRunning]);

      // Readiness & Modifiers
      const readinessScore = Math.max(1, Math.min(10, Math.round(dailyLog.sleep - dailyLog.stress * 0.4 - dailyLog.soreness * 0.4 + 4)));
      const isHighCortisol = readinessScore <= 5;
      const loadMultiplier = (isHighCortisol ? 0.85 : 1.0) * (CYCLE_MODES[activeCyclePhase] ? CYCLE_MODES[activeCyclePhase].modifier : 1.0);

      const currentExercises = MASTER_EXERCISE_DATA[difficulty][activeDay] || MASTER_EXERCISE_DATA.intermediate.A;
      const activeExerciseObj = currentExercises.find(e => e.id === focusedExerciseId) || currentExercises[0];
      const activeExerciseWeight = (weightLogs[activeExerciseObj.id] ?? activeExerciseObj.defaultWeight) * loadMultiplier;

      const autoScrollToNextExercise = () => {
        for (const ex of currentExercises) {
          const sCount = customSets[ex.id] ?? ex.defaultSets;
          for (let i = 0; i < sCount; i++) {
            if (!completedSets[`${ex.id}_set_${i}`]) {
              setFocusedExerciseId(ex.id);
              const el = document.getElementById(`ex_card_${ex.id}`);
              if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
              return;
            }
          }
        }
      };

      const triggerNextIncompleteSet = () => {
        for (const ex of currentExercises) {
          const sCount = customSets[ex.id] ?? ex.defaultSets;
          const rest = customRest[ex.id] ?? ex.defaultRest;
          for (let i = 0; i < sCount; i++) {
            const key = `${ex.id}_set_${i}`;
            if (!completedSets[key]) {
              triggerSetComplete(key, rest, ex.id);
              return;
            }
          }
        }
      };

      const triggerSetComplete = (setKey, restSec, exId) => {
        const nextState = !completedSets[setKey];
        const updated = { ...completedSets, [setKey]: nextState };
        setCompletedSets(updated);

        if (exId) setFocusedExerciseId(exId);

        if (nextState) {
          const duration = restSec || 60;
          setTargetTimerSec(duration);
          setTimerSeconds(duration);
          setIsTimerRunning(true);
          playTone(520, 'sine', 0.1);
          speakCoach(`Good set. Rest for ${duration} seconds.`, voiceEnabled);

          const today = new Date().toISOString().slice(0, 10);
          if (!streakHistory.includes(today)) {
            setStreakHistory([...streakHistory, today]);
          }

          checkWorkoutCompletion(updated);
        }
      };

      const checkWorkoutCompletion = (allSets) => {
        let total = 0;
        let done = 0;
        currentExercises.forEach(ex => {
          const sCount = customSets[ex.id] ?? ex.defaultSets;
          for (let i = 0; i < sCount; i++) {
            total++;
            if (allSets[`${ex.id}_set_${i}`]) done++;
          }
        });

        if (total > 0 && total === done) {
          if (window.confetti) {
            window.confetti({ particleCount: 150, spread: 80, origin: { y: 0.6 } });
          }
          speakCoach("Workout Completed! 100% Volume Locked In!", voiceEnabled);
        }
      };

      const adjustSetCount = (exId, delta, defaultCount) => {
        const currentCount = customSets[exId] ?? defaultCount;
        const newCount = Math.max(1, Math.min(6, currentCount + delta));
        setCustomSets({ ...customSets, [exId]: newCount });
      };

      const adjustRest = (exId, seconds) => {
        setCustomRest({ ...customRest, [exId]: seconds });
        setTargetTimerSec(seconds);
        setTimerSeconds(seconds);
      };

      const applyProgressiveOverload = (exId, currentW) => {
        const newW = currentW + 0.5;
        setWeightLogs({ ...weightLogs, [exId]: newW });
        speakCoach(`Load increased to ${newW.toFixed(1)} kilograms.`, voiceEnabled);
      };

      const exportUserData = () => {
        const backupObj = {
          difficulty, activeDay, periodStartDate, cycleLengthDays, periodDurationDays, customSets, customReps, customRest, weightLogs, completedSets, streakHistory, dailyLog, bodyMetrics, date: new Date().toISOString()
        };
        const blob = new Blob([JSON.stringify(backupObj, null, 2)], { type: "application/json" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = `fem_metabolic_backup_${new Date().toISOString().slice(0, 10)}.json`;
        a.click();
        URL.revokeObjectURL(url);
      };

      const importUserData = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (evt) => {
          try {
            const data = JSON.parse(evt.target.result);
            if (data.difficulty) setDifficulty(data.difficulty);
            if (data.periodStartDate) setPeriodStartDate(data.periodStartDate);
            if (data.cycleLengthDays) setCycleLengthDays(data.cycleLengthDays);
            if (data.periodDurationDays) setPeriodDurationDays(data.periodDurationDays);
            if (data.customSets) setCustomSets(data.customSets);
            if (data.customReps) setCustomReps(data.customReps);
            if (data.customRest) setCustomRest(data.customRest);
            if (data.weightLogs) setWeightLogs(data.weightLogs);
            if (data.completedSets) setCompletedSets(data.completedSets);
            if (data.streakHistory) setStreakHistory(data.streakHistory);
            if (data.bodyMetrics) setBodyMetrics(data.bodyMetrics);
            alert("Backup restored successfully!");
          } catch (err) {
            alert("Invalid backup file.");
          }
        };
        reader.readAsText(file);
      };

      const radius = 22;
      const circumference = 2 * Math.PI * radius;
      const strokeDashoffset = circumference - (timerSeconds / (targetTimerSec || 60)) * circumference;

      return (

              <div className="flex items-center gap-3">
                <svg width="48" height="48" className="w-11 h-11">
                  <circle cx="24" cy="24" r={radius} stroke="#1e293b" strokeWidth="4" fill="transparent" />
                  <circle
                    cx="24"
                    cy="24"
                    r={radius}
                    stroke="#f43f5e"
                    strokeWidth="4"
                    fill="transparent"
                    strokeDasharray={circumference}
                    strokeDashoffset={strokeDashoffset}
                    strokeLinecap="round"
                    className="timer-ring"
                  />
                  <text x="24" y="28" textAnchor="middle" fill="#ffffff" fontSize="11" fontWeight="bold">{timerSeconds}s</text>
                </svg>
                <div>
                  <p className="text-[9px] font-bold uppercase tracking-wider text-slate-400">Break Interval</p>
                  <p className="text-xs text-slate-200 font-bold">{isTimerRunning ? "Resting..." : "Paused"}</p>
                </div>
              </div>
              <div className="flex gap-2">
                <button onClick={() => setIsTimerRunning(!isTimerRunning)} className="bg-rose-600 hover:bg-rose-500 text-white text-xs font-bold px-3.5 py-2 rounded-xl transition-all shadow-md">
                  {isTimerRunning ? "Pause" : "Start"}
                </button>
                <button onClick={() => { setIsTimerRunning(false); setTimerSeconds(targetTimerSec); }} className="bg-slate-800 text-slate-300 text-xs font-bold px-3 py-2 rounded-xl">
                  ↺
                </button>
              </div>
            </div>
          )}

          {/* Thumb-Ergonomic Bottom Navigation */}
          <nav className="fixed bottom-0 left-0 right-0 bg-slate-950 border-t border-slate-800/90 pb-6 pt-3 px-3 flex justify-around items-center z-50 shadow-2xl">
            <button
              onClick={() => setActiveTab('dashboard')}
              className={`flex-1 py-2 rounded-xl text-xs font-bold transition-all flex flex-col items-center gap-1 ${
                activeTab === 'dashboard' ? 'text-rose-500 bg-rose-950/40' : 'text-slate-400 hover:text-slate-200'
              }`}
            >
              <span className="text-base">📊</span>
              <span>Dashboard</span>
            </button>
            <button
              onClick={() => setActiveTab('workout')}
              className={`flex-1 py-2 rounded-xl text-xs font-bold transition-all flex flex-col items-center gap-1 ${
                activeTab === 'workout' ? 'text-rose-500 bg-rose-950/40' : 'text-slate-400 hover:text-slate-200'
              }`}
            >
              <span className="text-base">🏋️</span>
              <span>Workout</span>
            </button>
            <button
              onClick={() => setActiveTab('tempo')}
              className={`flex-1 py-2 rounded-xl text-xs font-bold transition-all flex flex-col items-center gap-1 ${
                activeTab === 'tempo' ? 'text-rose-500 bg-rose-950/40' : 'text-slate-400 hover:text-slate-200'
              }`}
            >
              <span className="text-base">⏱️</span>
              <span>Tempo</span>
            </button>
            <button
              onClick={() => setActiveTab('progress')}
              className={`flex-1 py-2 rounded-xl text-xs font-bold transition-all flex flex-col items-center gap-1 ${
                activeTab === 'progress' ? 'text-rose-500 bg-rose-950/40' : 'text-slate-400 hover:text-slate-200'
              }`}
            >
              <span className="text-base">📈</span>
              <span>Progress</span>
            </button>
          </nav>

          {/* Guided 3-Minute Warmup Modal Player */}
          {showWarmupPlayer && (
            <div className="fixed inset-0 bg-black/90 backdrop-blur-md flex items-center justify-center p-4 z-50">
              <div className="bg-slate-900 border border-slate-700 rounded-3xl max-w-sm w-full p-6 text-center space-y-4 shadow-2xl">
                <div className="flex justify-between items-center">
                  <span className="text-[10px] font-bold text-rose-400 uppercase tracking-wider">Warm-up {warmupIndex + 1} / {WARMUP_ROUTINE.length}</span>
                  <button onClick={() => { setShowWarmupPlayer(false); setWarmupRunning(false); }} className="text-slate-400 text-sm font-bold">✕</button>
                </div>
                <h3 className="text-lg font-black text-white">{WARMUP_ROUTINE[warmupIndex].name}</h3>
                <div className="w-24 h-24 rounded-full bg-rose-600/20 border-2 border-rose-500 mx-auto flex items-center justify-center">
                  <span className="text-3xl font-black font-mono text-white">{warmupTimer}s</span>
                </div>
                <p className="text-xs text-slate-300 bg-slate-950 p-3 rounded-xl border border-slate-800 leading-relaxed">
                  {WARMUP_ROUTINE[warmupIndex].cue}
                </p>
                <div className="flex gap-2">
                  <button
                    onClick={() => {
                      if (warmupIndex < WARMUP_ROUTINE.length - 1) {
                        setWarmupIndex(prev => prev + 1);
                        setWarmupTimer(WARMUP_ROUTINE[warmupIndex + 1].dur);
                      } else {
                        setShowWarmupPlayer(false);
                      }
                    }}
                    className="flex-1 bg-slate-800 text-slate-200 py-2.5 rounded-xl text-xs font-bold"
                  >
                    Skip Movement
                  </button>
                  <button
                    onClick={() => setWarmupRunning(!warmupRunning)}
                    className="flex-1 bg-rose-600 text-white py-2.5 rounded-xl text-xs font-bold shadow-lg"
                  >
                    {warmupRunning ? "Pause" : "Resume"}
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* Exercise Form Modal with Anatomical Heatmap */}
          {selectedExercise && (
            <div className="fixed inset-0 bg-black/90 backdrop-blur-md flex items-center justify-center p-4 z-50">
              <div className="bg-slate-900 border border-slate-700 rounded-3xl max-w-sm w-full overflow-hidden shadow-2xl flex flex-col max-h-[90vh]">
                <div className="relative h-44 bg-slate-950 shrink-0">
                  <img src={selectedExercise.gifUrl} alt={selectedExercise.name} className="w-full h-full object-cover opacity-80" />
                  <button onClick={() => setSelectedExercise(null)} className="absolute top-3 right-3 bg-black/60 text-white rounded-full w-7 h-7 flex items-center justify-center font-bold text-xs border border-slate-500 backdrop-blur">✕</button>
                  <div className="absolute bottom-2 left-3 bg-slate-950/80 backdrop-blur px-2.5 py-0.5 rounded-full border border-rose-500/50">
                    <span className="text-[10px] text-rose-400 font-mono font-bold">Tempo: {selectedExercise.tempo}</span>
                  </div>
                </div>

                <div className="p-4 overflow-y-auto space-y-3">
                  <div>
                    <h3 className="text-base font-black text-white leading-tight">{selectedExercise.name}</h3>
                    <p className="text-[11px] text-rose-400 font-bold uppercase tracking-wider mt-0.5">Target: {selectedExercise.target}</p>
                  </div>

                  <div>
                    <p className="text-[9px] font-bold text-slate-400 uppercase tracking-widest mb-1.5">Anatomical Heatmap</p>
                    <MuscleHeatmap activeMuscles={[selectedExercise.primaryMuscle]} scale={0.8} />
                  </div>

                  <div className="bg-slate-950 p-3 rounded-xl border border-slate-800 text-xs text-slate-300 leading-relaxed">
                    <p><strong>Form Execution:</strong> {selectedExercise.cues}</p>
                  </div>

                  <button onClick={() => setSelectedExercise(null)} className="w-full bg-rose-600 hover:bg-rose-500 text-white py-3 rounded-xl font-bold text-xs transition-all shadow-lg shadow-rose-900/50">
                    Close Form Guide
                  </button>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
