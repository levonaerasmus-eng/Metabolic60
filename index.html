      constructor(props) {
        super(props);
        this.state = { hasError: false };
      }
      static getDerivedStateFromError() {
        return { hasError: true };
      }
      componentDidCatch(error, info) {
        console.error("M60 Runtime Error:", error, info);
      }
      render() {
        if (this.state.hasError) {
          return (

    const getSafeStored = (key, fallback) => {
      try {
        const item = localStorage.getItem(key);
        if (!item || item === "undefined" || item === "null") return fallback;
        const parsed = JSON.parse(item);
        if (Array.isArray(fallback) && !Array.isArray(parsed)) return fallback;
        if (typeof fallback === "object" && !Array.isArray(fallback) && (typeof parsed !== "object" || Array.isArray(parsed) || parsed === null)) return fallback;
        return parsed;
      } catch (e) {
        return fallback;
      }
    };

    const setSafeStored = (key, val) => {
      try { localStorage.setItem(key, JSON.stringify(val)); } catch (e) {}
    };

    const getLocalDateStr = (d = new Date()) => {
      try {
        const year = d.getFullYear();
        const month = String(d.getMonth() + 1).padStart(2, '0');
        const day = String(d.getDate()).padStart(2, '0');

    const STORE_NAME = 'user_data';

    const initDB = async () => {
      if (typeof window === 'undefined' || !window.idb) return null;
      try {
        return await idb.openDB(DB_NAME, 1, {
          upgrade(db) {

            }

        return null;

    const getIDBItem = async (key, fallback) => {
      try {
        const db = await initDB();
        if (!db) return getSafeStored(key, fallback);
        const val = await db.get(STORE_NAME, key);
        return (val !== undefined && val !== null) ? val : getSafeStored(key, fallback);
      } catch (e) {
        return getSafeStored(key, fallback);
      }
    };

    const setIDBItem = async (key, val) => {
      try {

      try {
        if (!sharedAudioCtx && typeof window !== 'undefined') {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (AudioCtx) sharedAudioCtx = new AudioCtx();
        }
        if (sharedAudioCtx && sharedAudioCtx.state === 'suspended') {

        }

      return sharedAudioCtx;

    const unlockAudioAndSpeech = () => {
      try {
        const ctx = getAudioContext();
        if (ctx) {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          gain.gain.value = 0.001;
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start();
          osc.stop(ctx.currentTime + 0.01);
        }
        if (typeof window !== 'undefined' && 'speechSynthesis' in window && window.speechSynthesis && window.speechSynthesis.paused) {

      try {
        const ctx = getAudioContext();
        if (!ctx) return;
        notes.forEach((freq, idx) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.value = freq;
          const startTime = ctx.currentTime + (idx * 0.07);
          gain.gain.setValueAtTime(0.04 * (Number(vol) || 1.0), startTime);
          gain.gain.exponentialRampToValueAtTime(0.0001, startTime + dur);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(startTime);
          osc.stop(startTime + dur);
        });
      } catch (e) {}
    };

          return { day, phase, info: CYCLE_MODES[phase] || CYCLE_MODES.follicular };

                    }`}
                  >
                    {activeModalPacing ? "Pause Cadence Guide" : "Start Live Tempo Guide"}
                  </button>
                </div>

                <div className={`p-3.5 rounded-2xl border text-xs ${darkMode ? 'bg-[#1E1918] border-rose-900/30' : 'bg-white border-blush-100'}`}>
                  <p className="leading-relaxed"><strong className="text-blush-600 dark:text-rose-400 font-semibold">Mind-Muscle Cue:</strong> {activeModalExercise.cues}</p>
                  <div className="space-y-1 pt-1.5 border-t border-blush-50 dark:border-rose-900/30 mt-2">
                    <span className="text-[9px] font-bold uppercase text-mutedMauve">Execution Breakdown:</span>
                    <ol className={`list-decimal list-inside space-y-1 text-[11px] leading-relaxed ${darkMode ? 'text-champagne/90' : 'text-charcoal/80'}`}>
                      {activeModalExercise.execution ? activeModalExercise.execution.map((st, i) => (
                        <li key={i}>{st}</li>
                      )) : <li>Maintain core stability and strict cadence through the full range of motion.</li>}
                    </ol>
                  </div>
                </div>

                <button
                  onClick={() => {
                    startManualTimer(activeModalExercise.rest || 60);
                    setActiveModalExercise(null);
                    setActiveModalPacing(false);
                  }}
                  className="w-full py-2.5 rounded-xl bg-blush-500 text-white text-xs font-bold shadow-sm hover:bg-blush-600 transition-all"
                >
                  Start Rest Interval ({activeModalExercise.rest}s)
                </button>
              </div>
            </div>
          )}

          {/* 5-STEP GUIDED ONBOARDING WIZARD */}
          {showOnboardingModal && (
            <div className="fixed inset-0 bg-charcoal/40 backdrop-blur-sm flex items-center justify-center p-4 z-50 overflow-y-auto">
              <div className={`rounded-3xl p-5 max-w-sm w-full space-y-4 my-auto border-blush-300 shadow-2xl card-light ${darkMode ? 'bg-[#2D2726] border-rose-500 text-champagne' : 'bg-white text-charcoal'}`}>
                
                <div className="flex justify-between items-center border-b border-blush-100 dark:border-rose-900/30 pb-3">
                  <div>
                    <span className="text-[9px] font-bold text-roseGold uppercase tracking-widest">Personalization</span>
                    <h3 className="text-sm font-serif font-bold">Step {onboardingStep} of 5</h3>
                  </div>
                  <span className="text-xs font-mono font-bold text-mutedMauve">{Math.round((onboardingStep / 5) * 100)}%</span>
                </div>

                {onboardingStep === 1 && (
                  <div className="space-y-3.5">
                    <div>
                      <h4 className="text-base font-serif font-bold">Welcome, Beautiful</h4>
                      <p className="text-xs text-mutedMauve mt-0.5">Let's tailor your metabolic calibration.</p>
                    </div>
                    <div className="space-y-3">
                      <div>
                        <label className="block text-[10px] font-bold text-mutedMauve uppercase mb-1">Your First Name</label>
                        <input
                          type="text"
                          value={tempProfile.name}
                          onChange={e => setTempProfile({ ...tempProfile, name: e.target.value })}
                          placeholder="e.g. Lindiwe"
                          className={`w-full text-xs font-bold p-3 rounded-xl focus:outline-none border ${darkMode ? 'bg-[#1E1918] text-champagne border-rose-900/40' : 'bg-blush-50 text-charcoal border-blush-200'}`}
                        />
                      </div>
                      <div>
                        <label className="block text-[10px] font-bold text-mutedMauve uppercase mb-1">Your Age</label>
                        <input
                          type="number"
                          value={tempProfile.age === '' ? '' : tempProfile.age}
                          onChange={e => {
                            const v = e.target.value;
                            setTempProfile({ ...tempProfile, age: v === '' ? '' : parseInt(v, 10) });
                          }}
                          className={`w-full text-xs font-bold p-3 rounded-xl focus:outline-none border ${darkMode ? 'bg-[#1E1918] text-champagne border-rose-900/40' : 'bg-blush-50 text-charcoal border-blush-200'}`}
                        />
                      </div>
                    </div>
                  </div>
                )}

                {onboardingStep === 2 && (
                  <div className="space-y-3">
                    <div>
                      <h4 className="text-sm font-serif font-bold">Select Your Somatotype</h4>
                      <p className="text-[11px] text-mutedMauve">Customizes your insulin sensitivity & carbohydrate split.</p>
                    </div>
                    <div className="space-y-2">
                      {[
                        { type: "Endomorph", desc: "Curves easily, higher carb sensitivity. Thrives on 40P/30C/30F.", img: "https://images.unsplash.com/photo-1518611012118-696072aa579a?auto=format&fit=crop&w=400&q=80" },
                        { type: "Mesomorph", desc: "Athletic structure, sculpts muscle rapidly, handles moderate carbs efficiently.", img: "https://images.unsplash.com/photo-1534438327276-14e5300c3a48?auto=format&fit=crop&w=400&q=80" },
                        { type: "Ectomorph", desc: "Naturally lean structure, fast metabolic burn, excels with higher carb allocation.", img: "https://images.unsplash.com/photo-1571019613454-1cb2f99b2d8b?auto=format&fit=crop&w=400&q=80" }
                      ].map(s => (
                        <div
                          key={s.type}
                          onClick={() => { setTempProfile({ ...tempProfile, somatotype: s.type }); if (hapticsEnabled) triggerHaptic(10); }}
                          className={`p-2.5 rounded-2xl border cursor-pointer flex items-center gap-3 transition-all ${
                            tempProfile.somatotype === s.type 
                              ? (darkMode ? 'bg-rose-950/60 border-rose-500 shadow-sm' : 'bg-blush-50 border-blush-500 shadow-sm') 
                              : (darkMode ? 'bg-[#1E1918] border-rose-900/30' : 'bg-white border-blush-200')
                          }`}
                        >
                          <img src={s.img} alt={s.type} className="w-12 h-12 rounded-xl object-cover shrink-0 border border-blush-200" />
                          <div className="flex-1">
                            <span className="text-xs font-serif font-bold">{s.type}</span>
                            <p className="text-[10px] text-mutedMauve leading-tight mt-0.5">{s.desc}</p>
                          </div>
                        </div>
                      ))}
                    </div>
                  </div>
                )}

                {onboardingStep === 3 && (
                  <div className="space-y-3">
                    <div>
                      <h4 className="text-sm font-serif font-bold">Starting Measurements</h4>
                      <p className="text-[11px] text-mutedMauve">Calibrates your baseline energy output equation.</p>
                    </div>
                    <div className="grid grid-cols-2 gap-2.5">
                      <div>
                        <label className="block text-[9px] font-bold text-mutedMauve uppercase mb-1">Height (cm)</label>
                        <input
                          type="number"
                          value={tempProfile.height === '' ? '' : tempProfile.height}
                          onChange={e => {
                            const v = e.target.value;
                            setTempProfile({ ...tempProfile, height: v === '' ? '' : parseInt(v, 10) });
                          }}
                          className={`w-full p-2.5 text-xs font-bold rounded-xl border ${darkMode ? 'bg-[#1E1918] text-champagne border-rose-900/40' : 'bg-blush-50 text-charcoal border-blush-200'}`}
                        />
                      </div>
                      <div>
                        <label className="block text-[9px] font-bold text-mutedMauve uppercase mb-1">Current Weight (kg)</label>
                        <input
                          type="number"
                          step="0.1"
                          value={tempProfile.currentWeight === '' ? '' : tempProfile.currentWeight}
                          onChange={e => {
                            const v = e.target.value;
                            setTempProfile({ ...tempProfile, currentWeight: v === '' ? '' : parseFloat(v) });
                          }}
                          className={`w-full p-2.5 text-xs font-bold rounded-xl border ${darkMode ? 'bg-[#1E1918] text-champagne border-rose-900/40' : 'bg-blush-50 text-charcoal border-blush-200'}`}
                        />
                      </div>
                      <div>
                        <label className="block text-[9px] font-bold text-mutedMauve uppercase mb-1">Target Weight (kg)</label>
                        <input
                          type="number"
                          step="0.1"
                          value={tempProfile.targetWeight === '' ? '' : tempProfile.targetWeight}
                          onChange={e => {
                            const v = e.target.value;
                            setTempProfile({ ...tempProfile, targetWeight: v === '' ? '' : parseFloat(v) });
                          }}
                          className={`w-full p-2.5 text-xs font-bold rounded-xl border ${darkMode ? 'bg-[#1E1918] text-champagne border-rose-900/40' : 'bg-blush-50 text-charcoal border-blush-200'}`}
                        />
                      </div>
                      <div>
                        <label className="block text-[9px] font-bold text-mutedMauve uppercase mb-1">Waist (cm)</label>
                        <input
                          type="number"
                          value={tempProfile.waist === '' ? '' : tempProfile.waist}
                          onChange={e => {
                            const v = e.target.value;
                            setTempProfile({ ...tempProfile, waist: v === '' ? '' : parseInt(v, 10) });
                          }}
                          className={`w-full p-2.5 text-xs font-bold rounded-xl border ${darkMode ? 'bg-[#1E1918] text-champagne border-rose-900/40' : 'bg-blush-50 text-charcoal border-blush-200'}`}
                        />
                      </div>
                    </div>
                  </div>
                )}

                {onboardingStep === 4 && (
                  <div className="space-y-3">
                    <div>
                      <h4 className="text-sm font-serif font-bold">Your Focus Transformation Goal</h4>
                      <p className="text-[11px] text-mutedMauve">Customizes training volume and progressive overload.</p>
                    </div>
                    <div className="space-y-2">
                      {["Fat Loss & Metabolic Reset", "Glute Lift & Waist Taper", "Full Body Recomposition & Tone"].map(g => (
                        <div
                          key={g}
                          onClick={() => { setTempProfile({ ...tempProfile, goal: g }); if (hapticsEnabled) triggerHaptic(8); }}
                          className={`p-3 rounded-2xl border text-xs font-bold cursor-pointer transition-all ${
                            tempProfile.goal === g 
                              ? (darkMode ? 'bg-rose-950/60 border-rose-500 text-rose-300 font-serif' : 'bg-blush-50 border-blush-500 text-blush-600 font-serif') 
                              : (darkMode ? 'bg-[#1E1918] border-rose-900/30 text-champagne' : 'bg-white border-blush-200 text-charcoal')
                          }`}
                        >
                          {g}
                        </div>
                      ))}
                    </div>
                    <div className="pt-2">
                      <label className="block text-[9px] font-bold text-mutedMauve uppercase mb-1">Experience Level</label>
                      <div className="flex gap-2">
                        {["Beginner", "Intermediate", "Advanced"].map(exp => (
                          <button
                            key={exp}
                            onClick={() => {
                              setTempProfile({ ...tempProfile, experience: exp });
                              setDifficulty(exp.toLowerCase());
                              if (hapticsEnabled) triggerHaptic(8);
                            }}
                            className={`flex-1 py-2 rounded-xl text-[11px] font-bold capitalize border transition-all ${
                              tempProfile.experience.toLowerCase() === exp.toLowerCase() 
                                ? "bg-blush-500 text-white border-blush-500 shadow-sm" 
                                : (darkMode ? 'bg-[#1E1918] text-mutedMauve border-rose-900/40' : 'bg-white text-mutedMauve border-blush-200')
                            }`}
                          >
                            {exp}
                          </button>
                        ))}
                      </div>
                    </div>
                  </div>
                )}

                {onboardingStep === 5 && (
                  <div className="space-y-3.5 text-center">
                    <div className="w-12 h-12 rounded-full bg-gradient-to-tr from-blush-300 via-blush-400 to-roseGold text-white flex items-center justify-center mx-auto text-sm font-serif font-black shadow-sm">
                      M60
                    </div>
                    <div>
                      <h4 className="text-base font-serif font-bold">Ready to Bloom, {tempProfile.name}!</h4>
                      <p className="text-xs text-mutedMauve mt-1">Caloric targets & strength metrics calibrated for your {tempProfile.somatotype} structure.</p>
                    </div>
                  </div>
                )}

                <div className="flex gap-2 pt-2 border-t border-blush-100 dark:border-rose-900/30">
                  {onboardingStep > 1 && (
                    <button
                      onClick={() => { setOnboardingStep(prev => prev - 1); if (hapticsEnabled) triggerHaptic(8); }}
                      className={`px-4 py-2.5 rounded-xl text-xs font-bold ${darkMode ? 'bg-[#1E1918] text-rose-300' : 'bg-blush-50 text-mutedMauve hover:text-charcoal'}`}
                    >
                      Back
                    </button>
                  )}
                  {onboardingStep < 5 ? (
                    <button
                      onClick={() => { setOnboardingStep(prev => prev + 1); if (hapticsEnabled) triggerHaptic(12); }}
                      className="flex-1 py-2.5 rounded-xl bg-blush-500 text-white text-xs font-bold shadow-sm"
                    >
                      Continue →
                    </button>
                  ) : (
                    <button
                      onClick={completeOnboarding}
                      className="flex-1 py-3 rounded-xl bg-gradient-to-r from-blush-400 via-blush-500 to-roseGold text-white text-xs font-bold shadow-md"
                    >
                      Launch M60 ✨
                    </button>
                  )}
                </div>

              </div>
            </div>
          )}

          {/* BOTTOM NAVIGATION DOCK (7 TABS) */}
          <nav className={`fixed bottom-0 left-0 right-0 backdrop-blur border-t px-1 py-2 flex justify-around items-center z-40 shadow-sm ${darkMode ? 'bg-[#1E1918]/95 border-rose-900/40' : 'bg-white/95 border-blush-200'}`}>
            <button onClick={() => { setTab("train"); if (hapticsEnabled) triggerHaptic(10); }} className={`flex flex-col items-center gap-0.5 text-xs ${tab === "train" ? (darkMode ? 'text-rose-400 font-bold' : 'text-blush-600 font-bold') : 'text-mutedMauve'}`}>
              <span className="text-base">🌸</span><span className="text-[8px]">Train</span>
            </button>
            <button onClick={() => { setTab("fuel"); if (hapticsEnabled) triggerHaptic(10); }} className={`flex flex-col items-center gap-0.5 text-xs ${tab === "fuel" ? (darkMode ? 'text-rose-400 font-bold' : 'text-blush-600 font-bold') : 'text-mutedMauve'}`}>
              <span className="text-base">🥗</span><span className="text-[8px]">Fuel</span>
            </button>
            <button onClick={() => { setTab("progress"); if (hapticsEnabled) triggerHaptic(10); }} className={`flex flex-col items-center gap-0.5 text-xs ${tab === "progress" ? (darkMode ? 'text-rose-400 font-bold' : 'text-blush-600 font-bold') : 'text-mutedMauve'}`}>
              <span className="text-base">🗓️</span><span className="text-[8px]">Calendar</span>
            </button>
            <button onClick={() => { setTab("vault"); if (hapticsEnabled) triggerHaptic(10); }} className={`flex flex-col items-center gap-0.5 text-xs ${tab === "vault" ? (darkMode ? 'text-rose-400 font-bold' : 'text-blush-600 font-bold') : 'text-mutedMauve'}`}>
              <span className="text-base">📸</span><span className="text-[8px]">Vault</span>
            </button>
            <button onClick={() => { setTab("profile"); if (hapticsEnabled) triggerHaptic(10); }} className={`flex flex-col items-center gap-0.5 text-xs ${tab === "profile" ? (darkMode ? 'text-rose-400 font-bold' : 'text-blush-600 font-bold') : 'text-mutedMauve'}`}>
              <span className="text-base">✨</span><span className="text-[8px]">Profile</span>
            </button>
            <button onClick={() => { setTab("settings"); if (hapticsEnabled) triggerHaptic(10); }} className={`flex flex-col items-center gap-0.5 text-xs ${tab === "settings" ? (darkMode ? 'text-rose-400 font-bold' : 'text-blush-600 font-bold') : 'text-mutedMauve'}`}>
              <span className="text-base">⚙️</span><span className="text-[8px]">Settings</span>
            </button>
            <button onClick={() => { setTab("about"); if (hapticsEnabled) triggerHaptic(10); }} className={`flex flex-col items-center gap-0.5 text-xs ${tab === "about" ? (darkMode ? 'text-rose-400 font-bold' : 'text-blush-600 font-bold') : 'text-mutedMauve'}`}>
              <span className="text-base">📜</span><span className="text-[8px]">About</span>
            </button>
          </nav>

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(
      <ErrorBoundary>
        <App />
      </ErrorBoundary>
    );
  </script>

  <!-- PWA Service Worker Registration -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then((reg) => console.log('Service Worker registered:', reg.scope))
          .catch((err) => console.error('Service Worker registration failed:', err));
      });
    }
  </script>
</body>
</html>
